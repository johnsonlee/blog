name: Pull request checks

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: npm ci
      - name: Install OG card dependencies
        run: |
          pip install Pillow
          sudo apt-get install -y fonts-wqy-zenhei
      - name: Build
        run: npm run build
