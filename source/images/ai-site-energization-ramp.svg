<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">262MW 为什么只能先拿到 18MVA？</title><desc id="desc">临时桥接容量、永久项目与最终满负荷之间相隔多年。</desc><rect width="1440" height="920" fill="#F7F9FC"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style><text x="70" y="70" fill="#172033" font-size="30" font-weight="800" text-anchor="start"><tspan x="70" dy="0">262MW 为什么只能先拿到 18MVA？</tspan></text><line x1="150" y1="665" x2="1270" y2="665" stroke="#26364D" stroke-width="3"/><rect x="80" y="595" width="140" height="70" rx="6" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="150" y="575" fill="#2563EB" font-size="19" font-weight="800" text-anchor="middle"><tspan x="150" dy="0">原计划送电</tspan></text><text x="150" y="715" fill="#172033" font-size="20" font-weight="800" text-anchor="middle"><tspan x="150" dy="0">2025</tspan></text><text x="150" y="752" fill="#5E6B7E" font-size="17" font-weight="600" text-anchor="middle"><tspan x="150" dy="0">客户原计划</tspan></text><line x1="225" y1="590" x2="341" y2="590" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="355,590 341,583 341,597" fill="#26364D"/><rect x="360" y="570" width="140" height="95" rx="6" fill="#FFF0CC" stroke="#C77800" stroke-width="2"/><text x="430" y="550" fill="#C77800" font-size="19" font-weight="800" text-anchor="middle"><tspan x="430" dy="0">7 + 11 = 18MVA</tspan></text><text x="430" y="715" fill="#172033" font-size="20" font-weight="800" text-anchor="middle"><tspan x="430" dy="0">2025–26</tspan></text><text x="430" y="752" fill="#5E6B7E" font-size="17" font-weight="600" text-anchor="middle"><tspan x="430" dy="0">临时桥接</tspan></text><line x1="505" y1="587.5" x2="621" y2="587.5" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="635,587.5 621,580.5 621,594.5" fill="#26364D"/><rect x="640" y="590" width="140" height="75" rx="6" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="710" y="570" fill="#2563EB" font-size="19" font-weight="800" text-anchor="middle"><tspan x="710" dy="0">4 MW 夏峰</tspan></text><text x="710" y="715" fill="#172033" font-size="20" font-weight="800" text-anchor="middle"><tspan x="710" dy="0">2027</tspan></text><text x="710" y="752" fill="#5E6B7E" font-size="17" font-weight="600" text-anchor="middle"><tspan x="710" dy="0">永久项目投运</tspan></text><line x1="785" y1="587.5" x2="901" y2="587.5" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="915,587.5 901,580.5 901,594.5" fill="#26364D"/><rect x="920" y="425" width="140" height="240" rx="6" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="990" y="405" fill="#2563EB" font-size="19" font-weight="800" text-anchor="middle"><tspan x="990" dy="0">受批准容量约束</tspan></text><text x="990" y="715" fill="#172033" font-size="20" font-weight="800" text-anchor="middle"><tspan x="990" dy="0">2028–36</tspan></text><text x="990" y="752" fill="#5E6B7E" font-size="17" font-weight="600" text-anchor="middle"><tspan x="990" dy="0">逐年升载</tspan></text><line x1="1065" y1="505" x2="1181" y2="505" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="1195,505 1181,498 1181,512" fill="#26364D"/><rect x="1200" y="145" width="140" height="520" rx="6" fill="#DDF4EC" stroke="#0F8A6A" stroke-width="2"/><text x="1270" y="125" fill="#0F8A6A" font-size="24" font-weight="800" text-anchor="middle"><tspan x="1270" dy="0">262 MW</tspan></text><text x="1270" y="715" fill="#172033" font-size="20" font-weight="800" text-anchor="middle"><tspan x="1270" dy="0">2037</tspan></text><text x="1270" y="752" fill="#5E6B7E" font-size="17" font-weight="600" text-anchor="middle"><tspan x="1270" dy="0">满负荷目标</tspan></text><rect x="150" y="805" width="1120" height="70" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="710" y="848" fill="#172033" font-size="21" font-weight="700" text-anchor="middle"><tspan x="710" dy="0">“已送电”只说明某个容量台阶已经打开，不说明 262 MW 已经可用</tspan></text></svg>
