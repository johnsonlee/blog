<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">2031-10-31 依赖哪些条件同时兑现？</title><desc id="desc">投运日期从 AEP 假设走到 PJM 批准，但仍受路权、设备、施工和成本约束。</desc><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}.compact{font-size:17px}.body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}.number{font-size:38px;font-weight:780}.metric{font-size:28px;font-weight:760}.node{font-size:12px;font-weight:760}.inverse{fill:#ffffff}</style><rect width="1600" height="820" fill="#f7f9fc"/><text x="800" y="58" class="title" text-anchor="middle">2031-10-31 依赖哪些条件同时兑现？</text><text x="80" y="118" class="small" text-anchor="start">日期怎样从假设走向现实</text><rect x="80" y="145" width="285" height="145" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="105" y="180" class="small" text-anchor="start" style="fill:#607089">2025 NOV</text><text x="105" y="220" class="head" text-anchor="start">AEP 建模假设</text><text x="105" y="260" class="small" text-anchor="start">Proposal 570 尚未中选</text><line x1="365" y1="217" x2="391" y2="217" stroke="#607089" stroke-width="3" stroke-linecap="round"/><polygon points="391,209 405,217 391,225" fill="#607089"/><rect x="410" y="145" width="285" height="145" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="435" y="180" class="small" text-anchor="start" style="fill:#607089">2026 FEB 12</text><text x="435" y="220" class="head" text-anchor="start">PJM 董事会批准</text><text x="435" y="260" class="small" text-anchor="start">方案成为 b4068</text><line x1="695" y1="217" x2="721" y2="217" stroke="#607089" stroke-width="3" stroke-linecap="round"/><polygon points="721,209 735,217 721,225" fill="#607089"/><rect x="740" y="145" width="285" height="145" rx="6" fill="#e8f5ed" stroke="#288c5a" stroke-width="2"/><text x="765" y="180" class="small" text-anchor="start" style="fill:#288c5a">最新 BASELINE</text><text x="765" y="220" class="head" text-anchor="start">Projected in service</text><text x="765" y="260" class="small" text-anchor="start">2031-10-31</text><text x="80" y="360" class="small" text-anchor="start">仍需闭合的执行条件</text><rect x="80" y="390" width="160" height="95" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="160" y="447" class="head compact" text-anchor="middle" style="fill:#172033">ROUTE / SITING</text><line x1="240" y1="438" x2="276" y2="438" stroke="#607089" stroke-width="3" stroke-linecap="round"/><polygon points="276,430 290,438 276,446" fill="#607089"/><rect x="290" y="390" width="160" height="95" rx="6" fill="#ffffff" stroke="#cf3f4f" stroke-width="2"/><text x="370" y="447" class="head compact" text-anchor="middle" style="fill:#cf3f4f">RIGHT OF WAY</text><line x1="450" y1="438" x2="486" y2="438" stroke="#607089" stroke-width="3" stroke-linecap="round"/><polygon points="486,430 500,438 486,446" fill="#607089"/><rect x="500" y="390" width="160" height="95" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="580" y="447" class="head compact" text-anchor="middle" style="fill:#172033">长周期设备</text><line x1="660" y1="438" x2="696" y2="438" stroke="#607089" stroke-width="3" stroke-linecap="round"/><polygon points="696,430 710,438 696,446" fill="#607089"/><rect x="710" y="390" width="160" height="95" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="790" y="447" class="head compact" text-anchor="middle" style="fill:#172033">线路 + 变电站</text><line x1="870" y1="438" x2="906" y2="438" stroke="#607089" stroke-width="3" stroke-linecap="round"/><polygon points="906,430 920,438 906,446" fill="#607089"/><rect x="920" y="390" width="160" height="95" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1000" y="447" class="head compact" text-anchor="middle" style="fill:#172033">系统联调</text><rect x="1120" y="145" width="400" height="500" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1160" y="190" class="head" text-anchor="start">PJM CONSTRUCTABILITY</text><text x="1160" y="245" class="small" text-anchor="start">Proposal cost</text><text x="1480" y="245" class="head" text-anchor="end" style="fill:#172033">27.75 亿美元</text><line x1="1160" y1="267" x2="1480" y2="267" stroke="#d8e0e9" stroke-width="1" stroke-linecap="round"/><text x="1160" y="317" class="small" text-anchor="start">Independent estimate</text><text x="1480" y="317" class="head" text-anchor="end" style="fill:#172033">40.26 亿美元</text><line x1="1160" y1="339" x2="1480" y2="339" stroke="#d8e0e9" stroke-width="1" stroke-linecap="round"/><text x="1160" y="389" class="small" text-anchor="start">估算差额</text><text x="1480" y="389" class="head" text-anchor="end" style="fill:#cf3f4f">+45%</text><line x1="1160" y1="411" x2="1480" y2="411" stroke="#d8e0e9" stroke-width="1" stroke-linecap="round"/><text x="1160" y="461" class="small" text-anchor="start">Schedule risk</text><text x="1480" y="461" class="head" text-anchor="end" style="fill:#cf3f4f">MEDIUM</text><line x1="1160" y1="483" x2="1480" y2="483" stroke="#d8e0e9" stroke-width="1" stroke-linecap="round"/><text x="1160" y="533" class="small" text-anchor="start">ROW / land risk</text><text x="1480" y="533" class="head" text-anchor="end" style="fill:#cf3f4f">MEDIUM-HIGH</text><rect x="80" y="580" width="955" height="65" rx="6" fill="#fff5d6" stroke="#c58d0a" stroke-width="2"/><text x="557" y="620" class="head" text-anchor="middle">Projected 说明日期有依据，不代表日期有保证。</text><rect x="270" y="710" width="1060" height="64" rx="6" fill="#19243a" stroke="#19243a" stroke-width="0"/><text x="800" y="750" class="head inverse" text-anchor="middle">少一段 easement，晚一台 breaker，整张网络都不能投运。</text></svg>