<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" role="img" aria-labelledby="title desc">
  <title id="title">AI 数据中心 Alpha 地图</title>
  <desc id="desc">横轴是从选址到正式运行的交付生命周期，纵轴是设施、AI 基础设施与工作负载交付系统。十三篇文章沿两条轴定位复制缺口。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1}.grid{stroke:#dbe2ea;stroke-width:1}.milestone{stroke:#fff;stroke-width:2}
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .axis{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.phase{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}.phase-note{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e2e8f0;text-anchor:middle}
      .group{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.row{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}.small{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.bartext{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}.legend{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .development{fill:#475569}.build{fill:#b45309}.facility{fill:#047857}.cluster{fill:#1d4ed8}.operations{fill:#7e22ce}
      .overview{fill:#334155}.power{fill:#c2410c}.thermal{fill:#0f766e}.handoff{fill:#15803d}.compute{fill:#1d4ed8}.data{fill:#6d28d9}.service{fill:#be185d}.case{fill:#b91c1c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1560"/>
  <text class="title" x="44" y="58">AI 数据中心 Alpha 地图</text>
  <text class="subtitle" x="44" y="88">沿交付生命周期与基础设施栈，追踪复制缺口和瓶颈迁移</text>

  <text class="axis" x="1000" y="128" text-anchor="middle">数据中心交付生命周期</text>
  <path d="M280 145H1535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="development milestone" x="260" y="166" width="230" height="76" rx="6"/>
  <text class="phase" x="375" y="196">前期开发</text><text class="phase-note" x="375" y="218">选址 · 审批</text>
  <rect class="build milestone" x="490" y="166" width="250" height="76" rx="6"/>
  <text class="phase" x="615" y="196">建设</text><text class="phase-note" x="615" y="218">设计 · 采购 · 施工</text>
  <rect class="facility milestone" x="740" y="166" width="250" height="76" rx="6"/>
  <text class="phase" x="865" y="196">设施交付</text><text class="phase-note" x="865" y="218">送电 · 系统调试 · RFS</text>
  <rect class="cluster milestone" x="990" y="166" width="280" height="76" rx="6"/>
  <text class="phase" x="1130" y="196">集群交付</text><text class="phase-note" x="1130" y="218">IT 设备部署 · 集群验证</text>
  <rect class="operations milestone" x="1270" y="166" width="286" height="76" rx="6"/>
  <text class="phase" x="1413" y="196">生产运行</text><text class="phase-note" x="1413" y="218">生产移交 · 正式运行</text>

  <rect class="panel" x="30" y="270" width="1526" height="1120" rx="8"/>
  <text class="axis" transform="translate(64 890) rotate(-90)" text-anchor="middle">AI 基础设施栈</text>

  <line class="grid" x1="260" y1="270" x2="260" y2="1390"/><line class="grid" x1="490" y1="270" x2="490" y2="1390"/>
  <line class="grid" x1="740" y1="270" x2="740" y2="1390"/><line class="grid" x1="990" y1="270" x2="990" y2="1390"/>
  <line class="grid" x1="1270" y1="270" x2="1270" y2="1390"/><line class="grid" x1="1556" y1="270" x2="1556" y2="1390"/>

  <rect x="86" y="294" width="1450" height="52" fill="#e2e8f0" rx="5"/>
  <text class="group" x="106" y="326">项目交付</text>
  <text class="row" x="275" y="316"><tspan x="275">01 一座 AI 数据中心怎样</tspan><tspan class="small" x="275" dy="16">从选址走到 RFS</tspan></text>
  <rect class="overview" x="520" y="306" width="996" height="28" rx="5"/><text class="bartext" x="1018" y="325">选址 → RFS 的状态与关键路径</text>

  <text class="group" x="106" y="384">设施</text>
  <text class="row" x="106" y="420"><tspan x="106">02 AI 数据中心怎样</tspan><tspan class="small" x="106" dy="16">从电网拿到可用电力</tspan></text><rect class="power" x="278" y="410" width="592" height="28" rx="5"/><text class="bartext" x="574" y="429">电网侧 → 站点送电</text>
  <text class="row" x="106" y="476"><tspan x="106">03 电怎样从数据中心</tspan><tspan class="small" x="106" dy="16">变电站走到 GPU</tspan></text><rect class="power" x="520" y="466" width="430" height="28" rx="5"/><text class="bartext" x="735" y="485">站内供电 → GPU</text>
  <text class="row" x="106" y="532"><tspan x="106">04 GPU 的热怎样</tspan><tspan class="small" x="106" dy="16">排出 AI 数据中心</tspan></text><rect class="thermal" x="520" y="522" width="430" height="28" rx="5"/><text class="bartext" x="735" y="541">GPU 发热 → 排出站外</text>
  <text class="row" x="106" y="588"><tspan x="106">05 建完的 AI 数据中心</tspan><tspan class="small" x="106" dy="16">怎样完成系统调试</tspan></text><rect class="handoff" x="650" y="578" width="300" height="28" rx="5"/><text class="bartext" x="800" y="597">机械完工 → RFS</text>

  <line class="grid" x1="86" y1="632" x2="1536" y2="632"/>
  <text class="group" x="106" y="672">AI 基础设施</text>
  <text class="row" x="106" y="708"><tspan x="106">06 一块 GPU 怎样变成</tspan><tspan class="small" x="106" dy="16">数据中心机架级计算</tspan></text><rect class="compute" x="800" y="698" width="430" height="28" rx="5"/><text class="bartext" x="1015" y="717">部件 → 机架交付</text>
  <text class="row" x="106" y="764"><tspan x="106">07 数万块 GPU 怎样</tspan><tspan class="small" x="106" dy="16">在数据中心连成一台机器</tspan></text><rect class="compute" x="800" y="754" width="430" height="28" rx="5"/><text class="bartext" x="1015" y="773">网络拓扑 → 网络验证</text>
  <text class="row" x="106" y="820"><tspan x="106">08 AI 数据中心怎样存放</tspan><tspan class="small" x="106" dy="16">模型与 Agent 上下文</tspan></text><rect class="data" x="800" y="810" width="600" height="28" rx="5"/><text class="bartext" x="1100" y="829">存储介质 → 资格认证 → 生产数据</text>
  <text class="row" x="106" y="876"><tspan x="106">09 数据中心 GPU 集群怎样</tspan><tspan class="small" x="106" dy="16">走到生产移交</tspan></text><rect class="handoff" x="910" y="866" width="450" height="28" rx="5"/><text class="bartext" x="1135" y="885">RFS → 健康集群 → 生产移交</text>

  <line class="grid" x1="86" y1="920" x2="1536" y2="920"/>
  <text class="group" x="106" y="960">工作负载与交付</text>
  <text class="row" x="106" y="996"><tspan x="106">10 训练和推理</tspan><tspan class="small" x="106" dy="16">为什么需要不同的数据中心</tspan></text><rect class="service" x="1040" y="986" width="440" height="28" rx="5"/><text class="bartext" x="1260" y="1005">训练 · 推理</text>
  <text class="row" x="106" y="1052"><tspan x="106">11 一次 Agent 请求怎样</tspan><tspan class="small" x="106" dy="16">消耗 AI 数据中心算力</tspan></text><rect class="service" x="1120" y="1042" width="360" height="28" rx="5"/><text class="bartext" x="1300" y="1061">请求 → Agent 任务</text>
  <text class="row" x="106" y="1108"><tspan x="106">12 AI 数据中心的算力</tspan><tspan class="small" x="106" dy="16">怎样到达用户</tspan></text><rect class="service" x="1120" y="1098" width="360" height="28" rx="5"/><text class="bartext" x="1300" y="1117">集群 → 用户</text>

  <line class="grid" x1="86" y1="1152" x2="1536" y2="1152"/>
  <text class="group" x="106" y="1192">综合验证</text>
  <text class="row" x="106" y="1228"><tspan x="106">13 用 PORTS-Pike 还原</tspan><tspan class="small" x="106" dy="16">AI 数据中心 Alpha 地图</tspan></text><rect class="case" x="278" y="1218" width="1202" height="28" rx="5"/><text class="bartext" x="879" y="1237">交付阶段 → 复制缺口 → 价值捕获 → 错误定价</text>

  <text class="small" x="106" y="1310">每篇固定追问</text>
  <text class="row" x="260" y="1310">需求单位 · 复制单位 · 两只时钟 · 替代路径 · 下一瓶颈 · 定价程度 · 证伪条件</text>
  <text class="small" x="106" y="1350">颜色只区分研究域，不表示当前瓶颈状态；红黄绿状态将在每篇的瓶颈迁移网络中单独标注。</text>

  <text class="legend" x="44" y="1440">前置方法论</text>
  <text class="row" x="170" y="1440">《复制速度才是真正的瓶颈》</text>
  <text class="legend" x="44" y="1480">系列输出</text>
  <text class="row" x="170" y="1480">把项目、系统与供应商放回同一张图，再判断瓶颈强度 × 错误定价</text>
</svg>
