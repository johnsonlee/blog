<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="865" viewBox="0 0 1600 865" role="img" aria-labelledby="title desc">
  <title id="title">Project funding and OpenAI lease payments follow different paths</title>
  <desc id="desc">The generation funding path stops at undisclosed supplier awards, while the data-center lease path starts payments only after capacity is available.</desc>
  <style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}
    .title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}
    .body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}
    .number{font-size:38px;font-weight:780}.table{font-size:15px;font-weight:620}.inverse{fill:#fff}
  </style>
  <rect width="1600" height="865" fill="#f7f9fc"/>
  <text x="800" y="60" class="title" text-anchor="middle" >Project funding and OpenAI lease payments follow different paths</text><rect x="55" y="155" width="155" height="210" rx="6" fill="#c85a16" stroke="#c85a16" stroke-width="2"/><text x="132.5" y="271" class="head inverse" text-anchor="middle" >GENERATION</text><rect x="260" y="155" width="265" height="210" rx="6" fill="#fff0e5" stroke="#c85a16" stroke-width="2"/><text x="392.5" y="233" class="section" text-anchor="middle" >$33.3B</text><text x="392.5" y="287" class="body" text-anchor="middle"><tspan x="392.5" dy="0">Japanese project funding</tspan></text><line x1="525" y1="260" x2="597" y2="260" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M597 252 L610 260 L597 268 Z" fill="#52647a"/><rect x="610" y="155" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="742.5" y="233" class="head" text-anchor="middle" >U.S. Government</text><text x="742.5" y="287" class="body" text-anchor="middle"><tspan x="742.5" dy="0">owns 9.2 GW gas generation</tspan></text><line x1="875" y1="260" x2="947" y2="260" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M947 252 L960 260 L947 268 Z" fill="#52647a"/><rect x="960" y="155" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1092.5" y="233" class="head" text-anchor="middle" >OEM · EPC · pipeline</text><text x="1092.5" y="287" class="body" text-anchor="middle"><tspan x="1092.5" dy="0">awards not disclosed</tspan></text><line x1="1225" y1="260" x2="1297" y2="260" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1297 252 L1310 260 L1297 268 Z" fill="#52647a"/><rect x="1310" y="155" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1442.5" y="233" class="head" text-anchor="middle" >Listed suppliers</text><text x="1442.5" y="287" class="body" text-anchor="middle"><tspan x="1442.5" dy="0">revenue and margin unverified</tspan></text><rect x="55" y="485" width="155" height="210" rx="6" fill="#2f6fab" stroke="#2f6fab" stroke-width="2"/><text x="132.5" y="601" class="head inverse" text-anchor="middle" >DATA CENTER</text><rect x="260" y="485" width="265" height="210" rx="6" fill="#eaf2fb" stroke="#2f6fab" stroke-width="2"/><text x="392.5" y="563" class="section" text-anchor="middle" >20-year lease</text><text x="392.5" y="617" class="body" text-anchor="middle"><tspan x="392.5" dy="0">OpenAI ↔ SB Energy</tspan></text><line x1="525" y1="590" x2="597" y2="590" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M597 582 L610 590 L597 598 Z" fill="#52647a"/><rect x="610" y="485" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="742.5" y="563" class="head" text-anchor="middle" >Land · power · shell</text><text x="742.5" y="617" class="body" text-anchor="middle"><tspan x="742.5" dy="0">built and commissioned</tspan></text><line x1="875" y1="590" x2="947" y2="590" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M947 582 L960 590 L947 598 Z" fill="#52647a"/><rect x="960" y="485" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1092.5" y="563" class="head" text-anchor="middle" >Capacity available</text><text x="1092.5" y="617" class="body" text-anchor="middle"><tspan x="1092.5" dy="0">OpenAI begins paying</tspan></text><line x1="1225" y1="590" x2="1297" y2="590" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1297 582 L1310 590 L1297 598 Z" fill="#52647a"/><rect x="1310" y="485" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1442.5" y="563" class="head" text-anchor="middle" >SoftBank cash flow</text><text x="1442.5" y="617" class="body" text-anchor="middle"><tspan x="1442.5" dy="0">project bridge not disclosed</tspan></text><rect x="180" y="760" width="1240" height="64" rx="6" fill="#172033" stroke="#172033" stroke-width="2"/><text x="800" y="800" class="head inverse" text-anchor="middle" >Funding is not supplier backlog; a lease is not generation revenue.</text>
</svg>
