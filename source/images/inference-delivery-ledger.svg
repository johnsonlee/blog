<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Inference delivery capacity ledger</title><desc id="desc">Client request 经过 eligible region、edge ingress、regional route、gateway、SLO-qualified inference、stream completion 和 client acceptance，最终形成 delivered tasks per MW。</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750}.body{font-size:15px;fill:#52647a}.small{font-size:13px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="980" fill="#f7f9fc"/><text x="800" y="58" class="title">Token 只有在 SLO 内到达客户端，才完成交付</text>
  <rect x="65" y="105" width="1470" height="710" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/><text x="105" y="150" class="head">交付口径</text><text x="1130" y="150" class="head">这一层淘汰什么</text>
  <rect x="105" y="180" width="900" height="68" rx="5" fill="#64748b"/><text x="140" y="222" class="head inv">客户端 Request</text><text x="1130" y="222" class="body">无效 · 未授权 · 被限流</text>
  <rect x="145" y="267" width="860" height="68" rx="5" fill="#7653a6"/><text x="180" y="309" class="head inv">可选 Region 集合</text><text x="1130" y="309" class="body">模型 · 地理位置 · Tier · 数据驻留</text>
  <rect x="185" y="354" width="820" height="68" rx="5" fill="#2f6fab"/><text x="220" y="396" class="head inv">Edge + Region 路由</text><text x="1130" y="396" class="body">网络错误 · Region 错误 · RTT 过高</text>
  <rect x="225" y="441" width="780" height="68" rx="5" fill="#167d73"/><text x="260" y="483" class="head inv">推理网关</text><text x="1130" y="483" class="body">无已加载模型 · 排队 · KV 不匹配</text>
  <rect x="265" y="528" width="740" height="68" rx="5" fill="#c85a16"/><text x="300" y="570" class="head inv">满足 SLO 的推理</text><text x="1130" y="570" class="body">TTFT · TPOT · 错误 · 质量</text>
  <rect x="305" y="615" width="700" height="68" rx="5" fill="#b88407"/><text x="340" y="657" class="head inv">Stream / Response 完成</text><text x="1130" y="657" class="body">缓冲 · 断线 · 安全策略 · 超时</text>
  <rect x="345" y="702" width="660" height="68" rx="5" fill="#24864a"/><text x="380" y="744" class="head inv">客户端接受交付</text><text x="1130" y="744" class="body">按时 · 完整收到 · 无需重放</text>
  <rect x="155" y="855" width="1290" height="78" rx="6" fill="#172033"/><text x="800" y="887" class="head inv" text-anchor="middle">每 MW 交付 Task = SLO 内被客户端接收的 Successful Task ÷ 计量电量</text><text x="800" y="917" class="body inv" text-anchor="middle">同时记录跨 Region 比例、TTFT 的网络占比、Egress Bytes、断线与重放</text>
  <text x="800" y="965" class="small" text-anchor="middle">已经完成的 Compute 若未交付，仍然会变成 stranded cost</text>
</svg>
