<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" role="img" aria-labelledby="title desc">
  <title id="title">The AI Data Center Alpha Map</title>
  <desc id="desc">The horizontal axis follows the delivery lifecycle from Site Selection to In Service. The vertical axis follows facilities, AI infrastructure, workload, and delivery. Thirteen essays locate replication gaps across both axes.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1}.grid{stroke:#dbe2ea;stroke-width:1}.milestone{stroke:#fff;stroke-width:2}
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .axis{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.phase{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}.phase-note{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e2e8f0;text-anchor:middle}
      .group{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.row{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}.small{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.bartext{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}.legend{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .development{fill:#475569}.build{fill:#b45309}.facility{fill:#047857}.cluster{fill:#1d4ed8}.operations{fill:#7e22ce}
      .overview{fill:#334155}.power{fill:#c2410c}.thermal{fill:#0f766e}.handoff{fill:#15803d}.compute{fill:#1d4ed8}.data{fill:#6d28d9}.service{fill:#be185d}.case{fill:#b91c1c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1560"/>
  <text class="title" x="44" y="58">The AI Data Center Alpha Map</text>
  <text class="subtitle" x="44" y="88">Trace Replication Gaps and Bottleneck Migration across the delivery lifecycle and infrastructure stack</text>

  <text class="axis" x="1000" y="128" text-anchor="middle">PROJECT DELIVERY LIFECYCLE</text>
  <path d="M280 145H1535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="development milestone" x="260" y="166" width="230" height="76" rx="6"/>
  <text class="phase" x="375" y="196">Development</text><text class="phase-note" x="375" y="218">Site Selection · Permitting</text>
  <rect class="build milestone" x="490" y="166" width="250" height="76" rx="6"/>
  <text class="phase" x="615" y="196">Build</text><text class="phase-note" x="615" y="218">Design · Procurement · Construction</text>
  <rect class="facility milestone" x="740" y="166" width="250" height="76" rx="6"/>
  <text class="phase" x="865" y="196">Facility Handoff</text><text class="phase-note" x="865" y="218">Energization · Commissioning · RFS</text>
  <rect class="cluster milestone" x="990" y="166" width="280" height="76" rx="6"/>
  <text class="phase" x="1130" y="196">Cluster Handoff</text><text class="phase-note" x="1130" y="218">IT Deployment · Validation</text>
  <rect class="operations milestone" x="1270" y="166" width="286" height="76" rx="6"/>
  <text class="phase" x="1413" y="196">Operations</text><text class="phase-note" x="1413" y="218">Production Handoff · In Service</text>

  <rect class="panel" x="30" y="270" width="1526" height="1120" rx="8"/>
  <text class="axis" transform="translate(64 890) rotate(-90)" text-anchor="middle">AI INFRASTRUCTURE STACK</text>

  <line class="grid" x1="260" y1="270" x2="260" y2="1390"/><line class="grid" x1="490" y1="270" x2="490" y2="1390"/>
  <line class="grid" x1="740" y1="270" x2="740" y2="1390"/><line class="grid" x1="990" y1="270" x2="990" y2="1390"/>
  <line class="grid" x1="1270" y1="270" x2="1270" y2="1390"/><line class="grid" x1="1556" y1="270" x2="1556" y2="1390"/>

  <rect x="86" y="294" width="1450" height="52" fill="#e2e8f0" rx="5"/>
  <text class="group" x="106" y="326">Project delivery</text>
  <text class="row" x="275" y="316"><tspan x="275">01 How an AI Data Center Moves</tspan><tspan class="small" x="275" dy="16">from Site Selection to RFS</tspan></text>
  <rect class="overview" x="520" y="306" width="996" height="28" rx="5"/><text class="bartext" x="1018" y="325">States and the Critical Path from Site Selection to RFS</text>

  <text class="group" x="106" y="384">Facilities</text>
  <text class="row" x="106" y="420"><tspan x="106">02 How an AI Data Center</tspan><tspan class="small" x="106" dy="16">Gets Usable Power from the Grid</tspan></text><rect class="power" x="278" y="410" width="592" height="28" rx="5"/><text class="bartext" x="574" y="429">Utility Side → Energization</text>
  <text class="row" x="106" y="476"><tspan x="106">03 How Power Travels</tspan><tspan class="small" x="106" dy="16">from the Substation to the GPU</tspan></text><rect class="power" x="520" y="466" width="430" height="28" rx="5"/><text class="bartext" x="735" y="485">Site Power → GPU</text>
  <text class="row" x="106" y="532"><tspan x="106">04 How GPU Heat Leaves</tspan><tspan class="small" x="106" dy="16">an AI Data Center</tspan></text><rect class="thermal" x="520" y="522" width="430" height="28" rx="5"/><text class="bartext" x="735" y="541">GPU Heat → Heat Rejection</text>
  <text class="row" x="106" y="588"><tspan x="106">05 How an AI Data Center</tspan><tspan class="small" x="106" dy="16">Passes Commissioning</tspan></text><rect class="handoff" x="650" y="578" width="300" height="28" rx="5"/><text class="bartext" x="800" y="597">Mechanical Completion → RFS</text>

  <line class="grid" x1="86" y1="632" x2="1536" y2="632"/>
  <text class="group" x="106" y="672">AI infrastructure</text>
  <text class="row" x="106" y="708"><tspan x="106">06 How a GPU Becomes</tspan><tspan class="small" x="106" dy="16">Rack-Scale Compute in a Data Center</tspan></text><rect class="compute" x="800" y="698" width="430" height="28" rx="5"/><text class="bartext" x="1015" y="717">Components → Rack Delivery</text>
  <text class="row" x="106" y="764"><tspan x="106">07 How Thousands of GPUs</tspan><tspan class="small" x="106" dy="16">Become One Data Center Machine</tspan></text><rect class="compute" x="800" y="754" width="430" height="28" rx="5"/><text class="bartext" x="1015" y="773">Topology → Validated Fabric</text>
  <text class="row" x="106" y="820"><tspan x="106">08 Where an AI Data Center</tspan><tspan class="small" x="106" dy="16">Stores Models and Agent Context</tspan></text><rect class="data" x="800" y="810" width="600" height="28" rx="5"/><text class="bartext" x="1100" y="829">Media → Qualified Storage → Production Data</text>
  <text class="row" x="106" y="876"><tspan x="106">09 How a GPU Cluster</tspan><tspan class="small" x="106" dy="16">Reaches Production Handoff</tspan></text><rect class="handoff" x="910" y="866" width="450" height="28" rx="5"/><text class="bartext" x="1135" y="885">RFS → Healthy Cluster → Production Handoff</text>

  <line class="grid" x1="86" y1="920" x2="1536" y2="920"/>
  <text class="group" x="106" y="960">Workload and delivery</text>
  <text class="row" x="106" y="996"><tspan x="106">10 Training and Inference</tspan><tspan class="small" x="106" dy="16">Need Different Data Centers</tspan></text><rect class="service" x="1040" y="986" width="440" height="28" rx="5"/><text class="bartext" x="1260" y="1005">Training · Inference</text>
  <text class="row" x="106" y="1052"><tspan x="106">11 How an Agent Request</tspan><tspan class="small" x="106" dy="16">Consumes Data Center Compute</tspan></text><rect class="service" x="1120" y="1042" width="360" height="28" rx="5"/><text class="bartext" x="1300" y="1061">Request → Agent Task</text>
  <text class="row" x="106" y="1108"><tspan x="106">12 How AI Data Center Compute</tspan><tspan class="small" x="106" dy="16">Reaches the User</tspan></text><rect class="service" x="1120" y="1098" width="360" height="28" rx="5"/><text class="bartext" x="1300" y="1117">Cluster → User</text>

  <line class="grid" x1="86" y1="1152" x2="1536" y2="1152"/>
  <text class="group" x="106" y="1192">Full-stack test</text>
  <text class="row" x="106" y="1228"><tspan x="106">13 PORTS-Pike Rebuilds</tspan><tspan class="small" x="106" dy="16">the AI Data Center Alpha Map</tspan></text><rect class="case" x="278" y="1218" width="1202" height="28" rx="5"/><text class="bartext" x="879" y="1237">Delivery Stage → Replication Gap → Value Capture → Mispricing</text>

  <text class="small" x="106" y="1310">Every essay asks</text>
  <text class="row" x="260" y="1310">Demand Unit · Replication Unit · Two Clocks · Substitution · Next Bottleneck · Price-in Score · Invalidation</text>
  <text class="small" x="106" y="1350">Colors identify research domains, not bottleneck status. Each essay will mark red, yellow, and green nodes on its own Bottleneck Migration Network.</text>

  <text class="legend" x="44" y="1440">Prior framework</text>
  <text class="row" x="170" y="1440">Replication Speed Is the Real Bottleneck</text>
  <text class="legend" x="44" y="1480">Series output</text>
  <text class="row" x="170" y="1480">Map projects, systems, and suppliers together, then evaluate Bottleneck Strength × Mispricing</text>
</svg>
