<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Talen AWS PPA 的 Price-In 情景</title><desc id="desc">以 2032 年每股增量自由现金流、10% 折现率和三种终值倍数估算 AWS PPA 现值。</desc><rect width="1600" height="900" fill="#f5f7fb"/><style>.h{font:700 35px Arial,sans-serif;fill:#172033}.t{font:700 25px Arial,sans-serif;fill:#172033}.s{font:19px Arial,sans-serif;fill:#5d6f8d}.n{font:700 31px Arial,sans-serif;fill:#172033}.n[fill="#fff"]{fill:#fff}.s[fill="#bdc9db"]{fill:#bdc9db}.w{font:700 22px Arial,sans-serif;fill:#fff}</style><text x="800" y="70" text-anchor="middle" class="h">1,920MW AWS PPA 已经 Price In 多少？</text>
<rect x="70" y="125" width="430" height="650" rx="8" fill="#203653"/><text x="115" y="180" class="w">假设输入</text><text x="115" y="245" class="n" fill="#fff">$314.46</text><text x="115" y="278" class="s" fill="#bdc9db">TLN · 2026-08-21</text><line x1="115" y1="315" x2="455" y2="315" stroke="#71839d" stroke-width="2"/><text x="115" y="375" class="n" fill="#fff">$7.00–$8.25</text><text x="115" y="408" class="s" fill="#bdc9db">2032 PPA Adj FCF / share</text><line x1="115" y1="445" x2="455" y2="445" stroke="#71839d" stroke-width="2"/><text x="115" y="505" class="n" fill="#fff">10%</text><text x="115" y="538" class="s" fill="#bdc9db">6 年折现率</text><text x="115" y="625" class="s" fill="#bdc9db">Present value =</text><text x="115" y="656" class="s" fill="#bdc9db">2032 FCF × Terminal multiple</text><text x="115" y="687" class="s" fill="#bdc9db">÷ 1.10⁶</text>
<text x="565" y="155" class="t">Terminal Multiple</text><text x="910" y="155" class="t">PPA 现值 / Share</text><text x="1270" y="155" class="t">占当前股价</text>
<g><rect x="550" y="190" width="980" height="150" rx="8" fill="#eaf0f8" stroke="#60738f" stroke-width="2"/><text x="610" y="250" class="n">10x</text><text x="910" y="250" class="n">$40–$47</text><text x="1270" y="250" class="n">13%–15%</text><text x="910" y="295" class="s">偏低终值情景</text></g>
<g><rect x="550" y="375" width="980" height="150" rx="8" fill="#fff3dc" stroke="#d18b00" stroke-width="2"/><text x="610" y="435" class="n">15x</text><text x="910" y="435" class="n">$59–$70</text><text x="1270" y="435" class="n">19%–22%</text><text x="910" y="480" class="s">中位终值情景</text></g>
<g><rect x="550" y="560" width="980" height="150" rx="8" fill="#e5f3ef" stroke="#16856f" stroke-width="2"/><text x="610" y="620" class="n">20x</text><text x="910" y="620" class="n">$79–$93</text><text x="1270" y="620" class="n">25%–30%</text><text x="910" y="665" class="s">偏高终值情景</text></g>
<rect x="260" y="805" width="1080" height="55" rx="6" fill="#172033"/><text x="800" y="840" text-anchor="middle" class="w">这不是目标价：Ramp、FCF、Multiple、Discount 任一变化都会改写区间</text></svg>
