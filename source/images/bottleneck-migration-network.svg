  <path class="edge" d="M985 1015 L1260 1015"/>
  <path class="edge" d="M1190 1075 L1260 1015"/>

  <!-- D0 nodes -->
  <rect class="node context" x="205" y="158" width="170" height="55"/>
  <text class="node-text" x="290" y="181"><tspan x="290">AI DEMAND</tspan><tspan class="node-small" x="290" dy="17">10× shock</tspan></text>

  <rect class="node confirmed" x="205" y="270" width="175" height="62"/>
  <text class="node-text" x="292.5" y="294"><tspan x="292.5">COMPUTE</tspan><tspan class="node-small" x="292.5" dy="18">GPU / ASIC</tspan></text>

  <rect class="node confirmed" x="205" y="455" width="175" height="60"/>
  <text class="node-text" x="292.5" y="478"><tspan x="292.5">POWER</tspan><tspan class="node-small" x="292.5" dy="18">Gas Turbine · GEV</tspan></text>

  <rect class="node confirmed" x="205" y="695" width="175" height="60"/>
  <text class="node-text" x="292.5" y="718"><tspan x="292.5">STORAGE</tspan><tspan class="node-small" x="292.5" dy="18">Enterprise SSD</tspan></text>

  <rect class="node confirmed" x="205" y="930" width="175" height="70"/>
  <text class="node-text" x="292.5" y="953"><tspan x="292.5">NETWORKING</tspan><tspan class="node-small" x="292.5" dy="18">Optical Module</tspan><tspan class="node-small" x="292.5" dy="16">800G / 1.6T</tspan></text>

