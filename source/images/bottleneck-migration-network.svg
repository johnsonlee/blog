<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
  <title id="title">瓶颈迁移网络</title>
  <desc id="desc">一张按四个产业域和四级瓶颈深度组织的网络图，展示复制压力如何从已确认瓶颈迁移到直接投入、工艺产能与共享物理约束，以及需求可以转向哪些替代路径。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .lane-a { fill: #ffffff; }
      .lane-b { fill: #f8fafc; }
      .depth-0 { fill: #fef2f2; }
      .depth-1 { fill: #fff7ed; }
      .depth-2 { fill: #fefce8; }
      .depth-3 { fill: #eff6ff; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .depth-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0.6px; }
      .depth-note { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane-label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0.8px; }
      .lane-note { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane-note-compact { font-size: 11px; }
      .node { stroke: #64748b; stroke-width: 1.4; rx: 10; filter: url(#shadow); }
      .confirmed { fill: #fca5a5; stroke: #b91c1c; }
      .direct { fill: #fdba74; stroke: #c2410c; }
      .candidate { fill: #fef3c7; stroke: #a16207; }
      .shared { fill: #bfdbfe; stroke: #1d4ed8; }
      .context { fill: #e5e7eb; stroke: #64748b; }
      .substitute { fill: #ede9fe; stroke: #7c3aed; }
      .node-text { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; text-anchor: middle; }
      .node-small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; text-anchor: middle; }
      .substitute-text { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4c1d95; text-anchor: middle; }
      .node-center { dominant-baseline: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .pressure { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
      .pressure-trunk { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 5; }
      .shared-edge { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .feedback { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-teal); }
      .feedback-trunk { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 5; }
      .substitution { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 3 4; marker-end: url(#arrow-purple); }
      .edge-label { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .legend { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .legend-strong { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1340" rx="18"/>
  <text class="title" x="30" y="40">瓶颈迁移网络</text>
  <text class="subtitle" x="30" y="64">列表示与已确认瓶颈的复制距离；行让每条支路保持在同一产业域层级。</text>

  <!-- Depth columns -->
  <rect class="depth-0" x="175" y="78" width="230" height="1117" rx="10"/>
  <rect class="depth-1" x="405" y="78" width="370" height="1117" rx="10"/>
  <rect class="depth-2" x="775" y="78" width="450" height="1117" rx="10"/>
  <rect class="depth-3" x="1225" y="78" width="355" height="1117" rx="10"/>

  <text class="depth-label" x="290" y="101" text-anchor="middle">D0 · 已确认</text>
  <text class="depth-note" x="290" y="119" text-anchor="middle">市场已经看见的瓶颈</text>
  <text class="depth-label" x="590" y="101" text-anchor="middle">D1 · 直接投入</text>
  <text class="depth-note" x="590" y="119" text-anchor="middle">复制 D0 直接拉动的产能</text>
  <text class="depth-label" x="1000" y="101" text-anchor="middle">D2 · 工艺 · 材料 · 认证</text>
  <text class="depth-note" x="1000" y="119" text-anchor="middle">复制 D1 所需的产能</text>
  <text class="depth-label" x="1402" y="101" text-anchor="middle">D3 · 物理 · 共享</text>
  <text class="depth-note" x="1402" y="119" text-anchor="middle">设备与跨行业产能冲突</text>

  <!-- Domain lanes -->
  <rect class="lane-a" x="20" y="135" width="1560" height="280" rx="8" opacity="0.66"/>
  <rect class="lane-b" x="20" y="415" width="1560" height="240" rx="8" opacity="0.66"/>
  <rect class="lane-a" x="20" y="655" width="1560" height="240" rx="8" opacity="0.66"/>
  <rect class="lane-b" x="20" y="895" width="1560" height="300" rx="8" opacity="0.66"/>
  <line class="grid" x1="20" y1="415" x2="1580" y2="415"/>
  <line class="grid" x1="20" y1="655" x2="1580" y2="655"/>
  <line class="grid" x1="20" y1="895" x2="1580" y2="895"/>
  <line class="grid" x1="175" y1="78" x2="175" y2="1195"/>
  <line class="grid" x1="405" y1="78" x2="405" y2="1195"/>
  <line class="grid" x1="775" y1="78" x2="775" y2="1195"/>
  <line class="grid" x1="1225" y1="78" x2="1225" y2="1195"/>

  <text class="lane-label" x="36" y="236">算力</text>
  <text class="lane-note lane-note-compact" x="36" y="260">GPU + CPU + 内存 + 封装</text>
  <text class="lane-label" x="36" y="516">电力</text>
  <text class="lane-note" x="36" y="540">发电 + 输配电</text>
  <text class="lane-label" x="36" y="756">存储</text>
  <text class="lane-note" x="36" y="780">企业级 SSD + 认证</text>
  <text class="lane-label" x="36" y="1011">网络</text>
  <text class="lane-note" x="36" y="1035">光模块 + 光子</text>

  <!-- Edges: demand, D0 pressure, and feedback -->
  <path class="edge" d="M290 213 V244"/>
  <path class="pressure-trunk" d="M380 301 H420 V998"/>
  <path class="pressure" d="M420 518 H380"/>
  <path class="pressure" d="M420 758 H380"/>
  <path class="pressure" d="M420 998 H380"/>
  <text class="edge-label" x="414" y="448" text-anchor="end">电力</text>
  <text class="edge-label" x="414" y="688" text-anchor="end">数据 · 上下文</text>
  <text class="edge-label" x="414" y="928" text-anchor="end">横向扩展流量</text>
