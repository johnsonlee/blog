<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Bottleneck Migration Network — Depth Map</title>
  <desc id="desc">A single network diagram organized by four industry domains and four bottleneck depths, showing how replication pressure migrates from confirmed bottlenecks into direct inputs, process capacity, and shared physical constraints.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .lane-a { fill: #ffffff; }
      .lane-b { fill: #f8fafc; }
      .depth-0 { fill: #fef2f2; }
      .depth-1 { fill: #fff7ed; }
      .depth-2 { fill: #fefce8; }
      .depth-3 { fill: #eff6ff; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .depth-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0.6px; }
      .depth-note { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane-label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0.8px; }
      .lane-note { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .node { stroke: #64748b; stroke-width: 1.4; rx: 10; filter: url(#shadow); }
      .confirmed { fill: #fca5a5; stroke: #b91c1c; }
      .direct { fill: #fdba74; stroke: #c2410c; }
      .candidate { fill: #fef3c7; stroke: #a16207; }
      .shared { fill: #bfdbfe; stroke: #1d4ed8; }
      .context { fill: #e5e7eb; stroke: #64748b; }
      .node-text { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; text-anchor: middle; }
      .node-small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .pressure { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
      .shared-edge { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .feedback { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-teal); }
      .edge-label { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .legend { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .legend-strong { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1260" rx="18"/>
  <text class="title" x="30" y="40">Bottleneck Migration Network — Depth Map</text>
  <text class="subtitle" x="30" y="64">Columns measure replication distance from a confirmed bottleneck; rows keep every branch at the same industry-domain level.</text>

  <!-- Depth columns -->
  <rect class="depth-0" x="175" y="78" width="230" height="1042" rx="10"/>
  <rect class="depth-1" x="405" y="78" width="370" height="1042" rx="10"/>
  <rect class="depth-2" x="775" y="78" width="450" height="1042" rx="10"/>
  <rect class="depth-3" x="1225" y="78" width="355" height="1042" rx="10"/>

  <text class="depth-label" x="290" y="101" text-anchor="middle">D0 · CONFIRMED</text>
  <text class="depth-note" x="290" y="119" text-anchor="middle">market-visible bottleneck</text>
  <text class="depth-label" x="590" y="101" text-anchor="middle">D1 · DIRECT INPUT</text>
  <text class="depth-note" x="590" y="119" text-anchor="middle">capacity pulled by D0 replication</text>
  <text class="depth-label" x="1000" y="101" text-anchor="middle">D2 · PROCESS / MATERIAL / QUALIFICATION</text>
  <text class="depth-note" x="1000" y="119" text-anchor="middle">capacity required to replicate D1</text>
  <text class="depth-label" x="1402" y="101" text-anchor="middle">D3 · PHYSICAL / SHARED</text>
  <text class="depth-note" x="1402" y="119" text-anchor="middle">equipment and cross-domain collision</text>

  <!-- Domain lanes -->
  <rect class="lane-a" x="20" y="135" width="1560" height="240" rx="8" opacity="0.66"/>
  <rect class="lane-b" x="20" y="375" width="1560" height="240" rx="8" opacity="0.66"/>
  <rect class="lane-a" x="20" y="615" width="1560" height="240" rx="8" opacity="0.66"/>
  <rect class="lane-b" x="20" y="855" width="1560" height="265" rx="8" opacity="0.66"/>
  <line class="grid" x1="20" y1="375" x2="1580" y2="375"/>
  <line class="grid" x1="20" y1="615" x2="1580" y2="615"/>
  <line class="grid" x1="20" y1="855" x2="1580" y2="855"/>
  <line class="grid" x1="175" y1="78" x2="175" y2="1120"/>
  <line class="grid" x1="405" y1="78" x2="405" y2="1120"/>
  <line class="grid" x1="775" y1="78" x2="775" y2="1120"/>
  <line class="grid" x1="1225" y1="78" x2="1225" y2="1120"/>

  <text class="lane-label" x="36" y="236">COMPUTE</text>
  <text class="lane-note" x="36" y="257">GPU + memory</text>
  <text class="lane-note" x="36" y="273">+ packaging</text>
  <text class="lane-label" x="36" y="476">POWER</text>
  <text class="lane-note" x="36" y="497">generation</text>
  <text class="lane-note" x="36" y="513">+ delivery</text>
  <text class="lane-label" x="36" y="716">STORAGE</text>
  <text class="lane-note" x="36" y="737">enterprise SSD</text>
  <text class="lane-note" x="36" y="753">+ qualification</text>
  <text class="lane-label" x="36" y="971">NETWORKING</text>
  <text class="lane-note" x="36" y="992">optical module</text>
  <text class="lane-note" x="36" y="1008">+ photonics</text>

  <!-- Edges: demand, D0 pressure, and feedback -->
  <path class="edge" d="M290 213 V270"/>
  <path class="pressure" d="M380 301 H394 V478 H380"/>
  <path class="pressure" d="M380 301 H394 V718 H380"/>
  <path class="pressure" d="M380 301 H394 V958 H380"/>
  <text class="edge-label" x="399" y="408">power</text>
  <text class="edge-label" x="399" y="648">data / context</text>
  <text class="edge-label" x="399" y="888">scale-out traffic</text>
  <path class="feedback" d="M205 478 C172 478 172 330 205 330"/>
  <path class="feedback" d="M205 958 C153 958 153 340 205 340"/>

  <!-- Compute edges -->
  <path class="edge" d="M380 301 H425 V213 H455"/>
  <path class="edge" d="M380 301 H425 V313 H455"/>
  <path class="edge" d="M705 213 L805 185"/>
  <path class="edge" d="M705 213 L1010 185"/>
  <path class="edge" d="M705 313 L805 300"/>
  <path class="edge" d="M705 313 L1010 300"/>
  <path class="shared-edge" d="M1190 185 L1260 255"/>
  <path class="shared-edge" d="M985 300 L1260 255"/>

