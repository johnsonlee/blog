  <path class="shared-edge" d="M1355 590 V535"/>

  <!-- Storage edges -->
  <path class="edge" d="M380 725 H425 V655 H455"/>
  <path class="edge" d="M380 725 H455"/>
  <path class="edge" d="M380 725 H425 V795 H455"/>
  <path class="edge" d="M705 655 L805 665"/>
  <path class="edge" d="M705 725 L995 735"/>
  <path class="edge" d="M705 795 L805 805"/>
  <path class="shared-edge" d="M985 665 L1260 680"/>
