  <!-- Networking edges -->
  <path class="edge" d="M380 965 H425 V885 H455"/>
  <path class="edge" d="M380 965 H425 V945 H455"/>
  <path class="edge" d="M380 965 H425 V1005 H455"/>
  <path class="edge" d="M380 965 H425 V1065 H455"/>
  <path class="edge" d="M705 885 L805 890"/>
  <path class="edge" d="M705 945 L995 950"/>
  <path class="edge" d="M705 1005 L805 1015"/>
  <path class="edge" d="M705 1065 L995 1075"/>
