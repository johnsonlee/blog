  <rect class="node direct" x="455" y="392" width="250" height="56"/>
  <text class="node-text" x="580" y="416"><tspan x="580">Large Forgings</tspan><tspan x="580" dy="17">/ Castings</tspan></text>
  <rect class="node direct" x="455" y="462" width="250" height="56"/>
  <text class="node-text" x="580" y="486"><tspan x="580">Hot-gas-path</tspan><tspan x="580" dy="17">Parts</tspan></text>
  <rect class="node direct" x="455" y="537" width="250" height="56"/>
  <text class="node-text" x="580" y="561"><tspan x="580">Assembly</tspan><tspan x="580" dy="17">/ Test Bays</tspan></text>

  <rect class="node direct" x="455" y="627" width="250" height="56"/>
  <text class="node-text" x="580" y="660">NAND Die</text>
  <rect class="node direct" x="455" y="697" width="250" height="56"/>
  <text class="node-text" x="580" y="730">Controller ASIC</text>
  <rect class="node direct" x="455" y="767" width="250" height="56"/>
  <text class="node-text" x="580" y="791"><tspan x="580">Firmware</tspan><tspan x="580" dy="17">/ Qualification</tspan></text>

  <rect class="node direct" x="455" y="857" width="250" height="56"/>
  <text class="node-text" x="580" y="890">Optical DSP</text>
  <rect class="node direct" x="455" y="917" width="250" height="56"/>
