  <!-- Legend -->
  <rect x="20" y="1140" width="1560" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="legend-strong" x="42" y="1168">How to read:</text>
  <text class="legend" x="145" y="1168">Depth is relative. When a D1 node turns red, it becomes the new D0 and the map is measured again.</text>
  <rect x="42" y="1187" width="22" height="16" rx="4" class="confirmed"/>
  <text class="legend" x="74" y="1200">confirmed bottleneck</text>
  <rect x="270" y="1187" width="22" height="16" rx="4" class="direct"/>
