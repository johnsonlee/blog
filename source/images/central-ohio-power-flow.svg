<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">1GW 为什么会卡在几百公里外？</title><desc id="desc">新增潮流会在交流电网中沿多条路径分摊，远端设备也可能先成为约束。</desc><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}.compact{font-size:17px}.body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}.number{font-size:38px;font-weight:780}.metric{font-size:28px;font-weight:760}.node{font-size:12px;font-weight:760}.inverse{fill:#ffffff}</style><rect width="1600" height="760" fill="#f7f9fc"/><text x="800" y="58" class="title" text-anchor="middle">1GW 为什么会卡在几百公里外？</text><rect x="60" y="135" width="250" height="390" rx="6" fill="#e8f5ed" stroke="#16877b" stroke-width="2"/><text x="185" y="205" class="section" text-anchor="middle"><tspan x="185" dy="0">区域</tspan><tspan x="185" dy="27">发电节点</tspan></text><circle cx="185" cy="315" r="52" fill="#ffffff" stroke="#16877b" stroke-width="4"/><text x="185" y="328" class="number" text-anchor="middle" style="fill:#16877b">G</text><text x="185" y="430" class="head" text-anchor="middle" style="fill:#16877b">+1GW 注入</text><rect x="1290" y="135" width="250" height="390" rx="6" fill="#e8f1fb" stroke="#2f6fab" stroke-width="2"/><text x="1415" y="205" class="section" text-anchor="middle"><tspan x="1415" dy="0">数据中心</tspan><tspan x="1415" dy="27">负荷节点</tspan></text><rect x="1365" y="275" width="100" height="92" rx="5" fill="#ffffff" stroke="#2f6fab" stroke-width="3"/><line x1="1385" y1="302" x2="1445" y2="302" stroke="#2f6fab" stroke-width="3" stroke-linecap="round"/><line x1="1385" y1="324" x2="1445" y2="324" stroke="#2f6fab" stroke-width="3" stroke-linecap="round"/><line x1="1385" y1="346" x2="1445" y2="346" stroke="#2f6fab" stroke-width="3" stroke-linecap="round"/><text x="1415" y