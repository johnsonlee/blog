<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Inference cacheability boundary</title><desc id="desc">Static assets can be broadly reused at CDN edge, identical AI requests can sometimes be cached, and personalized inference usually returns to model origin.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750;text-anchor:middle}.body{font-size:15px;fill:#52647a;text-anchor:middle}.small{font-size:13px;fill:#607089;text-anchor:middle}.inv{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="58" class="title">Whether an AI Response Is Cacheable Depends on Its Reuse Boundary</text>
  <rect x="55" y="120" width="470" height="610" rx="7" fill="#fff" stroke="#24864a" stroke-width="2"/><text x="290" y="165" class="head">Static Asset</text><rect x="115" y="220" width="350" height="88" rx="6" fill="#64748b"/><text x="290" y="257" class="head inv">Same File / Segment</text><text x="290" y="286" class="body inv">Many Users Reuse It</text><line x1="290" y1="308" x2="290" y2="350" stroke="#52647a" stroke-width="4"/><polygon points="278,350 302,350 290,372" fill="#52647a"/><rect x="115" y="372" width="350" height="100" rx="6" fill="#24864a"/><text x="290" y="412" class="head inv">CDN Edge Cache</text><text x="290" y="442" class="body inv">A Hit Avoids Origin</text><rect x="115" y="555" width="350" height="100" rx="6" fill="#e9f5ed" stroke="#24864a" stroke-width="2"/><text x="290" y="595" class="head">High Reuse</text><text x="290" y="625" class="body">Cache Is the Main Delivery Path</text>
  <rect x="565" y="120" width="470" height="610" rx="7" fill="#fff" stroke="#b88407" stroke-width="2"/><text x="800" y="165" class="head">Identical AI Request</text><rect x="625" y="220" width="350" height="88" rx="6" fill="#7653a6"/><text x="800" y="257" class="head inv">Same Prompt + Parameters</text><text x="800" y="286" class="body inv">Fixed FAQ · Limited Options</text><line x1="800" y1="308" x2="800" y2="350" stroke="#52647a" stroke-width="4"/><polygon points="788,350 812,350 800,372" fill="#52647a"/><rect x="625" y="372" width="350" height="100" rx="6" fill="#b88407"/><text x="800" y="412" class="head inv">Response Cache</text><text x="800" y="442" class="body inv">Reuse Only When Identical</text><rect x="625" y="555" width="350" height="100" rx="6" fill="#fff7df" stroke="#b88407" stroke-width="2"/><text x="800" y="595" class="head">Limited Reuse</text><text x="800" y="625" class="body">Low-dynamic, Low-personalization</text>
  <rect x="1075" y="120" width="470" height="610" rx="7" fill="#fff" stroke="#c85a16" stroke-width="2"/><text x="1310" y="165" class="head">Personalized Inference</text><rect x="1135" y="205" width="350" height="128" rx="6" fill="#c85a16"/><text x="1310" y="242" class="head inv">Prompt · History · Retrieval</text><text x="1310" y="273" class="body inv">Tool · Permission · Model Version</text><text x="1310" y="304" class="body inv">Sampling · Policy · Freshness</text><line x1="1310" y1="333" x2="1310" y2="375" stroke="#52647a" stroke-width="4"/><polygon points="1298,375 1322,375 1310,397" fill="#52647a"/><rect x="1135" y="397" width="350" height="100" rx="6" fill="#2f6fab"/><text x="1310" y="437" class="head inv">Model Origin</text><text x="1310" y="467" class="body inv">Most Requests Still Compute</text><rect x="1135" y="555" width="350" height="100" rx="6" fill="#fff3ea" stroke="#c85a16" stroke-width="2"/><text x="1310" y="595" class="head">Layered Reuse</text><text x="1310" y="625" class="body">Retrieval · Prompt · KV Differ</text>
  <rect x="170" y="785" width="1260" height="70" rx="6" fill="#172033"/><text x="800" y="816" class="head inv">Inference Delivery Finds Capacity Holding the Right State; It Does Not Cache Every Answer</text><text x="800" y="844" class="small inv">Track Cache Conditions, Privacy Boundaries, and Billing Events by Layer</text>
</svg>
