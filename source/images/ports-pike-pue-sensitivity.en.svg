<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">The same 8 IT-GW produces different facility demand</title>
  <desc id="desc">Three PUE sensitivities show how facility overhead consumes the apparent two-gigawatt headline gap.</desc>
  <style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}
    .title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}
    .body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}
    .number{font-size:38px;font-weight:780}.table{font-size:15px;font-weight:620}.inverse{fill:#fff}
  </style>
  <rect width="1600" height="720" fill="#f7f9fc"/>
  <text x="800" y="60" class="title" text-anchor="middle" >The same 8 IT-GW produces different facility demand</text><text x="95" y="125" class="small" text-anchor="start" >Sensitivity</text><line x1="380" y1="140" x2="380" y2="535" stroke="#d8e0e9" stroke-width="1"/><text x="380" y="128" class="small" text-anchor="middle" >0GW</text><line x1="590" y1="140" x2="590" y2="535" stroke="#d8e0e9" stroke-width="1"/><text x="590" y="128" class="small" text-anchor="middle" >2GW</text><line x1="800" y1="140" x2="800" y2="535" stroke="#d8e0e9" stroke-width="1"/><text x="800" y="128" class="small" text-anchor="middle" >4GW</text><line x1="1010" y1="140" x2="1010" y2="535" stroke="#d8e0e9" stroke-width="1"/><text x="1010" y="128" class="small" text-anchor="middle" >6GW</text><line x1="1220" y1="140" x2="1220" y2="535" stroke="#d8e0e9" stroke-width="1"/><text x="1220" y="128" class="small" text-anchor="middle" >8GW</text><line x1="1430" y1="140" x2="1430" y2="535" stroke="#d8e0e9" stroke-width="1"/><text x="1430" y="128" class="small" text-anchor="middle" >10GW</text><text x="1520" y="128" class="small" text-anchor="middle" >Remainder</text><text x="85" y="218" class="section" text-anchor="start" >PUE 1.10</text><rect x="380" y="175" width="1050" height="78" rx="5" fill="#edf1f5"/><rect x="380" y="175" width="840" height="78" rx="5" fill="#2f6fab"/><rect x="1220" y="175" width="84" height="78" fill="#167d73"/><text x="800" y="224" class="head inverse" text-anchor="middle" >8 IT-GW</text><text x="1262" y="224" class="head inverse" text-anchor="middle" >+0.8</text><text x="1296" y="280" class="small" text-anchor="end" >8.8GW facility</text><text x="1520" y="224" class="head" text-anchor="middle" >1.2GW</text><text x="85" y="343" class="section" text-anchor="start" >PUE 1.15</text><rect x="380" y="300" width="1050" height="78" rx="5" fill="#edf1f5"/><rect x="380" y="300" width="840" height="78" rx="5" fill="#2f6fab"/><rect x="1220" y="300" width="126" height="78" fill="#167d73"/><text x="800" y="349" class="head inverse" text-anchor="middle" >8 IT-GW</text><text x="1283" y="349" class="head inverse" text-anchor="middle" >+1.2</text><text x="1338" y="405" class="small" text-anchor="end" >9.2GW facility</text><text x="1520" y="349" class="head" text-anchor="middle" >0.8GW</text><text x="85" y="468" class="section" text-anchor="start" >PUE 1.20</text><rect x="380" y="425" width="1050" height="78" rx="5" fill="#edf1f5"/><rect x="380" y="425" width="840" height="78" rx="5" fill="#2f6fab"/><rect x="1220" y="425" width="168" height="78" fill="#167d73"/><text x="800" y="474" class="head inverse" text-anchor="middle" >8 IT-GW</text><text x="1304" y="474" class="head inverse" text-anchor="middle" >+1.6</text><text x="1380" y="530" class="small" text-anchor="end" >9.6GW facility</text><text x="1520" y="474" class="head" text-anchor="middle" >0.4GW</text><rect x="380" y="585" width="24" height="24" rx="3" fill="#2f6fab"/><text x="420" y="604" class="body" text-anchor="start" >IT load</text><rect x="650" y="585" width="24" height="24" rx="3" fill="#167d73"/><text x="690" y="604" class="body" text-anchor="start" >Facility overhead</text><rect x="1035" y="585" width="24" height="24" rx="3" fill="#edf1f5" stroke="#d8e0e9"/><text x="1075" y="604" class="body" text-anchor="start" >Remainder to 10 GW headline</text><text x="800" y="675" class="small" text-anchor="middle" >PORTS-Pike has not disclosed PUE; these are sensitivities, not design values.</text>
</svg>
