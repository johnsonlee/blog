<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">PORTS-Pike Land and Permitting Boundaries</title><desc id="desc">PORTS-Pike spans phased DOE leasehold and adjacent private land. The 189-acre DOE lease enters environmental site assessment, while FAST-41 environmental review and permitting remain in progress for roughly 1,300 private acres.</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:28px;font-weight:760;text-anchor:middle}.head{font-size:19px;font-weight:750}.body{font-size:15px;fill:#52647a}.small{font-size:13px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="940" fill="#f7f9fc"/><text x="800" y="58" class="title">One Campus, at Least Two Land and Permitting Paths</text>
  <rect x="70" y="110" width="1460" height="685" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/>
  <rect x="115" y="165" width="630" height="355" rx="7" fill="#eef3fb" stroke="#9cb9dc" stroke-width="2"/><text x="430" y="215" class="head" text-anchor="middle">DOE Portsmouth Site</text><text x="430" y="248" class="body" text-anchor="middle">Federal Land Released in Phases after Remediation</text>
  <rect x="170" y="290" width="520" height="155" rx="6" fill="#2f6fab"/><text x="430" y="338" class="head inv" text-anchor="middle">Batch 1 · About 189 Acres</text><text x="430" y="376" class="body inv" text-anchor="middle">Lease Signed</text><text x="430" y="410" class="body inv" text-anchor="middle">Environmental Site Assessment</text>
  <text x="430" y="481" class="small" text-anchor="middle">Assessment Determines Feasibility, Permitting, Design, and Construction Requirements</text>

  <rect x="855" y="165" width="630" height="355" rx="7" fill="#fff7e6" stroke="#d8bd70" stroke-width="2"/><text x="1170" y="215" class="head" text-anchor="middle">Adjacent Private Land</text><text x="1170" y="248" class="body" text-anchor="middle">About 1,300 Acres · First Two Buildings</text>
  <rect x="910" y="290" width="520" height="155" rx="6" fill="#b88407"/><text x="1170" y="338" class="head inv" text-anchor="middle">FAST-41 Review</text><text x="1170" y="376" class="body inv" text-anchor="middle">In Progress</text><text x="1170" y="410" class="body inv" text-anchor="middle">0 / 4 Processes Completed</text>
  <text x="1170" y="481" class="small" text-anchor="middle">Estimated Completion: 2026-12-23</text>

  <line x1="430" y1="520" x2="430" y2="590" stroke="#52647a" stroke-width="4"/><line x1="1170" y1="520" x2="1170" y2="590" stroke="#52647a" stroke-width="4"/>
  <line x1="430" y1="590" x2="1170" y2="590" stroke="#52647a" stroke-width="4"/><line x1="800" y1="590" x2="800" y2="623" stroke="#52647a" stroke-width="4"/><polygon points="786,623 814,623 800,648" fill="#52647a"/>
  <rect x="380" y="648" width="840" height="100" rx="7" fill="#64748b"/><text x="800" y="689" class="head inv" text-anchor="middle">Executable Design + Corresponding Authorization</text><text x="800" y="722" class="body inv" text-anchor="middle">The Corresponding Building Can Then Enter Full Civil · Structural · MEP Construction</text>
  <rect x="175" y="835" width="1250" height="64" rx="6" fill="#172033"/><text x="800" y="875" class="head inv" text-anchor="middle">Groundbreaking Starts Field Activity; It Does Not Close Every Land and Permit Gate</text>
</svg>
