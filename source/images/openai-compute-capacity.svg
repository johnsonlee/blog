<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 算力增长与 PORTS-Pike 交付时间</title>
  <desc id="desc">OpenAI 的可用算力从 2023 年 0.2GW 增长到 2025 年约 1.9GW，2030 年目标为 30GW。PORTS-Pike 规划 8 IT-GW，首批 0.8GW 预计 2028 年交付，完整建设持续到 2032 年。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.line{stroke:#94a3b8;stroke-width:3}.guide{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 7}
      .label{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.year{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155;text-anchor:middle}
      .value{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;text-anchor:middle}.note{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;text-anchor:middle}
      .ratio{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.inside{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle}
      .available{fill:#047857}.target{fill:#1d4ed8}.ports{fill:#b45309}.agreement{fill:#475569}.first{fill:#0f766e}.complete{fill:#b91c1c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <rect class="panel" x="70" y="55" width="1460" height="390" rx="8"/>
  <text class="label" x="120" y="110">OpenAI 可用算力</text>
  <path class="line" d="M205 205H1395" marker-end="url(#arrow)"/>

  <line class="guide" x1="280" y1="176" x2="280" y2="292"/>
  <circle class="available" cx="280" cy="205" r="16"/>
  <text class="year" x="280" y="160">2023</text>
  <text class="value" x="280" y="340">0.2GW</text>

  <line class="guide" x1="570" y1="176" x2="570" y2="292"/>
  <circle class="available" cx="570" cy="205" r="16"/>
  <text class="year" x="570" y="160">2024</text>
  <text class="value" x="570" y="340">0.6GW</text>

  <line class="guide" x1="860" y1="176" x2="860" y2="292"/>
  <circle class="available" cx="860" cy="205" r="16"/>
  <text class="year" x="860" y="160">2025</text>
  <text class="value" x="860" y="340">约 1.9GW</text>

  <line class="guide" x1="1320" y1="176" x2="1320" y2="292"/>
  <circle class="target" cx="1320" cy="205" r="16"/>
  <text class="year" x="1320" y="160">2030 目标</text>
  <text class="value" x="1320" y="340">30GW</text>

  <text class="ratio" x="120" y="405">2025 可用算力</text>
  <rect class="target" x="310" y="382" width="1090" height="30" rx="5" opacity="0.16"/>
  <rect class="available" x="310" y="382" width="69" height="30" rx="5"/>
  <text class="ratio" x="1420" y="405">约为目标的 6%</text>

  <rect class="panel" x="70" y="475" width="1460" height="370" rx="8"/>
  <text class="label" x="120" y="530">PORTS-Pike 交付</text>
  <path class="line" d="M205 625H1395" marker-end="url(#arrow)"/>

  <line class="guide" x1="300" y1="590" x2="300" y2="706"/>
  <circle class="agreement" cx="300" cy="625" r="17"/>
  <text class="year" x="300" y="575">2026</text>
  <text class="value" x="300" y="755">协议约 8 IT-GW</text>

  <line class="guide" x1="780" y1="590" x2="780" y2="706"/>
  <circle class="first" cx="780" cy="625" r="20"/>
  <text class="year" x="780" y="575">2028</text>
  <text class="value" x="780" y="755">首批 0.8GW</text>
  <text class="note" x="780" y="788">预计 available</text>

  <line class="guide" x1="1280" y1="590" x2="1280" y2="706"/>
  <circle class="complete" cx="1280" cy="625" r="24"/>
  <text class="year" x="1280" y="575">2032</text>
  <text class="value" x="1280" y="755">完整 buildout</text>
  <text class="note" x="1280" y="788">规划约 8 IT-GW</text>

  <rect class="ports" x="520" y="800" width="360" height="30" rx="5"/>
  <text class="inside" x="700" y="821">8GW = 2030 目标的约 27%</text>
</svg>
