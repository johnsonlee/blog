<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">PORTS-Pike 交付时间</title>
  <desc id="desc">PORTS-Pike 于 2026 年签约，规划容量约 8 IT-GW；首批 0.8GW 预计 2028 年 available，完整 buildout 持续到 2032 年。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.line{stroke:#94a3b8;stroke-width:4}.buildout{stroke:#b45309;stroke-width:18;stroke-linecap:round}.guide{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 7}.year{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155;text-anchor:middle}.value{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;text-anchor:middle}.note{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;text-anchor:middle}.duration{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#92400e;text-anchor:middle}.agreement{fill:#475569}.first{fill:#047857}.complete{fill:#b45309}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" width="1600" height="560"/>
  <path class="line" d="M170 245H1430" marker-end="url(#arrow)"/>
  <path class="buildout" d="M300 245H1300" opacity="0.18"/>
  <text class="duration" x="800" y="205">六年 buildout</text>

  <line class="guide" x1="300" y1="160" x2="300" y2="355"/>
  <circle class="agreement" cx="300" cy="245" r="18"/>
  <text class="year" x="300" y="125">2026</text>
  <text class="value" x="300" y="410">签约</text>
  <text class="note" x="300" y="446">规划约 8 IT-GW</text>

  <line class="guide" x1="800" y1="160" x2="800" y2="355"/>
  <circle class="first" cx="800" cy="245" r="22"/>
  <text class="year" x="800" y="125">2028</text>
  <text class="value" x="800" y="410">首批 0.8GW</text>
  <text class="note" x="800" y="446">预计 available</text>

  <line class="guide" x1="1300" y1="160" x2="1300" y2="355"/>
  <circle class="complete" cx="1300" cy="245" r="25"/>
  <text class="year" x="1300" y="125">2032</text>
  <text class="value" x="1300" y="410">完整 buildout</text>
  <text class="note" x="1300" y="446">规划约 8 IT-GW</text>
</svg>
