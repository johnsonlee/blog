18" font-weight="700" text-anchor="middle"><tspan x="880" dy="0">模型校核 · 事件回放</tspan></text><rect x="1080" y="595" width="300" height="105" rx="7" fill="#DCE8FF" stroke="#D9E0EA" stroke-width="2"/><text x="1230" y="655.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="1230" dy="0">调度 / 公用事业</tspan></text><rect x="60" y="700" width="240" height="105" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="180" y="760.5" fill="#172033" font-size="20" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">升载</tspan></text><rect x="300" y="700" width="380" height="105" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="490" y="760.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="490" dy="0">爬坡 · 最大 MW · 恢复</tspan></text><rect x="680" y="700" width="400" height="105" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="880" y="760.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="880" dy="0">分阶段运行记录</tspan></text><rect x="1080" y="700" width="300" height="105" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1230" y="760.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="1230" dy="0">运行方</tspan></text><rect x="300" y="825" width="780" height="65" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="690" y="865.5" fill="#172033" font-size="21" font-weight="700" text-anchor="middle"><tspan x="690" dy="0">任何一项失败，都可能把“首次合闸”退回“重新测试”</tspan></text></svg>
