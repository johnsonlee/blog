<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Regional inference routing constraints</title><desc id="desc">Regional routing filters by processing boundaries and model availability before optimizing network distance, queue, and capacity; the nearest, emptiest, and compliant Region may differ.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750;text-anchor:middle}.body{font-size:15px;fill:#52647a;text-anchor:middle}.inv{fill:#fff}</style>
  <rect width="1600" height="880" fill="#f7f9fc"/><text x="800" y="58" class="title">The Nearest, Emptiest, and Compliant Region May Differ</text>
  <rect x="65" y="130" width="420" height="220" rx="7" fill="#fff" stroke="#2f6fab" stroke-width="2"/><text x="275" y="178" class="head">Network Locality</text><text x="275" y="220" class="body">User → Edge → Region RTT</text><text x="275" y="255" class="body">Seoul users are near Seoul / Tokyo</text><rect x="125" y="285" width="300" height="42" rx="5" fill="#2f6fab"/><text x="275" y="312" class="body inv">Goal: Low TTFT</text><rect x="590" y="130" width="420" height="220" rx="7" fill="#fff" stroke="#167d73" stroke-width="2"/><text x="800" y="178" class="head">Available Capacity</text><text x="800" y="220" class="body">Model Warm · Queue · KV · Headroom</text><text x="800" y="255" class="body">The nearest Region may be full</text><rect x="650" y="285" width="300" height="42" rx="5" fill="#167d73"/><text x="800" y="312" class="body inv">Goal: High Throughput</text><rect x="1115" y="130" width="420" height="220" rx="7" fill="#fff" stroke="#c85a16" stroke-width="2"/><text x="1325" y="178" class="head">Processing Boundary</text><text x="1325" y="220" class="body">Residency · IAM · Customer Policy</text><text x="1325" y="255" class="body">Disallowed Regions leave the set</text><rect x="1175" y="285" width="300" height="42" rx="5" fill="#c85a16"/><text x="1325" y="312" class="body inv">Goal: Policy Pass</text>
  <path d="M275 350V435H800" fill="none" stroke="#52647a" stroke-width="4"/><path d="M800 350V435" fill="none" stroke="#52647a" stroke-width="4"/><path d="M1325 350V435H800" fill="none" stroke="#52647a" stroke-width="4"/><polygon points="788,435 812,435 800,457" fill="#52647a"/><rect x="560" y="457" width="480" height="120" rx="7" fill="#7653a6"/><text x="800" y="500" class="head inv">Eligible Region Set</text><text x="800" y="534" class="body inv">Model × Geography × Tier × Policy</text><text x="800" y="563" class="body inv">Filter First, Then Optimize Route</text><line x1="800" y1="577" x2="800" y2="625" stroke="#52647a" stroke-width="4"/><polygon points="788,625 812,625 800,647" fill="#52647a"/><rect x="380" y="647" width="840" height="105" rx="7" fill="#24864a"/><text x="800" y="689" class="head inv">Selected Region</text><text x="800" y="723" class="body inv">Minimize Network + Queue + Prefill + Failure Risk Inside the Allowed Set</text><rect x="220" y="800" width="1160" height="46" rx="6" fill="#172033"/><text x="800" y="829" class="body inv">Global MW Cannot Replace Routable Model × Region × SLO Capacity</text>
</svg>
