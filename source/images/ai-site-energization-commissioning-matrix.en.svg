<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc"><title id="title">Site energization commissioning matrix</title><desc id="desc">Validation matrix from primary equipment to load ramp.</desc><rect width="1440" height="930" fill="#F7F9FC"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style><text x="60" y="70" fill="#5E6B7E" font-size="24" font-weight="800" text-anchor="start"><tspan x="60" dy="0">Equipment completion is not system completion: every row needs auditable evidence</tspan></text><rect x="60" y="105" width="240" height="70" rx="7" fill="#26364D" stroke="#26364D" stroke-width="2"/><text x="180" y="148" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">System</tspan></text><rect x="300" y="105" width="380" height="70" rx="7" fill="#26364D" stroke="#26364D" stroke-width="2"/><text x="490" y="148" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle"><tspan x="490" dy="0">What must be proven</tspan></text><rect x="680" y="105" width="400" height="70" rx="7" fill="#26364D" stroke="#26364D" stroke-width="2"/><text x="880" y="148" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle"><tspan x="880" dy="0">Acceptance evidence</tspan></text><rect x="1080" y="105" width="300" height="70" rx="7" fill="#26364D" stroke="#26364D" stroke-width="2"/><text x="1230" y="148" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle"><tspan x="1230" dy="0">Sign-off owner</tspan></text><rect x="60" y="175" width="240" height="105" rx="7" fill="#DCE8FF" stroke="#D9E0EA" stroke-width="2"/><text x="180" y="235.5" fill="#172033" font-size="20" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">Primary equipment</tspan></text><rect x="300" y="175" width="380" height="105" rx="7" fill="#DCE8FF" stroke="#D9E0EA" stroke-width="