<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Inference streaming delivery timeline</title><desc id="desc">Streaming response 从 connection 建立、首 Token、连续 chunk、guardrail、proxy 和 client render 形成一段持续连接，SLO 包括 TTFT、inter-event gap 和 completion。</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:17px;font-weight:750}.body{font-size:14px;fill:#52647a}.small{font-size:13px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="58" class="title">Streaming 把一次 Response 变成一段持续连接</text>
  <rect x="55" y="115" width="1490" height="610" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/>
  <text x="80" y="180" class="head">客户端</text><text x="80" y="300" class="head">Edge / Proxy</text><text x="80" y="420" class="head">安全策略</text><text x="80" y="540" class="head">解码 Worker</text><text x="80" y="660" class="head">连接</text>
  <line x1="260" y1="145" x2="260" y2="690" stroke="#d5dde7" stroke-width="2"/><line x1="420" y1="145" x2="420" y2="690" stroke="#e5eaf0" stroke-width="2"/><line x1="680" y1="145" x2="680" y2="690" stroke="#e5eaf0" stroke-width="2"/><line x1="940" y1="145" x2="940" y2="690" stroke="#e5eaf0" stroke-width="2"/><line x1="1200" y1="145" x2="1200" y2="690" stroke="#e5eaf0" stroke-width="2"/><line x1="1470" y1="145" x2="1470" y2="690" stroke="#e5eaf0" stroke-width="2"/>
  <text x="420" y="165" class="small" text-anchor="middle">请求</text><text x="680" y="165" class="small" text-anchor="middle">首枚 Token</text><text x="940" y="165" class="small" text-anchor="middle">第 N 个 Chunk</text><text x="1200" y="165" class="small" text-anchor="middle">安全策略 / Tool 事件</text><text x="1470" y="165" class="small" text-anchor="middle">完成</text>
  <rect x="365" y="175" width="110" height="52" rx="5" fill="#64748b"/><text x="420" y="208" class="body inv" text-anchor="middle">发送</text><rect x="365" y="275" width="110" height="52" rx="5" fill="#2f6fab"/><text x="420" y="308" class="body inv" text-anchor="middle">路由</text><rect x="365" y="395" width="110" height="52" rx="5" fill="#b88407"/><text x="420" y="428" class="body inv" text-anchor="middle">准入</text>
  <rect x="390" y="515" width="210" height="52" rx="5" fill="#c85a16"/><text x="495" y="548" class="body inv" text-anchor="middle">预填充 + 解码</text>
  <rect x="625" y="515" width="110" height="52" rx="5" fill="#24864a"/><text x="680" y="548" class="body inv" text-anchor="middle">T1</text><rect x="885" y="515" width="110" height="52" rx="5" fill="#24864a"/><text x="940" y="548" class="body inv" text-anchor="middle">TN</text><rect x="1415" y="515" width="110" height="52" rx="5" fill="#24864a"/><text x="1470" y="548" class="body inv" text-anchor="middle">完成</text>
  <rect x="625" y="395" width="110" height="52" rx="5" fill="#b88407"/><text x="680" y="428" class="body inv" text-anchor="middle">审核</text><rect x="885" y="395" width="110" height="52" rx="5" fill="#b88407"/><text x="940" y="428" class="body inv" text-anchor="middle">审核</text><rect x="1140" y="395" width="120" height="52" rx="5" fill="#7653a6"/><text x="1200" y="428" class="body inv" text-anchor="middle">策略</text>
  <rect x="625" y="275" width="110" height="52" rx="5" fill="#2f6fab"/><text x="680" y="308" class="body inv" text-anchor="middle">转发</text><rect x="885" y="275" width="110" height="52" rx="5" fill="#2f6fab"/><text x="940" y="308" class="body inv" text-anchor="middle">转发</text><rect x="1415" y="275" width="110" height="52" rx="5" fill="#2f6fab"/><text x="1470" y="308" class="body inv" text-anchor="middle">关闭</text>
  <rect x="625" y="155" width="110" height="52" rx="5" fill="#24864a"/><text x="680" y="188" class="body inv" text-anchor="middle">渲染 T1</text><rect x="885" y="155" width="110" height="52" rx="5" fill="#24864a"/><text x="940" y="188" class="body inv" text-anchor="middle">渲染 TN</text><rect x="1415" y="155" width="110" height="52" rx="5" fill="#24864a"/><text x="1470" y="188" class="body inv" text-anchor="middle">完成</text>
  <path d="M420 227V253" stroke="#52647a" stroke-width="3"/><polygon points="408,253 432,253 420,275" fill="#52647a"/><path d="M420 327V373" stroke="#52647a" stroke-width="3"/><polygon points="408,373 432,373 420,395" fill="#52647a"/><path d="M420 447V493" stroke="#52647a" stroke-width="3"/><polygon points="408,493 432,493 420,515" fill="#52647a"/>
  <path d="M680 515V469" stroke="#52647a" stroke-width="3"/><polygon points="668,469 692,469 680,447" fill="#52647a"/><path d="M680 395V349" stroke="#52647a" stroke-width="3"/><polygon points="668,349 692,349 680,327" fill="#52647a"/><path d="M680 275V229" stroke="#52647a" stroke-width="3"/><polygon points="668,229 692,229 680,207" fill="#52647a"/>
  <path d="M940 515V469" stroke="#52647a" stroke-width="3"/><polygon points="928,469 952,469 940,447" fill="#52647a"/><path d="M940 395V349" stroke="#52647a" stroke-width="3"/><polygon points="928,349 952,349 940,327" fill="#52647a"/><path d="M940 275V229" stroke="#52647a" stroke-width="3"/><polygon points="928,229 952,229 940,207" fill="#52647a"/>
  <line x1="420" y1="660" x2="1448" y2="660" stroke="#7653a6" stroke-width="8"/><polygon points="1448,648 1448,672 1470,660" fill="#7653a6"/><text x="945" y="640" class="body" text-anchor="middle">SSE / Streaming 连接持续保持</text>
  <rect x="170" y="775" width="1260" height="78" rx="6" fill="#172033"/><text x="800" y="808" class="head inv" text-anchor="middle">Streaming SLO = TTFT + 事件间隔 + 完整交付 + 断线 / 恢复</text><text x="800" y="838" class="body inv" text-anchor="middle">HTTP 200 只说明连接开始，不代表全部内容已交付</text>
</svg>
