<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Training wall-clock and useful progress</title>
  <desc id="desc">Training wall-clock includes useful compute, collectives, pipeline bubbles, checkpointing, recovery, and idle time. Only a portion advances the target checkpoint.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:19px;font-weight:750}.body{font-size:16px;fill:#52647a}.small{font-size:14px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="840" fill="#f7f9fc"/><text x="800" y="58" class="title">GPU Wall-clock Does Not All Become Training Progress</text>
  <text x="80" y="120" class="head">Wall-clock of One Training Run</text>
  <rect x="80" y="150" width="650" height="95" fill="#2f6fab"/><text x="405" y="192" class="head inv" text-anchor="middle">Forward · Backward</text><text x="405" y="220" class="small inv" text-anchor="middle">Advances model state</text>
  <rect x="730" y="150" width="250" height="95" fill="#167d73"/><text x="855" y="192" class="head inv" text-anchor="middle">Collective</text><text x="855" y="220" class="small inv" text-anchor="middle">Required sync</text>
  <rect x="980" y="150" width="170" height="95" fill="#b88407"/><text x="1065" y="192" class="head inv" text-anchor="middle">Bubble</text><text x="1065" y="220" class="small inv" text-anchor="middle">Waiting</text>
  <rect x="1150" y="150" width="170" height="95" fill="#7653a6"/><text x="1235" y="192" class="head inv" text-anchor="middle">Checkpoint</text><text x="1235" y="220" class="small inv" text-anchor="middle">Save state</text>
  <rect x="1320" y="150" width="200" height="95" fill="#c85a16"/><text x="1420" y="192" class="head inv" text-anchor="middle">Recovery · Idle</text><text x="1420" y="220" class="small inv" text-anchor="middle">Replay and wait</text>
  <path d="M800 275V320" stroke="#52647a" stroke-width="4"/><polygon points="788,320 812,320 800,342" fill="#52647a"/>
  <rect x="165" y="342" width="1270" height="86" rx="6" fill="#fff" stroke="#d5dde7" stroke-width="2"/><text x="210" y="376" class="head">Allocated GPU-hours</text><text x="210" y="405" class="body">Scheduler reservation, including wait and failure time</text>
  <rect x="245" y="462" width="1110" height="86" rx="6" fill="#eef3f8" stroke="#b8c6d6" stroke-width="2"/><text x="290" y="496" class="head">Job-running GPU-hours</text><text x="290" y="525" class="body">Still includes communication, bubbles, and checkpoint overhead</text>
  <rect x="325" y="582" width="950" height="86" rx="6" fill="#dceaf6" stroke="#7ca5c9" stroke-width="2"/><text x="370" y="616" class="head">Useful Training GPU-hours</text><text x="370" y="645" class="body">The portion that advances tokens, FLOPs, and model state</text>
  <rect x="405" y="702" width="790" height="78" rx="6" fill="#2f6fab"/><text x="800" y="735" class="head inv" text-anchor="middle">Accepted Checkpoint · Target Quality</text><text x="800" y="763" class="small inv" text-anchor="middle">Final acceptance unit</text>
  <text x="800" y="820" class="small" text-anchor="middle">Illustrative: shares vary with model, topology, failures, and checkpoint policy</text>
</svg>
