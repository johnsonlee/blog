<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc"><title id="title">AEP 当前价格隐含的 2030 operating EPS</title><desc id="desc">在不同退出倍数下反推当前股价要求的盈利与复合增速。</desc><rect width="1440" height="840" fill="#F7F9FC"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style><rect x="60" y="70" width="370" height="710" rx="8" fill="#26364D"/><text x="245" y="140" fill="#FFFFFF" font-size="34" font-weight="800" text-anchor="middle"><tspan x="245" dy="0">AEP</tspan></text><text x="245" y="230" fill="#FFFFFF" font-size="56" font-weight="800" text-anchor="middle"><tspan x="245" dy="0">$120.94</tspan></text><text x="245" y="272" fill="#C7D2E3" font-size="19" font-weight="600" text-anchor="middle"><tspan x="245" dy="0">2026-08-21 收盘</tspan></text><line x1="120" y1="325" x2="370" y2="325" stroke="#64748B" stroke-width="2"/><text x="245" y="385" fill="#C7D2E3" font-size="19" font-weight="600" text-anchor="middle"><tspan x="245" dy="0">2026 operating EPS 指引中点</tspan></text><text x="245" y="445" fill="#FFFFFF" font-size="45" font-weight="800" text-anchor="middle"><tspan x="245" dy="0">$6.40</tspan></text><text x="245" y="495" fill="#8FD8C4" font-size="27" font-weight="800" text-anchor="middle"><tspan x="245" dy="0">18.9x</tspan></text><text x="245" y="590" fill="#C7D2E3" font-size="19" font-weight="550" text-anchor="middle"><tspan x="245" dy="0">8% 年回报要求</tspan><tspan x="245" dy="30">股息每年增长 5%</tspan><tspan x="245" dy="30">2026 → 2030：4 年</tspan></text><text x="510" y="105" fill="#172033" font-size="27" font-weight="800" text-anchor="start"><tspan x="510" dy="0">当前价格需要怎样的 2030 盈利？</tspan></text><text x="510" y="155" fill="#5E6B7E" font-size="20" font-weight="600" text-anchor="start"><tspan x="510" dy="0">股息纳入总回报；退出倍数决定增长门槛</tspan></text><rect x="510" y="215" width="860" height="112" rx="8" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="610" y="263" fill="#C93E4F" font-size="29" font-weight="800" text-anchor="middle"><tspan x="610" dy="0">16x</tspan></text><text x="820" y="263" fill="#172033" font-size="29" font-weight="800" text-anchor="middle"><tspan x="820" dy="0">$9.08</tspan></text><text x="1040" y="263" fill="#172033" font-size="29" font-weight="800" text-anchor="middle"><tspan x="1040" dy="0">9.1%</tspan></text><text x="1250" y="263" fill="#172033" font-size="19" font-weight="800" text-anchor="middle"><tspan x="1250" dy="0">接近指引上沿</tspan></text><text x="610" y="297" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="610" dy="0">退出 P/E</tspan></text><text x="820" y="297" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="820" dy="0">2030 EPS</tspan></text><text x="1040" y="297" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1040" dy="0">EPS CAGR</tspan></text><text x="1250" y="297" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1250" dy="0">判断</tspan></text><rect x="510" y="365" width="860" height="112" rx="8" fill="#FFF0CC" stroke="#C77800" stroke-width="2"/><text x="610" y="413" fill="#C77800" font-size="29" font-weight="800" text-anchor="middle"><tspan x="610" dy="0">18x</tspan></text><text x="820" y="413" fill="#172033" font-size="29" font-weight="800" text-anchor="middle"><tspan x="820" dy="0">$8.07</tspan></text><text x="1040" y="413" fill="#172033" font-size="29" font-weight="800" text-anchor="middle"><tspan x="1040" dy="0">6.0%</tspan></text><text x="1250" y="413" fill="#172033" font-size="19" font-weight="800" text-anchor="middle"><tspan x="1250" dy="0">低于指引下沿</tspan></text><text x="610" y="447" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="610" dy="0">退出 P/E</tspan></text><text x="820" y="447" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="820" dy="0">2030 EPS</tspan></text><text x="1040" y="447" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1040" dy="0">EPS CAGR</tspan></text><text x="1250" y="447" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1250" dy="0">判断</tspan></text><rect x="510" y="515" width="860" height="112" rx="8" fill="#DDF4EC" stroke="#0F8A6A" stroke-width="2"/><text x="610" y="563" fill="#0F8A6A" font-size="29" font-weight="800" text-anchor="middle"><tspan x="610" dy="0">20x</tspan></text><text x="820" y="563" fill="#172033" font-size="29" font-weight="800" text-anchor="middle"><tspan x="820" dy="0">$7.26</tspan></text><text x="1040" y="563" fill="#172033" font-size="29" font-weight="800" text-anchor="middle"><tspan x="1040" dy="0">3.2%</tspan></text><text x="1250" y="563" fill="#172033" font-size="19" font-weight="800" text-anchor="middle"><tspan x="1250" dy="0">留出更多余量</tspan></text><text x="610" y="597" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="610" dy="0">退出 P/E</tspan></text><text x="820" y="597" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="820" dy="0">2030 EPS</tspan></text><text x="1040" y="597" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1040" dy="0">EPS CAGR</tspan></text><text x="1250" y="597" fill="#5E6B7E" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1250" dy="0">判断</tspan></text><rect x="540" y="700" width="800" height="82" rx="7" fill="#26364D" stroke="#26364D" stroke-width="2"/><text x="940" y="735" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle"><tspan x="940" dy="0">69GW “已签约负荷”不能直接等同于已送电、满负荷或确定利润</tspan><tspan x="940" dy="30">18x 情景已计入大部分指引下沿增长</tspan></text></svg>
