<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Agent task capacity ledger</title><desc id="desc">Task arrival expands into in-flight work, turns, model invocations, SLO-qualified inference, verification, and successful tasks per MW.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750}.body{font-size:15px;fill:#52647a}.small{font-size:14px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="960" fill="#f7f9fc"/><text x="800" y="58" class="title">A Task Must Expand into Invocations Before Mapping to Capacity</text>
  <rect x="70" y="105" width="1460" height="690" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/><text x="110" y="150" class="head">Capacity Unit</text><text x="1140" y="150" class="head">What Changes Here</text>
  <rect x="110" y="180" width="920" height="72" rx="5" fill="#64748b"/><text x="145" y="224" class="head inv">Task Arrival / Minute</text><text x="1140" y="224" class="body">Accepted · Rejected · Queued</text>
  <rect x="160" y="275" width="870" height="72" rx="5" fill="#7653a6"/><text x="195" y="319" class="head inv">In-flight Task</text><text x="1140" y="319" class="body">Model Active · Tool Wait · Approval Wait</text>
  <rect x="210" y="370" width="820" height="72" rx="5" fill="#2f6fab"/><text x="245" y="414" class="head inv">Turns / Task</text><text x="1140" y="414" class="body">Plan · Observe · Act · Retry · Handoff</text>
  <rect x="260" y="465" width="770" height="72" rx="5" fill="#167d73"/><text x="295" y="509" class="head inv">Active Model Invocation</text><text x="1140" y="509" class="body">Model Mix · Context · Output · Parallel Width</text>
  <rect x="310" y="560" width="720" height="72" rx="5" fill="#c85a16"/><text x="345" y="604" class="head inv">SLO-qualified Inference</text><text x="1140" y="604" class="body">TTFT · TPOT · Error · Deadline</text>
  <rect x="360" y="655" width="670" height="72" rx="5" fill="#24864a"/><text x="395" y="699" class="head inv">Successful Task</text><text x="1140" y="699" class="body">Quality Gate · Accepted · No Rework</text>
  <rect x="170" y="835" width="1260" height="72" rx="6" fill="#172033"/><text x="800" y="865" class="head inv" text-anchor="middle">Tasks / MW = Tasks Passing the Quality Gate Within SLO ÷ Metered Energy</text><text x="800" y="893" class="small inv" text-anchor="middle">Driven by invocations per task, tokens per call, cache, model mix, retry, and success</text>
  <text x="800" y="944" class="small" text-anchor="middle">Average tokens hide P99 long context, fan-out, tool timeouts, and retry bursts</text>
</svg>
