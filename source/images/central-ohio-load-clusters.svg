<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770" role="img" aria-labelledby="title desc"><title id="title">13,022.7MW 为什么分成三种结果？</title><desc id="desc">AEP Ohio 根据区域工程能够释放的容量，把 36 个数据中心项目分成三个 cluster。</desc><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}.compact{font-size:17px}.body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}.number{font-size:38px;font-weight:780}.metric{font-size:28px;font-weight:760}.node{font-size:12px;font-weight:760}.inverse{fill:#ffffff}</style><rect width="1600" height="770" fill="#f7f9fc"/><text x="800" y="58" class="title" text-anchor="middle">13,022.7MW 为什么分成三种结果？</text><rect x="55" y="150" width="300" height="455" rx="6" fill="#19243a" stroke="#19243a" stroke-width="0"/><text x="205" y="205" class="head inverse" text-anchor="middle">36 个 SITE</text><text x="205" y="270" class="number" text-anchor="middle" style="fill:#ffffff">13,022.7MW</text><line x1="105" y1="305" x2="305" y2="305" stroke="#7f8da4" stroke-width="1" stroke-linecap="round"/><text x="205" y="355" class="body inverse" text-anchor="middle"><tspan x="205" dy="0">Central Ohio</tspan><tspan x="205" dy="27">32 座 · 9,807.7MW</tspan></text><text x="205" y="435" class="body inverse" text-anchor="middle"><tspan x="205" dy="0">区域外</tspan><tspan x="205" dy="27">4 座 · 3,215MW</tspan></text><text x="205" y="535" class="small" text-anchor="middle" style="fill:#b9c5d6"><tspan x="205" dy="0">模型已经假设</tspan><tspan x="205" dy="24">generation 充足</tspan></text><line x1="355" y1="375" x2="425" y2="375" stroke="#607089" stroke-width="3" stroke-linecap="round"/><line x1="425" y1="215" x2="425" y2="635" stroke="#607089" stroke-width="3" stroke-linecap="round"/><line x1="425" y1="215" x2="470" y2="215" stroke="#2f6fab" stroke-width="3" stroke-linec