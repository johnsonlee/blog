<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Inference delivery capacity ledger</title><desc id="desc">A client request crosses eligible-region, edge, regional route, gateway, SLO-qualified inference, stream completion, and client acceptance gates before becoming delivered tasks per MW.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750}.body{font-size:15px;fill:#52647a}.small{font-size:13px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="980" fill="#f7f9fc"/><text x="800" y="58" class="title">A Token Is Delivered Only When It Reaches the Client Within SLO</text><rect x="65" y="105" width="1470" height="710" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/><text x="105" y="150" class="head">Delivery Unit</text><text x="1130" y="150" class="head">What This Gate Removes</text>
  <rect x="105" y="180" width="900" height="68" rx="5" fill="#64748b"/><text x="140" y="222" class="head inv">Client Request</text><text x="1130" y="222" class="body">Invalid · Unauthorized · Rate Limited</text><rect x="145" y="267" width="860" height="68" rx="5" fill="#7653a6"/><text x="180" y="309" class="head inv">Eligible Region Set</text><text x="1130" y="309" class="body">Model · Geography · Tier · Residency</text><rect x="185" y="354" width="820" height="68" rx="5" fill="#2f6fab"/><text x="220" y="396" class="head inv">Edge + Regional Route</text><text x="1130" y="396" class="body">Network Error · Wrong Region · Excess RTT</text><rect x="225" y="441" width="780" height="68" rx="5" fill="#167d73"/><text x="260" y="483" class="head inv">Inference Gateway</text><text x="1130" y="483" class="body">No Warm Model · Queue · No KV Fit</text><rect x="265" y="528" width="740" height="68" rx="5" fill="#c85a16"/><text x="300" y="570" class="head inv">SLO-qualified Inference</text><text x="1130" y="570" class="body">TTFT · TPOT · Error · Quality</text><rect x="305" y="615" width="700" height="68" rx="5" fill="#b88407"/><text x="340" y="657" class="head inv">Stream / Response Complete</text><text x="1130" y="657" class="body">Buffer · Disconnect · Guardrail · Timeout</text><rect x="345" y="702" width="660" height="68" rx="5" fill="#24864a"/><text x="380" y="744" class="head inv">Client Accepted Delivery</text><text x="1130" y="744" class="body">Deadline Met · Result Received · No Replay</text>
  <rect x="155" y="855" width="1290" height="78" rx="6" fill="#172033"/><text x="800" y="887" class="head inv" text-anchor="middle">Delivered Tasks / MW = Successful Tasks Accepted by Clients Within SLO ÷ Metered Energy</text><text x="800" y="917" class="body inv" text-anchor="middle">Track Cross-region Ratio, Network Share of TTFT, Egress Bytes, Disconnects, and Replay</text><text x="800" y="965" class="small" text-anchor="middle">Compute already completed becomes stranded cost when delivery fails</text>
</svg>
