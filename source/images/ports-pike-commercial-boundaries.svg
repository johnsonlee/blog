<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="865" viewBox="0 0 1600 865" role="img" aria-labelledby="title desc">
  <title id="title">项目资金与 OpenAI 租金走两条路径</title>
  <desc id="desc">发电项目资金仍停在尚未披露的供应商合同，数据中心租金则要等到容量可租赁以后才开始。</desc>
  <style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}
    .title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}
    .body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}
    .number{font-size:38px;font-weight:780}.table{font-size:15px;font-weight:620}.inverse{fill:#fff}
  </style>
  <rect width="1600" height="865" fill="#f7f9fc"/>
  <text x="800" y="60" class="title" text-anchor="middle" >项目资金与 OpenAI 租金走两条路径</text><rect x="55" y="155" width="155" height="210" rx="6" fill="#c85a16" stroke="#c85a16" stroke-width="2"/><text x="132.5" y="271" class="head inverse" text-anchor="middle" >发电项目</text><rect x="260" y="155" width="265" height="210" rx="6" fill="#fff0e5" stroke="#c85a16" stroke-width="2"/><text x="392.5" y="233" class="section" text-anchor="middle" >333 亿美元</text><text x="392.5" y="287" class="body" text-anchor="middle"><tspan x="392.5" dy="0">日本项目资金</tspan></text><line x1="525" y1="260" x2="597" y2="260" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M597 252 L610 260 L597 268 Z" fill="#52647a"/><rect x="610" y="155" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="742.5" y="233" class="head" text-anchor="middle" >美国政府</text><text x="742.5" y="287" class="body" text-anchor="middle"><tspan x="742.5" dy="0">持有 9.2GW 天然气发电</tspan></text><line x1="875" y1="260" x2="947" y2="260" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M947 252 L960 260 L947 268 Z" fill="#52647a"/><rect x="960" y="155" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1092.5" y="233" class="head" text-anchor="middle" >OEM · EPC · 管道</text><text x="1092.5" y="287" class="body" text-anchor="middle"><tspan x="1092.5" dy="0">合同尚未披露</tspan></text><line x1="1225" y1="260" x2="1297" y2="260" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1297 252 L1310 260 L1297 268 Z" fill="#52647a"/><rect x="1310" y="155" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1442.5" y="233" class="head" text-anchor="middle" >上市供应商</text><text x="1442.5" y="287" class="body" text-anchor="middle"><tspan x="1442.5" dy="0">收入与毛利无法验证</tspan></text><rect x="55" y="485" width="155" height="210" rx="6" fill="#2f6fab" stroke="#2f6fab" stroke-width="2"/><text x="132.5" y="601" class="head inverse" text-anchor="middle" >数据中心</text><rect x="260" y="485" width="265" height="210" rx="6" fill="#eaf2fb" stroke="#2f6fab" stroke-width="2"/><text x="392.5" y="563" class="section" text-anchor="middle" >20 年 Lease</text><text x="392.5" y="617" class="body" text-anchor="middle"><tspan x="392.5" dy="0">OpenAI ↔ SB Energy</tspan></text><line x1="525" y1="590" x2="597" y2="590" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M597 582 L610 590 L597 598 Z" fill="#52647a"/><rect x="610" y="485" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="742.5" y="563" class="head" text-anchor="middle" >Land · Power · Shell</text><text x="742.5" y="617" class="body" text-anchor="middle"><tspan x="742.5" dy="0">建设并完成调试</tspan></text><line x1="875" y1="590" x2="947" y2="590" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M947 582 L960 590 L947 598 Z" fill="#52647a"/><rect x="960" y="485" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1092.5" y="563" class="head" text-anchor="middle" >Capacity Available</text><text x="1092.5" y="617" class="body" text-anchor="middle"><tspan x="1092.5" dy="0">OpenAI 开始付款</tspan></text><line x1="1225" y1="590" x2="1297" y2="590" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1297 582 L1310 590 L1297 598 Z" fill="#52647a"/><rect x="1310" y="485" width="265" height="210" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1442.5" y="563" class="head" text-anchor="middle" >SoftBank 现金流</text><text x="1442.5" y="617" class="body" text-anchor="middle"><tspan x="1442.5" dy="0">项目 bridge 尚未披露</tspan></text><rect x="180" y="760" width="1240" height="64" rx="6" fill="#172033" stroke="#172033" stroke-width="2"/><text x="800" y="800" class="head inverse" text-anchor="middle" >项目资金不等于供应商 backlog，Lease 也不等于发电收入。</text>
</svg>
