<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">10GW 与 8 IT-GW 不能直接相减</title>
  <desc id="desc">从新建发电到 IT 容量之间隔着六个容量边界，公开信息只披露了两端。</desc>
  <style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}
    .title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}
    .body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}
    .number{font-size:38px;font-weight:780}.table{font-size:15px;font-weight:620}.inverse{fill:#fff}
  </style>
  <rect width="1600" height="650" fill="#f7f9fc"/>
  <text x="800" y="60" class="title" text-anchor="middle" >10GW 与 8 IT-GW 不能直接相减</text><line x1="50" y1="115" x2="795" y2="115" stroke="#c85a16" stroke-width="4"/><line x1="805" y1="115" x2="1550" y2="115" stroke="#2f6fab" stroke-width="4"/><text x="65" y="101" class="small" text-anchor="start" >发电侧</text><text x="1535" y="101" class="small" text-anchor="end" >数据中心侧</text><rect x="50" y="175" width="210" height="300" rx="6" fill="#fff0e5" stroke="#c85a16" stroke-width="2"/><text x="155" y="235" class="number" text-anchor="middle" >10GW</text><text x="155" y="278" class="head" text-anchor="middle" >新建发电</text><line x1="78" y1="315" x2="232" y2="315" stroke="#d8e0e9" stroke-width="2"/><text x="155" y="365" class="head" text-anchor="middle" fill="#c85a16">已披露</text><text x="155" y="414" class="small" text-anchor="middle" >至少 9.2GW 天然气</text><line x1="260" y1="325" x2="295" y2="325" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M295 317 L308 325 L295 333 Z" fill="#52647a"/><rect x="308" y="175" width="210" height="300" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="413" y="235" class="section" text-anchor="middle" >电厂净出力</text><text x="413" y="278" class="head" text-anchor="middle" >Plant Boundary</text><line x1="336" y1="315" x2="490" y2="315" stroke="#d8e0e9" stroke-width="2"/><text x="413" y="365" class="head" text-anchor="middle" fill="#b88407">未披露</text><text x="413" y="414" class="small" text-anchor="middle" >厂用电 · 环境折减</text><line x1="518" y1="325" x2="553" y2="325" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M553 317 L566 325 L553 333 Z" fill="#52647a"/><rect x="566" y="175" width="210" height="300" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="671" y="235" class="section" text-anchor="middle" >可靠容量</text><text x="671" y="278" class="head" text-anchor="middle" >Accredited Capacity</text><line x1="594" y1="315" x2="748" y2="315" stroke="#d8e0e9" stroke-width="2"/><text x="671" y="365" class="head" text-anchor="middle" fill="#b88407">未披露</text><text x="671" y="414" class="small" text-anchor="middle" >停运 · 燃料 · ELCC</text><line x1="776" y1="325" x2="811" y2="325" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M811 317 L824 325 L811 333 Z" fill="#52647a"/><rect x="824" y="175" width="210" height="300" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="929" y="235" class="section" text-anchor="middle" >节点可送达</text><text x="929" y="278" class="head" text-anchor="middle" >Grid Delivery</text><line x1="852" y1="315" x2="1006" y2="315" stroke="#d8e0e9" stroke-width="2"/><text x="929" y="365" class="head" text-anchor="middle" fill="#b88407">未披露</text><text x="929" y="414" class="small" text-anchor="middle" >位置 · 输电约束</text><line x1="1034" y1="325" x2="1069" y2="325" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1069 317 L1082 325 L1069 333 Z" fill="#52647a"/><rect x="1082" y="175" width="210" height="300" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1187" y="235" class="section" text-anchor="middle" >设施总负荷</text><text x="1187" y="278" class="head" text-anchor="middle" >Facility Demand</text><line x1="1110" y1="315" x2="1264" y2="315" stroke="#d8e0e9" stroke-width="2"/><text x="1187" y="365" class="head" text-anchor="middle" fill="#b88407">未披露</text><text x="1187" y="414" class="small" text-anchor="middle" >冷却 · 转换 · PUE</text><line x1="1292" y1="325" x2="1327" y2="325" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1327 317 L1340 325 L1327 333 Z" fill="#52647a"/><rect x="1340" y="175" width="210" height="300" rx="6" fill="#eaf2fb" stroke="#2f6fab" stroke-width="2"/><text x="1445" y="235" class="number" text-anchor="middle" >8 IT-GW</text><text x="1445" y="278" class="head" text-anchor="middle" >IT Capacity</text><line x1="1368" y1="315" x2="1522" y2="315" stroke="#d8e0e9" stroke-width="2"/><text x="1445" y="365" class="head" text-anchor="middle" fill="#2f6fab">已披露</text><text x="1445" y="414" class="small" text-anchor="middle" >计算 · 网络 · 存储</text><rect x="180" y="550" width="1240" height="62" rx="6" fill="#172033" stroke="#172033" stroke-width="2"/><text x="800" y="590" class="head inverse" text-anchor="middle" >看似多出的 2GW，跨过了不同电表与可靠性口径。</text>
</svg>
