<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">The ledger from facility MW to Training and Inference output</title>
  <desc id="desc">Physical capacity passes healthy and scheduler gates, then splits into Training and Inference, producing accepted checkpoints or SLO-qualified billable service.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750}.body{font-size:15px;fill:#52647a}.small{font-size:14px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="980" fill="#f7f9fc"/><text x="800" y="58" class="title">100MW Passes Physical Gates Before Workload Accounting</text>
  <rect x="200" y="100" width="1200" height="72" rx="6" fill="#64748b"/><text x="240" y="144" class="head inv">Facility IT Load · Metered Energy</text>
  <rect x="250" y="192" width="1100" height="72" rx="6" fill="#52647a"/><text x="290" y="236" class="head inv">Healthy · Schedulable Capacity</text><text x="1310" y="236" class="body inv" text-anchor="end">Less DRAIN · Maintenance · Fragmentation</text>
  <path d="M800 264V304H430V330M800 304H1170V330" fill="none" stroke="#52647a" stroke-width="4"/><polygon points="418,330 442,330 430,352" fill="#52647a"/><polygon points="1158,330 1182,330 1170,352" fill="#52647a"/>
  <text x="430" y="390" class="head" text-anchor="middle">Training Allocation</text><text x="1170" y="390" class="head" text-anchor="middle">Inference Allocation</text>
  <rect x="90" y="420" width="680" height="78" rx="5" fill="#e9f1f8" stroke="#7ca5c9" stroke-width="2"/><text x="130" y="453" class="head">Allocated GPU-hours</text><text x="130" y="480" class="body">Large contiguous partition · Reservation</text>
  <rect x="130" y="520" width="640" height="78" rx="5" fill="#dceaf6" stroke="#7ca5c9" stroke-width="2"/><text x="170" y="553" class="head">Job-running GPU-hours</text><text x="170" y="580" class="body">Less launch, queue, and failed allocation</text>
  <rect x="170" y="620" width="600" height="78" rx="5" fill="#c9def0" stroke="#2f6fab" stroke-width="2"/><text x="210" y="653" class="head">Useful Training Tokens / FLOPs</text><text x="210" y="680" class="body">Less bubbles, checkpoint, and restart loss</text>
  <rect x="210" y="720" width="560" height="78" rx="5" fill="#2f6fab"/><text x="250" y="753" class="head inv">Accepted Checkpoint</text><text x="250" y="780" class="body inv">Target quality · Deadline</text>
  <rect x="830" y="420" width="680" height="78" rx="5" fill="#faeee6" stroke="#d88a55" stroke-width="2"/><text x="870" y="453" class="head">Provisioned Replica-hours</text><text x="870" y="480" class="body">Model · Region · SLO · Headroom</text>
  <rect x="830" y="520" width="640" height="78" rx="5" fill="#f5ddcd" stroke="#d88a55" stroke-width="2"/><text x="870" y="553" class="head">Active Serving GPU-hours</text><text x="870" y="580" class="body">Less cold start, failover, and unavailable</text>
  <rect x="830" y="620" width="600" height="78" rx="5" fill="#efc8ae" stroke="#c85a16" stroke-width="2"/><text x="870" y="653" class="head">SLO-qualified Tokens</text><text x="870" y="680" class="body">TTFT · TPOT · Error · Quality pass</text>
  <rect x="830" y="720" width="560" height="78" rx="5" fill="#c85a16"/><text x="870" y="753" class="head inv">Billable Request / Subscription</text><text x="870" y="780" class="body inv">Revenue boundary</text>
  <rect x="190" y="850" width="1220" height="78" rx="6" fill="#172033"/><text x="800" y="882" class="head inv" text-anchor="middle">Same Denominator: Metered Energy · Different Numerators: Progress / Service</text><text x="800" y="910" class="small inv" text-anchor="middle">Without target quality or an SLO, any output-per-MW claim lacks acceptance</text>
  <text x="800" y="964" class="small" text-anchor="middle">Each layer tracks yield, loss, recovery time, and current owner</text>
</svg>
