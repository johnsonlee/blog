<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cross-region inference spillover pools</title><desc id="desc">Single Region, Geographic Pool, and Global Pool progressively expand available capacity while widening network paths, state replication, and processing boundaries.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750;text-anchor:middle}.body{font-size:15px;fill:#52647a;text-anchor:middle}.small{font-size:13px;fill:#607089;text-anchor:middle}.inv{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="58" class="title">Spillover Expands the Capacity Pool and the Delivery Boundary</text>
  <rect x="45" y="120" width="470" height="620" rx="7" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="280" y="165" class="head">Single Region</text><rect x="110" y="235" width="340" height="150" rx="7" fill="#2f6fab"/><text x="280" y="278" class="head inv">Region A</text><text x="280" y="312" class="body inv">Primary Queue</text><text x="280" y="344" class="body inv">Local Model Pool</text><path d="M280 385V460" stroke="#c85a16" stroke-width="5"/><polygon points="268,460 292,460 280,482" fill="#c85a16"/><rect x="110" y="482" width="340" height="92" rx="6" fill="#fff3ea" stroke="#c85a16" stroke-width="2"/><text x="280" y="520" class="head">Full or Failed</text><text x="280" y="550" class="body">Throttle / Error</text><text x="280" y="650" class="body">Narrowest Processing Boundary</text><text x="280" y="680" class="body">Smallest Shared Pool</text>
  <rect x="565" y="120" width="470" height="620" rx="7" fill="#fff" stroke="#167d73" stroke-width="2"/><text x="800" y="165" class="head">Geographic Pool</text><rect x="620" y="225" width="160" height="120" rx="6" fill="#2f6fab"/><text x="700" y="270" class="head inv">A</text><text x="700" y="305" class="body inv">Busy</text><rect x="820" y="225" width="160" height="120" rx="6" fill="#24864a"/><text x="900" y="270" class="head inv">B</text><text x="900" y="305" class="body inv">Available</text><line x1="780" y1="285" x2="798" y2="285" stroke="#24864a" stroke-width="4"/><polygon points="798,273 798,297 820,285" fill="#24864a"/><rect x="620" y="420" width="360" height="130" rx="6" fill="#e8f3f1" stroke="#167d73" stroke-width="2"/><text x="800" y="460" class="head">US / EU / APAC Boundary</text><text x="800" y="493" class="body">Spill Inside One Geography</text><text x="800" y="523" class="body">Replicate Model · Policy · Ops</text><text x="800" y="650" class="body">More Throughput and Failover</text><text x="800" y="680" class="body">More Cross-region Path</text>
  <rect x="1085" y="120" width="470" height="620" rx="7" fill="#fff" stroke="#7653a6" stroke-width="2"/><text x="1320" y="165" class="head">Global Pool</text><rect x="1135" y="225" width="110" height="110" rx="6" fill="#2f6fab"/><text x="1190" y="287" class="head inv">A</text><rect x="1265" y="225" width="110" height="110" rx="6" fill="#167d73"/><text x="1320" y="287" class="head inv">B</text><rect x="1395" y="225" width="110" height="110" rx="6" fill="#24864a"/><text x="1450" y="287" class="head inv">C</text><path d="M1190 335V385H1450V357" fill="none" stroke="#7653a6" stroke-width="4"/><polygon points="1438,357 1462,357 1450,335" fill="#7653a6"/><rect x="1135" y="420" width="370" height="130" rx="6" fill="#f0ebf7" stroke="#7653a6" stroke-width="2"/><text x="1320" y="460" class="head">Largest Region Set</text><text x="1320" y="493" class="body">More Available Capacity</text><text x="1320" y="523" class="body">Wider Processing Geography</text><text x="1320" y="650" class="body">Highest Sharing Efficiency</text><text x="1320" y="680" class="body">Most Complex Policy and State Path</text>
  <rect x="160" y="790" width="1280" height="68" rx="6" fill="#172033"/><text x="800" y="821" class="head inv">Spillover Requires Warm Model, Accelerator, Quota, Guardrails, and Observability at the Destination</text><text x="800" y="848" class="small inv">Traffic Shift Without Reserved Capacity Is Not Available Redundancy</text>
</svg>
