<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Inference gateway routing decision</title><desc id="desc">An Inference Gateway combines request requirements, regional policy, and live worker model, KV cache, queue, health, and cost state before choosing a worker.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750;text-anchor:middle}.body{font-size:15px;fill:#52647a;text-anchor:middle}.inv{fill:#fff}</style>
  <rect width="1600" height="920" fill="#f7f9fc"/><text x="800" y="58" class="title">An Inference Gateway Does Not Select “the Next Server”</text>
  <rect x="55" y="330" width="270" height="170" rx="7" fill="#64748b"/><text x="190" y="376" class="head inv">Incoming Request</text><text x="190" y="410" class="body inv">Model · Context · SLO</text><text x="190" y="440" class="body inv">Tier · Region · Policy</text><text x="190" y="470" class="body inv">Prefix · Adapter</text><line x1="325" y1="415" x2="393" y2="415" stroke="#52647a" stroke-width="4"/><polygon points="393,403 393,427 415,415" fill="#52647a"/>
  <rect x="415" y="280" width="400" height="270" rx="7" fill="#7653a6"/><text x="615" y="335" class="head inv">Inference Gateway</text><text x="615" y="375" class="body inv">Eligible Set</text><text x="615" y="410" class="body inv">Network Distance × Queue</text><text x="615" y="445" class="body inv">KV Overlap × Model Availability</text><text x="615" y="480" class="body inv">Cost × Residency × Health</text><text x="615" y="515" class="head inv">Score → Route</text><rect x="415" y="105" width="400" height="105" rx="6" fill="#eaf2fb" stroke="#2f6fab" stroke-width="2"/><text x="615" y="145" class="head">Global / Regional Policy</text><text x="615" y="178" class="body">Allowed Region · Service Tier · Failover</text><line x1="615" y1="210" x2="615" y2="258" stroke="#2f6fab" stroke-width="4"/><polygon points="603,258 627,258 615,280" fill="#2f6fab"/><rect x="415" y="620" width="400" height="105" rx="6" fill="#e8f3f1" stroke="#167d73" stroke-width="2"/><text x="615" y="660" class="head">Live Worker State</text><text x="615" y="693" class="body">KV Event · Active Load · Queue · Health</text><line x1="615" y1="620" x2="615" y2="572" stroke="#167d73" stroke-width="4"/><polygon points="603,572 627,572 615,550" fill="#167d73"/>
  <rect x="925" y="125" width="280" height="175" rx="7" fill="#2f6fab"/><text x="1065" y="168" class="head inv">Worker A</text><text x="1065" y="202" class="body inv">Model Warm</text><text x="1065" y="232" class="body inv">High KV Overlap</text><text x="1065" y="262" class="body inv">Queue: Medium</text><rect x="1250" y="125" width="280" height="175" rx="7" fill="#167d73"/><text x="1390" y="168" class="head inv">Worker B</text><text x="1390" y="202" class="body inv">Model Warm</text><text x="1390" y="232" class="body inv">No Prefix</text><text x="1390" y="262" class="body inv">Queue: Low</text><rect x="925" y="420" width="280" height="175" rx="7" fill="#c85a16"/><text x="1065" y="463" class="head inv">Worker C</text><text x="1065" y="497" class="body inv">Model Cold</text><text x="1065" y="527" class="body inv">Free Capacity</text><text x="1065" y="557" class="body inv">Load Time Required</text><rect x="1250" y="420" width="280" height="175" rx="7" fill="#24864a"/><text x="1390" y="463" class="head inv">Worker D</text><text x="1390" y="497" class="body inv">Model Warm</text><text x="1390" y="527" class="body inv">Prefix Cached</text><text x="1390" y="557" class="body inv">Queue: Low</text>
  <path d="M815 350H870V212H903" fill="none" stroke="#52647a" stroke-width="3"/><polygon points="903,200 903,224 925,212" fill="#52647a"/><path d="M815 385H850V80H1390V103" fill="none" stroke="#52647a" stroke-width="3"/><polygon points="1378,103 1402,103 1390,125" fill="#52647a"/><path d="M815 445H870V507H903" fill="none" stroke="#52647a" stroke-width="3"/><polygon points="903,495 903,519 925,507" fill="#52647a"/><path d="M815 480H850V760H1390V617" fill="none" stroke="#24864a" stroke-width="5"/><polygon points="1378,617 1402,617 1390,595" fill="#24864a"/>
  <rect x="250" y="790" width="1100" height="78" rx="6" fill="#172033"/><text x="800" y="823" class="head inv">Nearest Region ≠ Shortest Queue ≠ Highest KV Hit</text><text x="800" y="852" class="body inv">Routing Determines Network Path, Prefill Cost, and GPU Utilization</text>
</svg>
