<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="835" viewBox="0 0 1600 835" role="img" aria-labelledby="title desc">
  <title id="title">How much of each 1 GW nameplate counts as accredited capacity?</title>
  <desc id="desc">PJM 2028/2029 class ratings compare accredited capacity across five resource classes.</desc>
  <style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}
    .title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}
    .body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}
    .number{font-size:38px;font-weight:780}.table{font-size:15px;font-weight:620}.inverse{fill:#fff}
  </style>
  <rect width="1600" height="835" fill="#f7f9fc"/>
  <text x="800" y="60" class="title" text-anchor="middle" >How much of each 1 GW nameplate counts as accredited capacity?</text><text x="470" y="112" class="small" text-anchor="start" >PJM 2028/2029 ELCC class rating</text><line x1="1400" y1="130" x2="1400" y2="680" stroke="#b84444" stroke-width="2" stroke-dasharray="8 7"/><text x="1400" y="112" class="small" text-anchor="middle" >100%</text><text x="90" y="203" class="section" text-anchor="start" >Nuclear</text><rect x="470" y="155" width="930" height="68" rx="5" fill="#edf1f5"/><rect x="470" y="155" width="892.8" height="68" rx="5" fill="#24864a" opacity="0.92"/><text x="1338.8" y="200" class="head inverse" text-anchor="end" >96%</text><text x="1450" y="199" class="head" text-anchor="start" >0.96 GW</text><text x="90" y="308" class="section" text-anchor="start" >Gas combined cycle</text><rect x="470" y="260" width="930" height="68" rx="5" fill="#edf1f5"/><rect x="470" y="260" width="725.4" height="68" rx="5" fill="#c85a16" opacity="0.92"/><text x="1171.4" y="305" class="head inverse" text-anchor="end" >78%</text><text x="1450" y="304" class="head" text-anchor="start" >0.78 GW</text><text x="90" y="413" class="section" text-anchor="start" >Gas combustion turbine</text><rect x="470" y="365" width="930" height="68" rx="5" fill="#edf1f5"/><rect x="470" y="365" width="623.1" height="68" rx="5" fill="#b88407" opacity="0.92"/><text x="1069.1" y="410" class="head inverse" text-anchor="end" >67%</text><text x="1450" y="409" class="head" text-anchor="start" >0.67 GW</text><text x="90" y="518" class="section" text-anchor="start" >4-hour storage</text><rect x="470" y="470" width="930" height="68" rx="5" fill="#edf1f5"/><rect x="470" y="470" width="548.7" height="68" rx="5" fill="#7653a6" opacity="0.92"/><text x="994.7" y="515" class="head inverse" text-anchor="end" >59%</text><text x="1450" y="514" class="head" text-anchor="start" >0.59 GW</text><text x="90" y="623" class="section" text-anchor="start" >Tracking solar</text><rect x="470" y="575" width="930" height="68" rx="5" fill="#edf1f5"/><rect x="470" y="575" width="93" height="68" rx="5" fill="#2f6fab" opacity="0.92"/><text x="539" y="620" class="head inverse" text-anchor="end" >10%</text><text x="1450" y="619" class="head" text-anchor="start" >0.10 GW</text><rect x="140" y="720" width="1320" height="75" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="800" y="751" class="small" text-anchor="middle" >Class ratings change with the resource mix and risk hours.</text><text x="800" y="778" class="small" text-anchor="middle" >They are not a PORTS-Pike forecast or a substitute for resource-specific accreditation.</text>
</svg>
