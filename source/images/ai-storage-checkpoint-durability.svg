<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1450" viewBox="0 0 720 1450" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint 从快速快照走到可恢复状态</title>
  <desc id="desc">异步 checkpoint 先把训练状态快照到 host memory 或 local NVMe，让 GPU 恢复计算；只有 checkpoint data 进入共享高性能存储并能被另一台 node 读取以后，才形成 recovery point；对象存储再把保留副本带离 shared HPS 自身的 system 或 site failure domain。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #182338; }
    .h { font-size: 30px; font-weight: 760; }
    .k { font-size: 27px; font-weight: 730; }
    .b { font-size: 22px; font-weight: 650; }
    .s { font-size: 19px; fill: #526176; }
    .inv { fill: #fff; }
    .muted { fill: #dbe6f5; }
    .section { font-size: 26px; font-weight: 760; }
  </style>
  <rect width="720" height="1450" fill="#f6f8fb"/>

  <rect x="80" y="36" width="560" height="122" rx="6" fill="#182338"/>
  <text x="360" y="84" text-anchor="middle" class="h inv">Training State</text>
  <text x="360" y="124" text-anchor="middle" class="b muted">Accelerator Memory · 同一个 Global Step</text>
  <line x1="360" y1="158" x2="360" y2="190" stroke="#617086" stroke-width="4"/>
  <polygon points="350,190 370,190 360,206" fill="#617086"/>

  <rect x="80" y="220" width="560" height="230" rx="6" fill="#fff" stroke="#d96513" stroke-width="3"/>
  <circle cx="128" cy="268" r="26" fill="#d96513"/><text x="128" y="276" text-anchor="middle" class="b inv">1</text>
  <text x="174" y="278" class="h">快速快照</text>
  <text x="112" y="330" class="k">Host Memory / Local NVMe</text>
  <rect x="112" y="358" width="496" height="54" rx="4" fill="#fff0e5"/>
  <text x="360" y="393" text-anchor="middle" class="b">GPU 可以继续训练</text>
  <text x="360" y="438" text-anchor="middle" class="s">尚未证明：原 Node 失效后，另一台 Node 能读取</text>
  <line x1="360" y1="450" x2="360" y2="490" stroke="#617086" stroke-width="4"/>
  <polygon points="350,490 370,490 360,506" fill="#617086"/>

  <rect x="80" y="520" width="560" height="244" rx="6" fill="#fff" stroke="#198754" stroke-width="3"/>
  <circle cx="128" cy="568" r="26" fill="#198754"/><text x="128" y="576" text-anchor="middle" class="b inv">2</text>
  <text x="174" y="578" class="h">共享高性能存储</text>
  <text x="112" y="630" class="k">Shared HPS</text>
  <text x="112" y="670" class="s">Shard · Manifest · Checksum · Atomic Commit</text>
  <rect x="112" y="696" width="496" height="54" rx="4" fill="#e6f4ec"/>
  <text x="360" y="731" text-anchor="middle" class="b">Recovery Point · 另一台 Node 可读</text>
  <line x1="360" y1="764" x2="360" y2="804" stroke="#617086" stroke-width="4"/>
  <polygon points="350,804 370,804 360,820" fill="#617086"/>

  <rect x="80" y="834" width="560" height="230" rx="6" fill="#fff" stroke="#2774c5" stroke-width="3"/>
  <circle cx="128" cy="882" r="26" fill="#2774c5"/><text x="128" y="890" text-anchor="middle" class="b inv">3</text>
  <text x="174" y="892" class="h">保留副本</text>
  <text x="112" y="944" class="k">Object Storage / Archive</text>
  <rect x="112" y="972" width="496" height="54" rx="4" fill="#e9f2fc"/>
  <text x="360" y="1007" text-anchor="middle" class="b">脱离 Shared HPS 的系统 / 站点故障域</text>
  <text x="360" y="1052" text-anchor="middle" class="s">独立 Protection Domain 中的长期恢复与 Retention</text>

  <rect x="48" y="1120" width="624" height="250" rx="6" fill="#fff" stroke="#aeb9c8" stroke-width="2"/>
  <text x="360" y="1168" text-anchor="middle" class="section">Async Checkpoint 改变的是暂停位置</text>
  <rect x="76" y="1204" width="244" height="116" rx="5" fill="#fff0e5"/>
  <text x="198" y="1248" text-anchor="middle" class="b">GPU Resume</text>
  <text x="198" y="1286" text-anchor="middle" class="s">Stage 1 即可发生</text>
  <text x="360" y="1270" text-anchor="middle" class="h">≠</text>
  <rect x="400" y="1204" width="244" height="116" rx="5" fill="#e6f4ec"/>
  <text x="522" y="1248" text-anchor="middle" class="b">Recoverable</text>
  <text x="522" y="1286" text-anchor="middle" class="s">至少要越过 Stage 2</text>
  <text x="360" y="1352" text-anchor="middle" class="s">长期 Drain Rate 必须追上 Checkpoint 产生速度</text>
  <text x="360" y="1422" text-anchor="middle" class="s">状态边界：Node / Rack / Shared HPS 故障后还能否恢复</text>
</svg>
