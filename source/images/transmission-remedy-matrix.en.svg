<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">Which remedy fits each transmission constraint?</title><desc id="desc">A matrix matches transmission constraints to the remedy they support and the limit they cannot cross.</desc><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}.compact{font-size:17px}.body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}.number{font-size:38px;font-weight:780}.metric{font-size:28px;font-weight:760}.node{font-size:12px;font-weight:760}.inverse{fill:#ffffff}</style><rect width="1600" height="850" fill="#f7f9fc"/><text x="800" y="58" class="title" text-anchor="middle">Which remedy fits each transmission constraint?</text><text x="78" y="120" class="small" text-anchor="start">BINDING CONSTRAINT</text><text x="368" y="120" class="small" text-anchor="start">WHAT REVEALS IT</text><text x="738" y="120" class="small" text-anchor="start">FIRST REMEDY</text><text x="1098" y="120" class="small" text-anchor="start">WHAT IT CANNOT DO</text><rect x="60" y="145" width="1480" height="92" rx="6" fill="#edf1f5" stroke="#d8e0e9" stroke-width="1"/><text x="78" y="200" class="head" text-anchor="start" style="fill:#172033">Static thermal rating</text><text x="368" y="200" class="body" text-anchor="start">weather-dependent headroom</text><text x="738" y="200" class="head" text-anchor="start" style="fill:#2f6fab">DLR + sensors</text><text x="1098" y="200" class="body" text-anchor="start">firm capacity in every hour</text><rect x="60" y="261" width="1480" height="92" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="1"/><text x="78" y="316" class="head" text-anchor="start" style="fill:#172033">Poor flow distribution</text><text x="368" y="316" class="body" text-anchor="start">parallel paths have spare room</text><text x="738" y="316" class="head" text-anchor="start" style="fill:#2f6fab">topology + flow control</text><text x="1098" y="316" class="body" text-anchor="start">create a new corridor</text><rect x="60" y="377" width="1480" height="92" rx="6" fill="#edf1f5" stroke="#d8e0e9" stroke-width="1"/><text x="78" y="432" class="head" text-anchor="start" style="fill:#172033">Conductor rating</text><text x="368" y="432" class="body" text-anchor="start">towers and ROW remain usable</text><text x="738" y="432" class="head" text-anchor="start" style="fill:#2f6fab">advanced reconductoring</text><text x="1098" y="432" class="body" text-anchor="start">remove station bottlenecks</text><rect x="60" y="493" width="1480" height="92" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="1"/><text x="78" y="548" class="head" text-anchor="start" style="fill:#172033">Voltage / reactive power</text><text x="368" y="548" class="body" text-anchor="start">post-contingency voltage fails</text><text x="738" y="548" class="head" text-anchor="start" style="fill:#2f6fab">STATCOM + capacitors</text><text x="1098" y="548" class="body" text-anchor="start">add regional transfer path</text><rect x="60" y="609" width="1480" height="92" rx="6" fill="#fdebed" stroke="#cf3f4f" stroke-width="2"/><text x="78" y="664" class="head" text-anchor="start" style="fill:#cf3f4f">Regional transfer limit</text><text x="368" y="664" class="body" text-anchor="start">all local fixes remain insufficient</text><text x="738" y="664" class="head" text-anchor="start" style="fill:#cf3f4f">new 345 / 765 kV network</text><text x="1098" y="664" class="body" text-anchor="start">avoid siting and ROW</text><rect x="170" y="750" width="1260" height="62" rx="6" fill="#19243a" stroke="#19243a" stroke-width="0"/><text x="800" y="789" class="head inverse" text-anchor="middle">GETs can expose hidden headroom. They cannot manufacture a missing regional path.</text></svg>