<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent context growth across turns</title><desc id="desc">Static prefix, user goal, observations, and intermediate state grow across turns. Prompt cache reuses a stable exact prefix, while compaction shortens context and may reset reuse.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750}.body{font-size:15px;fill:#52647a}.small{font-size:14px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="58" class="title">Every Turn Must Carry Enough State to Continue Acting</text>
  <text x="190" y="130" class="head" text-anchor="middle">Turn 1</text><text x="550" y="130" class="head" text-anchor="middle">Turn 2</text><text x="910" y="130" class="head" text-anchor="middle">Turn 3</text><text x="1270" y="130" class="head" text-anchor="middle">After Compaction</text>
  <rect x="70" y="170" width="240" height="100" fill="#64748b"/><text x="190" y="214" class="head inv" text-anchor="middle">Static Prefix</text><text x="190" y="244" class="small inv" text-anchor="middle">Instructions · Tools</text><rect x="70" y="270" width="240" height="70" fill="#2f6fab"/><text x="190" y="313" class="body inv" text-anchor="middle">User Goal</text>
  <rect x="430" y="170" width="240" height="100" fill="#64748b"/><text x="550" y="214" class="head inv" text-anchor="middle">Cached Prefix</text><text x="550" y="244" class="small inv" text-anchor="middle">Exact Match</text><rect x="430" y="270" width="240" height="70" fill="#2f6fab"/><text x="550" y="313" class="body inv" text-anchor="middle">User Goal</text><rect x="430" y="340" width="240" height="115" fill="#167d73"/><text x="550" y="390" class="head inv" text-anchor="middle">Observation 1</text><text x="550" y="422" class="small inv" text-anchor="middle">Log · Code · Result</text>
  <rect x="790" y="170" width="240" height="100" fill="#64748b"/><text x="910" y="214" class="head inv" text-anchor="middle">Cached Prefix</text><text x="910" y="244" class="small inv" text-anchor="middle">Exact Match</text><rect x="790" y="270" width="240" height="70" fill="#2f6fab"/><text x="910" y="313" class="body inv" text-anchor="middle">User Goal</text><rect x="790" y="340" width="240" height="115" fill="#167d73"/><text x="910" y="390" class="head inv" text-anchor="middle">Observation 1</text><text x="910" y="422" class="small inv" text-anchor="middle">Previous Tool Result</text><rect x="790" y="455" width="240" height="140" fill="#7653a6"/><text x="910" y="515" class="head inv" text-anchor="middle">Observation 2</text><text x="910" y="547" class="small inv" text-anchor="middle">Test · Artifact · State</text>
  <rect x="1150" y="170" width="240" height="100" fill="#64748b"/><text x="1270" y="214" class="head inv" text-anchor="middle">New Prefix</text><text x="1270" y="244" class="small inv" text-anchor="middle">Cache May Reset</text><rect x="1150" y="270" width="240" height="70" fill="#2f6fab"/><text x="1270" y="313" class="body inv" text-anchor="middle">User Goal</text><rect x="1150" y="340" width="240" height="150" fill="#c85a16"/><text x="1270" y="402" class="head inv" text-anchor="middle">Compacted State</text><text x="1270" y="434" class="small inv" text-anchor="middle">Summary · Selected Evidence</text>
  <path d="M310 255H408" stroke="#52647a" stroke-width="4"/><polygon points="408,243 408,267 430,255" fill="#52647a"/><path d="M670 330H768" stroke="#52647a" stroke-width="4"/><polygon points="768,318 768,342 790,330" fill="#52647a"/><path d="M1030 382H1128" stroke="#52647a" stroke-width="4"/><polygon points="1128,370 1128,394 1150,382" fill="#52647a"/>
  <rect x="175" y="680" width="1250" height="70" rx="6" fill="#172033"/><text x="800" y="709" class="head inv" text-anchor="middle">Input Cost / Turn = Cached Prefix + New Context + Current Observation</text><text x="800" y="737" class="small inv" text-anchor="middle">Compaction saves tokens but may drop details or change the reusable prefix</text>
  <rect x="300" y="790" width="1000" height="55" rx="6" fill="#fff" stroke="#d5dde7" stroke-width="2"/><text x="800" y="825" class="body" text-anchor="middle">Track Cache Hit, Context Size, Compaction Event, and Task Success Together</text>
</svg>
