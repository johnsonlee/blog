<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Power reaches the data center through a delivery boundary</title><desc id="desc">Power, protection, telemetry, and ownership converge at the delivery point.</desc><rect width="1440" height="900" fill="#F7F9FC"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style><text x="55" y="75" fill="#5E6B7E" font-size="22" font-weight="800" text-anchor="start"><tspan x="55" dy="0">Power path</tspan></text><rect x="55" y="105" width="230" height="130" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="170" y="160" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">Transmission</tspan></text><text x="170" y="217" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="170" dy="0">Grid side</tspan></text><line x1="285" y1="170" x2="316" y2="170" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="330,170 316,163 316,177" fill="#26364D"/><rect x="330" y="105" width="230" height="130" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="445" y="146" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">Interconnection</tspan><tspan x="445" dy="30">substation</tspan></text><text x="445" y="195" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="445" dy="0">Protection · switching</tspan><tspan x="445" dy="22">· SCADA</tspan></text><line x1="560" y1="170" x2="591" y2="170" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="605,170 591,163 591,177" fill="#26364D"/><rect x="605" y="105" width="230" height="130" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="720" y="146" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">Delivery point</tspan><tspan x="720" dy="30">/ meter</tspan></text><text x="720" y="195" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="720" dy="0">Ownership &amp;</tspan><tspan x="720" dy="22">settlement boundary</tspan></text><line x1="835" y1="170" x2="866" y2="170" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="880,170 866,163 866,177" fill="#26364D"/><rect x="880" y="105" width="230" height="130" rx="7" fill="#FFF0CC" stroke="#C77800" stroke-width="2"/><text x="995" y="146" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">Customer</tspan><tspan x="995" dy="30">substation</tspan></text><text x="995" y="195" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="995" dy="0">Receive · step down</tspan><tspan x="995" dy="22">· distribute</tspan></text><line x1="1110" y1="170" x2="1141" y2="170" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="1155,170 1141,163 1141,177" fill="#26364D"/><rect x="1155" y="105" width="230" height="130" rx="7" fill="#DDF4EC" stroke="#0F8A6A" stroke-width="2"/><text x="1270" y="160" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">Data halls</tspan></text><text x="1270" y="195" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="1270" dy="0">Commissioning load</tspan><tspan x="1270" dy="22">→ IT load</tspan></text><line x1="858" y1="70" x2="858" y2="690" stroke="#C93E4F" stroke-width="3" stroke-dasharray="9 9"/><text x="838" y="285" fill="#C93E4F" font-size="20" font-weight="800" text-anchor="end"><tspan x="838" dy="0">Utility</tspan></text><text x="878" y="285" fill="#C93E4F" font-size="20" font-weight="800" text-anchor="start"><tspan x="878" dy="0">Customer / campus</tspan></text><text x="55" y="355" fill="#5E6B7E" font-size="22" font-weight="800" text-anchor="start"><tspan x="55" dy="0">Protection and data path</tspan></text><rect x="55" y="395" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="170" y="450.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">Relay protection</tspan></text><line x1="285" y1="442" x2="316" y2="442" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="330,442 316,435 316,449" fill="#26364D"/><rect x="330" y="395" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="445" y="450.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">Breaker status</tspan></text><line x1="560" y1="442" x2="591" y2="442" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="605,442 591,435 591,449" fill="#26364D"/><rect x="605" y="395" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="720" y="450.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">Voltage / current / MW</tspan></text><line x1="835" y1="442" x2="866" y2="442" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="880,442 866,435 866,449" fill="#26364D"/><rect x="880" y="395" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="995" y="450.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">Metering &amp; settlement</tspan></text><line x1="1110" y1="442" x2="1141" y2="442" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="1155,442 1141,435 1141,449" fill="#26364D"/><rect x="1155" y="395" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1270" y="450.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">BMS / EPMS</tspan></text><rect x="55" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="170" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">Dispatch order</tspan></text><line x1="285" y1="592" x2="316" y2="592" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/><polygon points="330,592 316,585 316,599" fill="#0E7490"/><rect x="330" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="445" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">Remote switching</tspan></text><line x1="560" y1="592" x2="591" y2="592" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/><polygon points="605,592 591,585 591,599" fill="#0E7490"/><rect x="605" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="720" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">Real-time telemetry</tspan></text><line x1="835" y1="592" x2="866" y2="592" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/><polygon points="880,592 866,585 866,599" fill="#0E7490"/><rect x="880" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="995" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">Load ceiling</tspan></text><line x1="1110" y1="592" x2="1141" y2="592" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/><polygon points="1155,592 1141,585 1141,599" fill="#0E7490"/><rect x="1155" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="1270" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">Ramp &amp; alarms</tspan></text><rect x="150" y="710" width="1140" height="90" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="720" y="749" fill="#172033" font-size="20" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">Live line ≠ energized campus ≠ full capacity available</tspan><tspan x="720" dy="30">Both sides must clear technical, commercial, and dispatch conditions</tspan></text></svg>
