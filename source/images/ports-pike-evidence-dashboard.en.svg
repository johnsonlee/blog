<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">PORTS-Pike Evidence Dashboard</title><desc id="desc">Track the next state-changing event across land and permits, power, facility, cluster, and production, while separating confirming evidence from downgrade signals.</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:28px;font-weight:760;text-anchor:middle}.head{font-size:16px;font-weight:750}.body{font-size:13px;fill:#52647a}.small{font-size:12px;fill:#607089}.good{fill:#24864a}.bad{fill:#c85a16}.inv{fill:#fff}</style>
  <rect width="1600" height="1050" fill="#f7f9fc"/><text x="800" y="58" class="title">The Next Announcement Matters Only If It Changes a Gate</text>
  <rect x="45" y="105" width="1510" height="825" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/>
  <rect x="75" y="145" width="1450" height="55" fill="#172033"/><text x="100" y="179" class="head inv">Layer</text><text x="360" y="179" class="head inv">Next Verifiable Event</text><text x="900" y="179" class="head inv">State Improves</text><text x="1240" y="179" class="head inv">Downgrade Signal</text>
  <rect x="75" y="200" width="1450" height="130" fill="#eef3fb"/><text x="100" y="250" class="head">Land / Permit</text><text x="360" y="238" class="body">FAST-41 Authorization</text><text x="360" y="268" class="body">Batch 1 Assessment → Executable Design</text><circle cx="875" cy="246" r="8" class="good"/><text x="900" y="251" class="body">Permits Close on Schedule</text><circle cx="1215" cy="246" r="8" class="bad"/><text x="1240" y="251" class="body">Milestones Keep Moving Right</text><text x="900" y="286" class="small">The Building Can Enter Full Construction</text><text x="1240" y="286" class="small">Site Scope or Conditions Remain Unclear</text>
  <rect x="75" y="330" width="1450" height="145" fill="#fff7e6"/><text x="100" y="385" class="head">Power</text><text x="360" y="365" class="body">AEP Service Plan · Substation Energization</text><text x="360" y="395" class="body">Generation NTP · 765kV Route / ROW / Build</text><circle cx="875" cy="375" r="8" class="good"/><text x="900" y="380" class="body">Binding Works and Equipment Orders</text><circle cx="1215" cy="375" r="8" class="bad"/><text x="1240" y="380" class="body">Only the 10 GW Target Is Repeated</text><text x="900" y="419" class="small">Permanent Power Available by Phase</text><text x="1240" y="419" class="small">No Binding Generation / Transmission Build</text>
  <rect x="75" y="475" width="1450" height="145" fill="#eef3fb"/><text x="100" y="530" class="head">Facility</text><text x="360" y="510" class="body">Long-lead PO · FAT · Site Delivery</text><text x="360" y="540" class="body">Dry-in · MEP Complete · IST · RFS</text><circle cx="875" cy="520" r="8" class="good"/><text x="900" y="525" class="body">First MW Available for Lease</text><circle cx="1215" cy="520" r="8" class="bad"/><text x="1240" y="525" class="body">The 800 MW Date Moves Right</text><text x="900" y="564" class="small">Commissioning Report Is Verifiable</text><text x="1240" y="564" class="small">Lease and Construction Status Lack a Matching Phase</text>
  <rect x="75" y="620" width="1450" height="145" fill="#fff7e6"/><text x="100" y="675" class="head">Cluster</text><text x="360" y="655" class="body">NVIDIA Shipment · Rack Energization</text><text x="360" y="685" class="body">Fabric / Storage Pass · Healthy MW</text><circle cx="875" cy="665" r="8" class="good"/><text x="900" y="670" class="body">Cluster Acceptance</text><circle cx="1215" cy="665" r="8" class="bad"/><text x="1240" y="670" class="body">Facility Rent Starts While the Cluster Waits</text><text x="900" y="709" class="small">Yield and Benchmark Pass</text><text x="1240" y="709" class="small">Deployment Gap Widens</text>
  <rect x="75" y="765" width="1450" height="130" fill="#eef3fb"/><text x="100" y="815" class="head">Production</text><text x="360" y="803" class="body">Production Handoff · Workload Ramp</text><text x="360" y="833" class="body">Training / Inference / Agent SLO</text><circle cx="875" cy="811" r="8" class="good"/><text x="900" y="816" class="body">Billable Workload Grows</text><circle cx="1215" cy="811" r="8" class="bad"/><text x="1240" y="816" class="body">Available MW Remains Idle</text><text x="900" y="851" class="small">Revenue Keeps Pace with Lease Ramp</text><text x="1240" y="851" class="small">Demand or Delivery Network Is Not Ready</text>
  <rect x="175" y="955" width="1250" height="62" rx="6" fill="#172033"/><text x="800" y="994" class="head inv" text-anchor="middle">Repeating 8 GW Adds No Evidence; a Phase Crossing the Next Gate Does</text>
</svg>
