<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Regional inference routing constraints</title><desc id="desc">区域推理路由先按数据驻留和模型可用性筛选，再在网络距离、队列和容量之间选择；最近、最空和合规往往不是同一 Region。</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750;text-anchor:middle}.body{font-size:15px;fill:#52647a;text-anchor:middle}.small{font-size:13px;fill:#607089;text-anchor:middle}.inv{fill:#fff}</style>
  <rect width="1600" height="880" fill="#f7f9fc"/><text x="800" y="58" class="title">最近、最空、合规，往往不是同一个 Region</text>
  <rect x="65" y="130" width="420" height="220" rx="7" fill="#fff" stroke="#2f6fab" stroke-width="2"/><text x="275" y="178" class="head">网络距离</text><text x="275" y="220" class="body">用户 → Edge → Region RTT</text><text x="275" y="255" class="body">首尔用户更接近 Seoul / Tokyo</text><rect x="125" y="285" width="300" height="42" rx="5" fill="#2f6fab"/><text x="275" y="312" class="body inv">目标：低 TTFT</text>
  <rect x="590" y="130" width="420" height="220" rx="7" fill="#fff" stroke="#167d73" stroke-width="2"/><text x="800" y="178" class="head">可用 Capacity</text><text x="800" y="220" class="body">模型已加载 · 排队 · KV · 余量</text><text x="800" y="255" class="body">最近 Region 可能已满</text><rect x="650" y="285" width="300" height="42" rx="5" fill="#167d73"/><text x="800" y="312" class="body inv">目标：高吞吐</text>
  <rect x="1115" y="130" width="420" height="220" rx="7" fill="#fff" stroke="#c85a16" stroke-width="2"/><text x="1325" y="178" class="head">处理边界</text><text x="1325" y="220" class="body">数据驻留 · IAM · 客户策略</text><text x="1325" y="255" class="body">不合规 Region 不能进入候选集</text><rect x="1175" y="285" width="300" height="42" rx="5" fill="#c85a16"/><text x="1325" y="312" class="body inv">目标：通过策略</text>
  <path d="M275 350V435H800" fill="none" stroke="#52647a" stroke-width="4"/><path d="M800 350V435" fill="none" stroke="#52647a" stroke-width="4"/><path d="M1325 350V435H800" fill="none" stroke="#52647a" stroke-width="4"/><polygon points="788,435 812,435 800,457" fill="#52647a"/>
  <rect x="560" y="457" width="480" height="120" rx="7" fill="#7653a6"/><text x="800" y="500" class="head inv">可选 Region 集合</text><text x="800" y="534" class="body inv">模型 × 地理位置 × Tier × 策略</text><text x="800" y="563" class="body inv">先过滤，再优化路由</text>
  <line x1="800" y1="577" x2="800" y2="625" stroke="#52647a" stroke-width="4"/><polygon points="788,625 812,625 800,647" fill="#52647a"/>
  <rect x="380" y="647" width="840" height="105" rx="7" fill="#24864a"/><text x="800" y="689" class="head inv">选中的 Region</text><text x="800" y="723" class="body inv">在允许集合内，最小化网络 + 排队 + 预填充 + 故障风险</text>
  <rect x="220" y="800" width="1160" height="46" rx="6" fill="#172033"/><text x="800" y="829" class="body inv">全球总 MW 不能替代“此刻可路由的模型 × Region × SLO Capacity”</text>
</svg>
