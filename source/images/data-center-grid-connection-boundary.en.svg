<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">How Susquehanna moved from direct connection to grid delivery</title><desc id="desc">Compares 300 MW BTM, the rejected 480 MW amendment, and the 1,920 MW FTM structure.</desc><rect width="1600" height="900" fill="#f5f7fb"/><style>.h{font:700 34px Arial,sans-serif;fill:#172033}.t{font:700 24px Arial,sans-serif;fill:#172033}.s{font:19px Arial,sans-serif;fill:#5d6f8d}.s[fill="#fff"]{fill:#dbe6f4}.w{font:700 21px Arial,sans-serif;fill:#fff}.ln{stroke:#566983;stroke-width:5}</style><text x="70" y="70" class="h">Capacity grew while the connection model returned to the grid</text><rect x="70" y="125" width="440" height="650" rx="8" fill="#fff" stroke="#16856f" stroke-width="3"/><rect x="580" y="125" width="440" height="650" rx="8" fill="#fff" stroke="#dc3348" stroke-width="3"/><rect x="1090" y="125" width="440" height="650" rx="8" fill="#fff" stroke="#2877b8" stroke-width="3"/><text x="290" y="180" text-anchor="middle" class="t">2024 · 300 MW BTM</text><text x="800" y="180" text-anchor="middle" class="t">2024 · 480 MW Amendment</text><text x="1310" y="180" text-anchor="middle" class="t">2026 · 1,920 MW FTM</text>
<g><rect x="130" y="240" width="320" height="90" rx="7" fill="#e8f3ef"/><text x="290" y="280" text-anchor="middle" class="t">Susquehanna</text><text x="290" y="310" text-anchor="middle" class="s">Nuclear generation</text><line x1="290" y1="330" x2="290" y2="395" class="ln"/><polygon points="278,395 290,425 302,395" fill="#566983"/><rect x="130" y="425" width="320" height="90" rx="7" fill="#fff3dc"/><text x="290" y="465" text-anchor="middle" class="t">AWS Campus</text><text x="290" y="495" text-anchor="middle" class="s">Direct-connected load</text><rect x="130" y="575" width="320" height="82" rx="7" fill="#16856f"/><text x="290" y="610" text-anchor="middle" class="w">Operating</text><text x="290" y="640" text-anchor="middle" class="s" fill="#fff">Fault boundary still touched PJM</text></g>
<g><rect x="640" y="240" width="320" height="90" rx="7" fill="#e8f3ef"/><text x="800" y="280" text-anchor="middle" class="t">Susquehanna</text><text x="800" y="310" text-anchor="middle" class="s">+180 MW proposed</text><line x1="800" y1="330" x2="800" y2="395" class="ln"/><polygon points="788,395 800,425 812,395" fill="#566983"/><rect x="640" y="425" width="320" height="90" rx="7" fill="#fff3dc"/><text x="800" y="465" text-anchor="middle" class="t">AWS Campus</text><text x="800" y="495" text-anchor="middle" class="s">Non-conforming ISA</text><rect x="640" y="575" width="320" height="82" rx="7" fill="#dc3348"/><text x="800" y="610" text-anchor="middle" class="w">FERC Rejected</text><text x="800" y="640" text-anchor="middle" class="s" fill="#fff">Tariff and responsibility unproven</text></g>
<g><rect x="1140" y="220" width="340" height="78" rx="7" fill="#e8f3ef"/><text x="1310" y="254" text-anchor="middle" class="t">Susquehanna → PJM</text><text x="1310" y="282" text-anchor="middle" class="s">Generation injection</text><line x1="1310" y1="298" x2="1310" y2="345" class="ln"/><polygon points="1298,345 1310,375 1322,345" fill="#566983"/><rect x="1140" y="375" width="340" height="78" rx="7" fill="#eaf0f8"/><text x="1310" y="409" text-anchor="middle" class="t">PJM + PPL</text><text x="1310" y="437" text-anchor="middle" class="s">Transmission · delivery</text><line x1="1310" y1="453" x2="1310" y2="500" class="ln"/><polygon points="1298,500 1310,530 1322,500" fill="#566983"/><rect x="1140" y="530" width="340" height="78" rx="7" fill="#fff3dc"/><text x="1310" y="564" text-anchor="middle" class="t">AWS Campus</text><text x="1310" y="592" text-anchor="middle" class="s">Grid load · phased ramp</text><rect x="1140" y="650" width="340" height="82" rx="7" fill="#2877b8"/><text x="1310" y="685" text-anchor="middle" class="w">Standard boundary · multi-site</text><text x="1310" y="715" text-anchor="middle" class="s" fill="#fff">Full volume by 2032</text></g><rect x="245" y="805" width="1110" height="55" rx="6" fill="#172033"/><text x="800" y="840" text-anchor="middle" class="w">The PPA binds buyer and seller; grid connection binds path, fault duty, and service boundary</text></svg>
