<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Susquehanna 机组故障怎样越过直连边界</title>
  <desc id="desc">正常状态与 2023 年 11 月机组故障状态对比，展示直连数据中心仍可能从 PJM 电网取电。</desc>
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <style>.h{font:700 34px Arial,sans-serif;fill:#172033}.t{font:700 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#5d6f8d}.s[fill="#cdd7e7"]{fill:#cdd7e7}.w{font:700 22px Arial,sans-serif;fill:#fff}.l{stroke:#65758e;stroke-width:5}.p{stroke:#d97706;stroke-width:7}.g{stroke:#16856f;stroke-width:7}.r{stroke:#dc3348;stroke-width:7}</style>
  <text x="80" y="76" class="h">Direct-connect 只在设计边界内成立</text>
  <rect x="70" y="130" width="1460" height="285" rx="8" fill="#fff" stroke="#d7deea" stroke-width="2"/>
  <rect x="70" y="470" width="1460" height="330" rx="8" fill="#fff" stroke="#f1a7b1" stroke-width="2"/>
  <rect x="95" y="153" width="160" height="46" rx="5" fill="#16856f"/><text x="175" y="184" text-anchor="middle" class="w">正常运行</text>
  <rect x="95" y="493" width="230" height="46" rx="5" fill="#dc3348"/><text x="210" y="524" text-anchor="middle" class="w">2023.11 机组跳闸</text>
  <g><rect x="150" y="245" width="260" height="105" rx="7" fill="#e8f3ef" stroke="#16856f" stroke-width="3"/><text x="280" y="290" text-anchor="middle" class="t">Susquehanna</text><text x="280" y="323" text-anchor="middle" class="s">两台核电机组</text></g>
  <g><rect x="670" y="245" width="300" height="105" rx="7" fill="#fff3dc" stroke="#d97706" stroke-width="3"/><text x="820" y="290" text-anchor="middle" class="t">AWS Campus</text><text x="820" y="323" text-anchor="middle" class="s">300MW BTM Load</text></g>
  <g><rect x="1190" y="245" width="250" height="105" rx="7" fill="#eaf0f8" stroke="#65758e" stroke-width="3"/><text x="1315" y="290" text-anchor="middle" class="t">PJM Grid</text><text x="1315" y="323" text-anchor="middle" class="s">备用边界</text></g>
  <line x1="410" y1="298" x2="640" y2="298" class="g"/><polygon points="640,286 670,298 640,310" fill="#16856f"/><line x1="970" y1="298" x2="1140" y2="298" class="l"/><rect x="1085" y="274" width="38" height="48" fill="#fff" stroke="#65758e" stroke-width="4"/><text x="1104" y="365" text-anchor="middle" class="s">Isolation Breaker</text>
  <g><rect x="150" y="595" width="260" height="105" rx="7" fill="#fdebed" stroke="#dc3348" stroke-width="3"/><text x="280" y="640" text-anchor="middle" class="t">Unit Trip</text><text x="280" y="673" text-anchor="middle" class="s">Generation Loss</text></g>
  <g><rect x="670" y="595" width="300" height="105" rx="7" fill="#fff3dc" stroke="#d97706" stroke-width="3"/><text x="820" y="640" text-anchor="middle" class="t">AWS Campus</text><text x="820" y="673" text-anchor="middle" class="s">Load 没有及时隔离</text></g>
  <g><rect x="1190" y="595" width="250" height="105" rx="7" fill="#fdebed" stroke="#dc3348" stroke-width="3"/><text x="1315" y="640" text-anchor="middle" class="t">PJM Grid</text><text x="1315" y="673" text-anchor="middle" class="s">供电数小时</text></g>
  <line x1="410" y1="648" x2="640" y2="648" class="r" stroke-dasharray="14 12"/><polygon points="640,636 670,648 640,660" fill="#dc3348"/><line x1="1190" y1="648" x2="1000" y2="648" class="r"/><polygon points="1000,636 970,648 1000,660" fill="#dc3348"/>
  <rect x="420" y="742" width="760" height="78" rx="7" fill="#172033"/><text x="800" y="777" text-anchor="middle" class="w">Normal 不取电 ≠ Contingency 不使用电网</text><text x="800" y="806" text-anchor="middle" class="s" fill="#cdd7e7">保护、计量、备用服务与费用必须写回接入边界</text>
</svg>
