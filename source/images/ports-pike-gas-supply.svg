<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title desc">
  <title id="title">9.2GW 天然气发电背后需要多大的燃料流量？</title>
  <desc id="desc">一笔可复算的敏感性把满负荷发电换算成每日天然气需求，再展示对应的管道依赖。</desc>
  <style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}
    .title{font-size:31px;font-weight:760}.section{font-size:22px;font-weight:740}.head{font-size:19px;font-weight:730}
    .body{font-size:17px;font-weight:540}.small{font-size:14px;font-weight:520;fill:#607089}
    .number{font-size:38px;font-weight:780}.table{font-size:15px;font-weight:620}.inverse{fill:#fff}
  </style>
  <rect width="1600" height="710" fill="#f7f9fc"/>
  <text x="800" y="60" class="title" text-anchor="middle" >9.2GW 天然气发电背后需要多大的燃料流量？</text><rect x="65" y="145" width="315" height="185" rx="6" fill="#fff0e5" stroke="#c85a16" stroke-width="2"/><text x="222.5" y="220" class="number" text-anchor="middle" >9.2GW</text><text x="222.5" y="275" class="body" text-anchor="middle" >连续满负荷</text><line x1="380" y1="238" x2="437" y2="238" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M437 230 L450 238 L437 246 Z" fill="#52647a"/><rect x="450" y="145" width="315" height="185" rx="6" fill="#fff7d8" stroke="#b88407" stroke-width="2"/><text x="607.5" y="220" class="number" text-anchor="middle" >220.8GWh/日</text><text x="607.5" y="275" class="body" text-anchor="middle" >9.2GW × 24h</text><line x1="765" y1="238" x2="822" y2="238" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M822 230 L835 238 L822 246 Z" fill="#52647a"/><rect x="835" y="145" width="315" height="185" rx="6" fill="#f3eefe" stroke="#7653a6" stroke-width="2"/><text x="992.5" y="220" class="number" text-anchor="middle" >1.67TBtu/日</text><text x="992.5" y="275" class="body" text-anchor="middle" >× 7,548 Btu/kWh</text><line x1="1150" y1="238" x2="1207" y2="238" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1207 230 L1220 238 L1207 246 Z" fill="#52647a"/><rect x="1220" y="145" width="315" height="185" rx="6" fill="#eaf2fb" stroke="#2f6fab" stroke-width="2"/><text x="1377.5" y="220" class="number" text-anchor="middle" >1.57Bcf/日</text><text x="1377.5" y="275" class="body" text-anchor="middle" >÷ 1,062 Btu/ft³</text><rect x="65" y="445" width="315" height="150" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="222.5" y="505" class="section" text-anchor="middle"><tspan x="222.5" dy="0">上游天然气</tspan><tspan x="222.5" dy="34">Supply</tspan></text><line x1="380" y1="520" x2="437" y2="520" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M437 512 L450 520 L437 528 Z" fill="#52647a"/><rect x="450" y="445" width="315" height="150" rx="6" fill="#fff0f0" stroke="#b84444" stroke-width="2"/><text x="607.5" y="505" class="section" text-anchor="middle"><tspan x="607.5" dy="0">新建州际</tspan><tspan x="607.5" dy="34">天然气管道</tspan></text><line x1="765" y1="520" x2="822" y2="520" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M822 512 L835 520 L822 528 Z" fill="#52647a"/><rect x="835" y="445" width="315" height="150" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="992.5" y="505" class="section" text-anchor="middle"><tspan x="992.5" dy="0">9.2GW 天然气</tspan><tspan x="992.5" dy="34">发电机组</tspan></text><line x1="1150" y1="520" x2="1207" y2="520" stroke="#52647a" stroke-width="4" stroke-linecap="butt"/><path d="M1207 512 L1220 520 L1207 528 Z" fill="#52647a"/><rect x="1220" y="445" width="315" height="150" rx="6" fill="#ffffff" stroke="#d8e0e9" stroke-width="2"/><text x="1377.5" y="505" class="section" text-anchor="middle"><tspan x="1377.5" dy="0">区域电网</tspan><tspan x="1377.5" dy="34">调度</tspan></text><text x="800" y="665" class="small" text-anchor="middle" >敏感性采用 EIA 2024 tested heat rate 与 2025 Ohio 天然气热值，不是项目燃料预测。</text>
</svg>
