<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Talen AWS PPA price-in scenarios</title><desc id="desc">Estimates present value using 2032 incremental free cash flow per share, a 10 percent discount rate, and three terminal multiples.</desc><rect width="1600" height="900" fill="#f5f7fb"/><style>.h{font:700 35px Arial,sans-serif;fill:#172033}.t{font:700 25px Arial,sans-serif;fill:#172033}.s{font:19px Arial,sans-serif;fill:#5d6f8d}.n{font:700 31px Arial,sans-serif;fill:#172033}.n[fill="#fff"]{fill:#fff}.s[fill="#bdc9db"]{fill:#bdc9db}.w{font:700 22px Arial,sans-serif;fill:#fff}</style><text x="800" y="70" text-anchor="middle" class="h">How much of the 1,920 MW AWS PPA is priced in?</text><rect x="70" y="125" width="430" height="650" rx="8" fill="#203653"/><text x="115" y="180" class="w">Inputs</text><text x="115" y="245" class="n" fill="#fff">$314.46</text><text x="115" y="278" class="s" fill="#bdc9db">TLN · August 21, 2026</text><line x1="115" y1="315" x2="455" y2="315" stroke="#71839d" stroke-width="2"/><text x="115" y="375" class="n" fill="#fff">$7.00–$8.25</text><text x="115" y="408" class="s" fill="#bdc9db">2032 PPA Adj FCF / share</text><line x1="115" y1="445" x2="455" y2="445" stroke="#71839d" stroke-width="2"/><text x="115" y="505" class="n" fill="#fff">10%</text><text x="115" y="538" class="s" fill="#bdc9db">Six-year discount rate</text><text x="115" y="625" class="s" fill="#bdc9db">Present value =</text><text x="115" y="656" class="s" fill="#bdc9db">2032 FCF × terminal multiple</text><text x="115" y="687" class="s" fill="#bdc9db">÷ 1.10⁶</text><text x="565" y="155" class="t">Terminal multiple</text><text x="910" y="155" class="t">PPA value / share</text><text x="1270" y="155" class="t">Share of price</text>
<g><rect x="550" y="190" width="980" height="150" rx="8" fill="#eaf0f8" stroke="#60738f" stroke-width="2"/><text x="610" y="250" class="n">10x</text><text x="910" y="250" class="n">$40–$47</text><text x="1270" y="250" class="n">13%–15%</text><text x="910" y="295" class="s">Low terminal scenario</text></g><g><rect x="550" y="375" width="980" height="150" rx="8" fill="#fff3dc" stroke="#d18b00" stroke-width="2"/><text x="610" y="435" class="n">15x</text><text x="910" y="435" class="n">$59–$70</text><text x="1270" y="435" class="n">19%–22%</text><text x="910" y="480" class="s">Mid terminal scenario</text></g><g><rect x="550" y="560" width="980" height="150" rx="8" fill="#e5f3ef" stroke="#16856f" stroke-width="2"/><text x="610" y="620" class="n">20x</text><text x="910" y="620" class="n">$79–$93</text><text x="1270" y="620" class="n">25%–30%</text><text x="910" y="665" class="s">High terminal scenario</text></g><rect x="215" y="805" width="1170" height="55" rx="6" fill="#172033"/><text x="800" y="840" text-anchor="middle" class="w">Not a price target: ramp, FCF, multiple, and discount rate all move the range</text></svg>
