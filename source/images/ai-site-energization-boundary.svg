<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">电到数据中心，要先穿过交付边界</title><desc id="desc">电力、保护、遥测和所有权在交付点汇合。</desc><rect width="1440" height="900" fill="#F7F9FC"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style><text x="55" y="75" fill="#5E6B7E" font-size="22" font-weight="800" text-anchor="start"><tspan x="55" dy="0">电能路径</tspan></text><rect x="55" y="105" width="230" height="130" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="170" y="160" fill="#172033" font-size="20" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">输电系统</tspan></text><text x="170" y="217" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="170" dy="0">电网侧</tspan></text><line x1="285" y1="170" x2="316" y2="170" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="330,170 316,163 316,177" fill="#26364D"/><rect x="330" y="105" width="230" height="130" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="445" y="160" fill="#172033" font-size="20" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">并网变电站</tspan></text><text x="445" y="217" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="445" dy="0">保护 · 开关 · SCADA</tspan></text><line x1="560" y1="170" x2="591" y2="170" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="605,170 591,163 591,177" fill="#26364D"/><rect x="605" y="105" width="230" height="130" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="720" y="160" fill="#172033" font-size="20" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">交付点 / 计量</tspan></text><text x="720" y="217" fill="#5E6B7E" font-size="15" font-weight="550" text-anchor="middle"><tspan x="720" dy="0">所有权与结算边界</tspan></text><line x1="835" y1="170" x2="866