dle"><tspan x="445" dy="0">远方分合闸</tspan></text><line x1="560" y1="592" x2="591" y2="592" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/><polygon points="605,592 591,585 591,599" fill="#0E7490"/><rect x="605" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="720" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">实时遥测</tspan></text><line x1="835" y1="592" x2="866" y2="592" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/><polygon points="880,592 866,585 866,599" fill="#0E7490"/><rect x="880" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="995" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">负荷上限</tspan></text><line x1="1110" y1="592" x2="1141" y2="592" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/><polygon points="1155,592 1141,585 1141,599" fill="#0E7490"/><rect x="1155" y="545" width="230" height="95" rx="7" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/><text x="1270" y="600.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">升载与告警</tspan></text><rect x="150" y="710" width="1140" height="90" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="720" y="749" fill="#172033" font-size="22" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">线路有电 ≠ 园区可受电 ≠ 全容量可用</tspan><tspan x="720" dy="30">交付点两侧必须同时满足技术、商业和调度条件</tspan></text></svg>
