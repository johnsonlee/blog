<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">PORTS-Pike 的热量怎样从 GPU Rack 走到室外空气</title>
  <desc id="desc">首批 800MW 的电气边界尚未披露。实际机架热量按未知液冷捕获率分成液冷和风冷两条路径，穿过尚未公开的园区冷却拓扑，最终由闭环风冷系统排向室外空气。水返回闭环，热量单向离开园区。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #172033; letter-spacing: 0; }
      .white { fill: #ffffff; }
      .light { fill: #d7e2ef; }
      .blue { fill: #3973a8; }
      .muted { fill: #52647a; }
      .small { font-size: 20px; }
      .body { font-size: 23px; }
      .label { font-size: 26px; font-weight: 700; }
      .value { font-size: 32px; font-weight: 760; }
      .heat { stroke: #c85a16; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .water { stroke: #3973a8; stroke-width: 4; fill: none; stroke-dasharray: 12 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="720" height="1080" fill="#f5f7fa"/>

  <rect x="40" y="34" width="640" height="116" rx="6" fill="#172033"/>
  <text x="360" y="78" text-anchor="middle" class="white label">PORTS-Pike 已披露</text>
  <text x="360" y="113" text-anchor="middle" class="white body">首批 800MW · Electrical Boundary 未披露</text>
  <text x="360" y="140" text-anchor="middle" class="light small">Closed-loop · Air-cooled · No Cooling Tower</text>

  <rect x="170" y="190" width="380" height="112" rx="6" fill="#fff3e8" stroke="#c85a16" stroke-width="3"/>
  <text x="360" y="235" text-anchor="middle" class="label">Actual Rack Heat</text>
  <text x="360" y="274" text-anchor="middle" class="value">Q</text>
  <text x="360" y="296" text-anchor="middle" class="muted small">只有 Actual IT Load 才能换成热负荷</text>

  <path d="M360 302 V338 H190 V368 M360 338 H530 V368" class="heat"/>
  <polygon points="176,368 204,368 190,390" fill="#c85a16"/>
  <polygon points="516,368 544,368 530,390" fill="#c85a16"/>

  <rect x="45" y="390" width="290" height="190" rx="6" fill="#e8f1fa" stroke="#3973a8" stroke-width="3"/>
  <text x="190" y="432" text-anchor="middle" class="label">液冷路径 · rQ</text>
  <text x="190" y="472" text-anchor="middle" class="body">CPU / GPU</text>
  <text x="190" y="507" text-anchor="middle" class="body">Cold Plate · TCS</text>
  <text x="190" y="542" text-anchor="middle" class="body">CDU</text>
  <text x="190" y="570" text-anchor="middle" class="muted small">r = Liquid Capture Ratio</text>

  <rect x="385" y="390" width="290" height="190" rx="6" fill="#fff6d8" stroke="#b98100" stroke-width="3"/>
  <text x="530" y="432" text-anchor="middle" class="label">风冷路径 · (1−r)Q</text>
  <text x="530" y="472" text-anchor="middle" class="body">Network / Storage</text>
  <text x="530" y="507" text-anchor="middle" class="body">Power Shelf · Fan</text>
  <text x="530" y="542" text-anchor="middle" class="body">Hot Aisle · CRAH</text>
  <text x="530" y="570" text-anchor="middle" class="muted small">两条路径必须同时成立</text>

  <path d="M190 580 V625 M530 580 V625" class="heat"/>
  <polygon points="176,625 204,625 190,647" fill="#c85a16"/>
  <polygon points="516,625 544,625 530,647" fill="#c85a16"/>

  <rect x="45" y="647" width="630" height="126" rx="6" fill="#eef7ef" stroke="#2d8a4e" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="360" y="691" text-anchor="middle" class="label">Facility Cooling</text>
  <text x="360" y="729" text-anchor="middle" class="body">Topology · Equipment · Temperature 未披露</text>
  <text x="360" y="759" text-anchor="middle" class="muted small">DSX Reference：两条路径可经 FWS / CUB 汇合</text>

  <path d="M360 773 V798" class="heat"/>
  <polygon points="346,798 374,798 360,820" fill="#c85a16"/>

  <rect x="125" y="820" width="470" height="116" rx="6" fill="#edf2f7" stroke="#52647a" stroke-width="3"/>
  <text x="360" y="860" text-anchor="middle" class="label">Closed-loop Air-cooled</text>
  <text x="360" y="895" text-anchor="middle" class="body">Coil · Fan · Dry Cooler</text>
  <text x="360" y="924" text-anchor="middle" class="small">Air-cooled Chiller · No Cooling Tower</text>

  <path d="M360 936 V963" class="heat"/>
  <polygon points="346,963 374,963 360,985" fill="#c85a16"/>

  <rect x="100" y="985" width="520" height="68" rx="6" fill="#fff3e8" stroke="#c85a16" stroke-width="3"/>
  <text x="360" y="1028" text-anchor="middle" class="value">室外空气 · 最终热汇</text>

  <path d="M125 878 H26 V710 H45" class="water"/>
  <polygon points="31,696 31,724 51,710" fill="#3973a8"/>
  <text x="45" y="806" class="blue small">蓝色虚线：水返回</text>

</svg>
