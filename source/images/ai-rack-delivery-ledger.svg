<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1830" viewBox="0 0 720 1830" role="img" aria-labelledby="title desc">
  <title id="title">一座 AI Rack 从订单走到 Rack Ready 的证据链</title>
  <desc id="desc">商业承诺、齐套、工厂测试、发货、现场接口、Bring-up 与 Rack Ready 是不同状态；每个状态有自己的证据，也不能替代下一个状态。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #182338; }
    .h { font-size: 28px; font-weight: 750; }
    .b { font-size: 23px; font-weight: 650; }
    .s { font-size: 20px; fill: #526176; }
    .n { font-size: 21px; font-weight: 750; fill: #fff; }
    .warn { font-size: 20px; fill: #a33924; font-weight: 650; }
    .inv { fill: #fff; }
    .muted-inv { fill: #dce5f2; }
  </style>
  <rect width="720" height="1830" fill="#f6f8fb"/>

  <rect x="72" y="24" width="576" height="184" rx="6" fill="#fff" stroke="#697b92" stroke-width="2"/>
  <circle cx="112" cy="64" r="23" fill="#697b92"/><text x="112" y="72" text-anchor="middle" class="n">1</text>
  <text x="150" y="72" class="h">订单 / 商业承诺</text>
  <text x="104" y="116" class="b">记录：</text><text x="184" y="116" class="s">PO · Award · Backlog</text>
  <text x="104" y="158" class="b">还不能证明：</text><text x="250" y="158" class="s">物料已齐套</text>

  <line x1="360" y1="208" x2="360" y2="232" stroke="#617086" stroke-width="4"/>
  <polygon points="350,232 370,232 360,248" fill="#617086"/>

  <rect x="72" y="262" width="576" height="184" rx="6" fill="#fff" stroke="#2774c5" stroke-width="2"/>
  <circle cx="112" cy="302" r="23" fill="#2774c5"/><text x="112" y="310" text-anchor="middle" class="n">2</text>
  <text x="150" y="310" class="h">Complete Kit</text>
  <text x="104" y="354" class="b">证据：</text><text x="184" y="354" class="s" font-size="18">BOM 核对 · 收货/齐套台账 · Serial Scan</text>
  <text x="104" y="396" class="b">还不能证明：</text><text x="250" y="396" class="s">整柜通过 Factory Test</text>

  <line x1="360" y1="446" x2="360" y2="470" stroke="#617086" stroke-width="4"/>
  <polygon points="350,470 370,470 360,486" fill="#617086"/>

  <rect x="72" y="500" width="576" height="208" rx="6" fill="#fff" stroke="#7048b0" stroke-width="2"/>
  <circle cx="112" cy="540" r="23" fill="#7048b0"/><text x="112" y="548" text-anchor="middle" class="n">3</text>
  <text x="150" y="548" class="h">Rack-level Factory Pass</text>
  <text x="104" y="592" class="b">证据：</text><text x="184" y="592" class="s">Factory Baseline · Test Report</text>
  <text x="104" y="634" class="b">还不能证明：</text><text x="250" y="634" class="s">目标机房接口可用</text>
  <rect x="104" y="660" width="360" height="32" rx="4" fill="#fdebe7"/>
  <text x="284" y="683" text-anchor="middle" class="warn">FAIL：整改后重测当前 Gate</text>

  <line x1="360" y1="708" x2="360" y2="732" stroke="#617086" stroke-width="4"/>
  <polygon points="350,732 370,732 360,748" fill="#617086"/>

  <rect x="72" y="762" width="576" height="208" rx="6" fill="#fff" stroke="#c58a00" stroke-width="2"/>
  <circle cx="112" cy="802" r="23" fill="#c58a00"/><text x="112" y="810" text-anchor="middle" class="n">4</text>
  <text x="150" y="810" class="h">Shipment</text>
  <text x="104" y="854" class="b">记录：</text><text x="184" y="854" class="s">Bill of Lading · Shipment Record</text>
  <text x="104" y="896" class="b">合同可能触发：</text><text x="272" y="896" class="s">Control Transfer / Product Revenue</text>
  <text x="104" y="938" class="b">还不能证明：</text><text x="250" y="938" class="s">Rack 已在现场上线</text>

  <line x1="360" y1="970" x2="360" y2="994" stroke="#617086" stroke-width="4"/>
  <polygon points="350,994 370,994 360,1010" fill="#617086"/>

  <rect x="72" y="1024" width="576" height="184" rx="6" fill="#fff" stroke="#198754" stroke-width="2"/>
  <circle cx="112" cy="1064" r="23" fill="#198754"/><text x="112" y="1072" text-anchor="middle" class="n">5</text>
  <text x="150" y="1072" class="h" font-size="26">Site Installation / Interface Closure</text>
  <text x="104" y="1116" class="b">证据：</text><text x="184" y="1116" class="s">位置 · A/B Power · TCS · Network</text>
  <text x="104" y="1158" class="b">还不能证明：</text><text x="250" y="1158" class="s">NVLink Domain 健康</text>

  <line x1="360" y1="1208" x2="360" y2="1232" stroke="#617086" stroke-width="4"/>
  <polygon points="350,1232 370,1232 360,1248" fill="#617086"/>

  <rect x="72" y="1262" width="576" height="208" rx="6" fill="#fff" stroke="#008b8b" stroke-width="2"/>
  <circle cx="112" cy="1302" r="23" fill="#008b8b"/><text x="112" y="1310" text-anchor="middle" class="n">6</text>
  <text x="150" y="1310" class="h">Bring-up / Health Validation</text>
  <text x="104" y="1354" class="b">证据：</text><text x="184" y="1354" class="s">Inventory · Firmware · BMC · NIC · NVLink</text>
  <text x="104" y="1396" class="b">判定：</text><text x="184" y="1396" class="s">是否满足项目 Acceptance Criteria</text>
  <rect x="104" y="1422" width="360" height="32" rx="4" fill="#fdebe7"/>
  <text x="284" y="1445" text-anchor="middle" class="warn">FAIL：整改后重测当前 Gate</text>

  <line x1="360" y1="1470" x2="360" y2="1494" stroke="#617086" stroke-width="4"/>
  <polygon points="350,1494 370,1494 360,1510" fill="#617086"/>

  <rect x="72" y="1524" width="576" height="184" rx="6" fill="#e6f4ec" stroke="#198754" stroke-width="3"/>
  <circle cx="112" cy="1564" r="23" fill="#198754"/><text x="112" y="1572" text-anchor="middle" class="n">7</text>
  <text x="150" y="1572" class="h">Rack Ready</text>
  <text x="104" y="1616" class="b">证明：</text><text x="184" y="1616" class="s">现场 72-GPU NVLink Domain 可进入下一 Gate</text>
  <text x="104" y="1658" class="b">还不能证明：</text><text x="250" y="1658" class="s">Cluster Ready / Available Workload</text>

  <rect x="32" y="1742" width="656" height="88" rx="6" fill="#182338"/>
  <text x="360" y="1778" text-anchor="middle" class="b inv">订单、收入与现场容量可能对应不同 Milestone</text>
  <text x="360" y="1810" text-anchor="middle" class="s muted-inv">比较以前，先对齐合同口径与 Evidence Boundary</text>
</svg>
