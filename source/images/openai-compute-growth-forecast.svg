<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 可用算力趋势预测</title>
  <desc id="desc">OpenAI 已披露的可用算力从 2023 年 0.2GW 增长到 2025 年约 1.9GW。以 2030 年 30GW 目标倒推，2026 至 2029 年的目标隐含路径分别约为 3.3GW、5.7GW、9.9GW 和 17.3GW，对应约 74% 的复合年增长率。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.grid{stroke:#d7dee7;stroke-width:1.5}.axis{stroke:#64748b;stroke-width:2}.actual-line{fill:none;stroke:#047857;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.forecast-line{fill:none;stroke:#b45309;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:17 15}.actual-dot{fill:#047857;stroke:#f8fafc;stroke-width:5}.forecast-dot{fill:#f8fafc;stroke:#b45309;stroke-width:6}.target-dot{fill:#b45309;stroke:#f8fafc;stroke-width:5}
      .axis-label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.year{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155;text-anchor:middle}.value{font:800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;text-anchor:middle}.growth{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.legend{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.event-year{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155;text-anchor:middle}.event{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569;text-anchor:middle}.event-line{stroke:#94a3b8;stroke-width:2}.event-dot{fill:#475569}.unit{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>

  <g>
    <text class="unit" x="145" y="72">可用算力（GW）</text>
    <line class="grid" x1="155" y1="650" x2="1450" y2="650"/>
    <line class="grid" x1="155" y1="560" x2="1450" y2="560"/>
    <line class="grid" x1="155" y1="470" x2="1450" y2="470"/>
    <line class="grid" x1="155" y1="380" x2="1450" y2="380"/>
    <line class="grid" x1="155" y1="290" x2="1450" y2="290"/>
    <line class="grid" x1="155" y1="200" x2="1450" y2="200"/>
    <line class="grid" x1="155" y1="110" x2="1450" y2="110"/>
    <line class="axis" x1="155" y1="110" x2="155" y2="650"/>
    <line class="axis" x1="155" y1="650" x2="1450" y2="650"/>

    <text class="axis-label" x="124" y="656">0</text>
    <text class="axis-label" x="124" y="566">5</text>
    <text class="axis-label" x="113" y="476">10</text>
    <text class="axis-label" x="113" y="386">15</text>
    <text class="axis-label" x="113" y="296">20</text>
    <text class="axis-label" x="113" y="206">25</text>
    <text class="axis-label" x="113" y="116">30</text>

    <path class="actual-line" d="M180 646.4L360 639.2L540 615.8"/>
    <path class="forecast-line" d="M540 615.8L720 590.6L900 547.4L1080 471.8L1260 338.6L1440 110"/>

    <circle class="actual-dot" cx="180" cy="646.4" r="11"/>
    <circle class="actual-dot" cx="360" cy="639.2" r="11"/>
    <circle class="actual-dot" cx="540" cy="615.8" r="11"/>
    <circle class="forecast-dot" cx="720" cy="590.6" r="11"/>
    <circle class="forecast-dot" cx="900" cy="547.4" r="11"/>
    <circle class="forecast-dot" cx="1080" cy="471.8" r="11"/>
    <circle class="forecast-dot" cx="1260" cy="338.6" r="11"/>
    <circle class="target-dot" cx="1440" cy="110" r="13"/>

    <text class="value" x="180" y="602">0.2</text>
    <text class="value" x="360" y="592">0.6</text>
    <text class="value" x="540" y="570">1.9</text>
    <text class="value" x="720" y="548">3.3</text>
    <text class="value" x="900" y="505">5.7</text>
    <text class="value" x="1080" y="429">9.9</text>
    <text class="value" x="1260" y="296">17.3</text>
    <text class="value" x="1402" y="76">30</text>

    <text class="growth" x="280" y="530" fill="#047857">约 3× / 年</text>
    <text class="growth" x="955" y="246" fill="#b45309">目标隐含 CAGR 约 74%</text>

    <text class="year" x="180" y="690">2023</text>
    <text class="year" x="360" y="690">2024</text>
    <text class="year" x="540" y="690">2025</text>
    <text class="year" x="720" y="690">2026F</text>
    <text class="year" x="900" y="690">2027F</text>
    <text class="year" x="1080" y="690">2028F</text>
    <text class="year" x="1260" y="690">2029F</text>
    <text class="year" x="1440" y="690">2030</text>
  </g>

  <g>
    <line class="event-line" x1="720" y1="735" x2="720" y2="780"/>
    <circle class="event-dot" cx="720" cy="735" r="6"/>
    <text class="event-year" x="720" y="812">2026</text>
    <text class="event" x="720" y="840">AWS</text>

    <line class="event-line" x1="900" y1="735" x2="900" y2="780"/>
    <circle class="event-dot" cx="900" cy="735" r="6"/>
    <text class="event-year" x="900" y="812">2027</text>
    <text class="event" x="900" y="840">Oracle 四站</text>

    <line class="event-line" x1="1080" y1="735" x2="1080" y2="780"/>
    <circle class="event-dot" cx="1080" cy="735" r="6"/>
    <text class="event-year" x="1080" y="812">2028</text>
    <text class="event" x="1080" y="840">Cerebras · PORTS</text>
  </g>

  <g transform="translate(155 930)">
    <line class="actual-line" x1="0" y1="0" x2="54" y2="0"/><text class="legend" x="70" y="6">实际 available compute</text>
    <line class="forecast-line" x1="300" y1="0" x2="354" y2="0"/><text class="legend" x="370" y="6">30GW 目标隐含路径</text>
    <circle class="event-dot" cx="685" cy="0" r="6"/><text class="legend" x="701" y="6">公开交付节点</text>
  </g>
</svg>
