<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">PORTS-Pike 后续证据看板</title><desc id="desc">按土地许可、电力、设施、集群和生产五个层级追踪会改变项目状态的下一事件，并区分确认信号与下修信号。</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:16px;font-weight:750}.body{font-size:13px;fill:#52647a}.small{font-size:12px;fill:#607089}.good{fill:#24864a}.bad{fill:#c85a16}.inv{fill:#fff}</style>
  <rect width="1600" height="1050" fill="#f7f9fc"/><text x="800" y="58" class="title">下一条公告只有改变状态，才改变交付概率</text>
  <rect x="45" y="105" width="1510" height="825" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/>
  <rect x="75" y="145" width="1450" height="55" fill="#172033"/><text x="100" y="179" class="head inv">层级</text><text x="360" y="179" class="head inv">下一项可核对事件</text><text x="900" y="179" class="head inv">状态改善</text><text x="1240" y="179" class="head inv">需要下修</text>
  <rect x="75" y="200" width="1450" height="130" fill="#eef3fb"/><text x="100" y="250" class="head">土地 / 许可</text><text x="360" y="238" class="body">FAST-41 获得许可</text><text x="360" y="268" class="body">首批评估 → 可执行设计</text><circle cx="875" cy="246" r="8" class="good"/><text x="900" y="251" class="body">按计划关闭许可</text><circle cx="1215" cy="246" r="8" class="bad"/><text x="1240" y="251" class="body">里程碑持续右移</text><text x="900" y="286" class="small">对应建筑可完整施工</text><text x="1240" y="286" class="small">场地范围或条件仍不确定</text>
  <rect x="75" y="330" width="1450" height="145" fill="#fff7e6"/><text x="100" y="385" class="head">电力</text><text x="360" y="365" class="body">AEP 接入计划 · 变电站送电</text><text x="360" y="395" class="body">发电开工 · 765kV 路线 / 路权 / 施工</text><circle cx="875" cy="375" r="8" class="good"/><text x="900" y="380" class="body">约束性工程与设备订单</text><circle cx="1215" cy="375" r="8" class="bad"/><text x="1240" y="380" class="body">仅重申 10GW 目标</text><text x="900" y="419" class="small">永久电力按期可用</text><text x="1240" y="419" class="small">发电 / 输电未进入建设</text>
  <rect x="75" y="475" width="1450" height="145" fill="#eef3fb"/><text x="100" y="530" class="head">设施</text><text x="360" y="510" class="body">长周期设备下单 · 出厂验收 · 到场</text><text x="360" y="540" class="body">建筑封闭 · 机电完工 · 整体验证 · 交付</text><circle cx="875" cy="520" r="8" class="good"/><text x="900" y="525" class="body">首批 MW 可供租用</text><circle cx="1215" cy="520" r="8" class="bad"/><text x="1240" y="525" class="body">800MW 日期右移</text><text x="900" y="564" class="small">调试验证报告可核对</text><text x="1240" y="564" class="small">租约与施工状态缺少对应期次</text>
  <rect x="75" y="620" width="1450" height="145" fill="#fff7e6"/><text x="100" y="675" class="head">集群</text><text x="360" y="655" class="body">NVIDIA 发货 · 机架上电</text><text x="360" y="685" class="body">网络 / 存储通过 · 健康容量</text><circle cx="875" cy="665" r="8" class="good"/><text x="900" y="670" class="body">集群通过验收</text><circle cx="1215" cy="665" r="8" class="bad"/><text x="1240" y="670" class="body">设施已计租、集群仍等待</text><text x="900" y="709" class="small">良率与性能测试达标</text><text x="1240" y="709" class="small">部署时间差扩大</text>
  <rect x="75" y="765" width="1450" height="130" fill="#eef3fb"/><text x="100" y="815" class="head">生产</text><text x="360" y="803" class="body">生产移交 · 负载爬坡</text><text x="360" y="833" class="body">训练 / 推理 / Agent 服务目标</text><circle cx="875" cy="811" r="8" class="good"/><text x="900" y="816" class="body">可计费负载增长</text><circle cx="1215" cy="811" r="8" class="bad"/><text x="1240" y="816" class="body">可用 MW 长期闲置</text><text x="900" y="851" class="small">收入跟上租赁爬坡</text><text x="1240" y="851" class="small">需求或交付网络未就绪</text>
  <rect x="175" y="955" width="1250" height="62" rx="6" fill="#172033"/><text x="800" y="994" class="head inv" text-anchor="middle">重复 8GW 不增加证据；具体期次跨过下一道状态才增加</text>
</svg>
