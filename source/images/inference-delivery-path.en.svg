<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end inference delivery path</title><desc id="desc">An inference request crosses ISP, edge, backbone, Regional Front Door, Inference Gateway, and GPU workers before streaming chunks return to the user.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:17px;font-weight:750;text-anchor:middle}.body{font-size:14px;fill:#52647a;text-anchor:middle}.inv{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="58" class="title">One Endpoint Hides Three Networks and a Bidirectional Path</text>
  <rect x="45" y="110" width="250" height="640" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/><text x="170" y="150" class="head">User Network</text><rect x="85" y="245" width="170" height="90" rx="6" fill="#64748b"/><text x="170" y="283" class="head inv">Client</text><text x="170" y="312" class="body inv">App · Browser</text><rect x="85" y="455" width="170" height="90" rx="6" fill="#64748b"/><text x="170" y="493" class="head inv">ISP / Last Mile</text><text x="170" y="522" class="body inv">Access Network</text>
  <rect x="325" y="110" width="300" height="640" rx="7" fill="#fff" stroke="#2f6fab" stroke-width="2"/><text x="475" y="150" class="head">Edge Network</text><rect x="370" y="245" width="210" height="90" rx="6" fill="#2f6fab"/><text x="475" y="283" class="head inv">Anycast / DNS</text><text x="475" y="312" class="body inv">Nearest Ingress</text><rect x="370" y="455" width="210" height="90" rx="6" fill="#2f6fab"/><text x="475" y="493" class="head inv">Edge PoP</text><text x="475" y="522" class="body inv">TLS · WAF · Steering</text>
  <rect x="655" y="110" width="390" height="640" rx="7" fill="#fff" stroke="#167d73" stroke-width="2"/><text x="850" y="150" class="head">Regional Service Network</text><rect x="700" y="245" width="300" height="90" rx="6" fill="#167d73"/><text x="850" y="283" class="head inv">Provider Backbone</text><text x="850" y="312" class="body inv">Edge → Selected Region</text><rect x="700" y="455" width="300" height="90" rx="6" fill="#7653a6"/><text x="850" y="493" class="head inv">Regional Front Door</text><text x="850" y="522" class="body inv">Auth · Rate Limit · Policy</text>
  <rect x="1075" y="110" width="480" height="640" rx="7" fill="#fff" stroke="#c85a16" stroke-width="2"/><text x="1315" y="150" class="head">Inference Region</text><rect x="1120" y="245" width="190" height="90" rx="6" fill="#7653a6"/><text x="1215" y="283" class="head inv">Inference Gateway</text><text x="1215" y="312" class="body inv">Model · KV · Load</text><rect x="1360" y="245" width="150" height="90" rx="6" fill="#b88407"/><text x="1435" y="283" class="head inv">Queue</text><text x="1435" y="312" class="body inv">Batch</text><rect x="1120" y="505" width="190" height="90" rx="6" fill="#c85a16"/><text x="1215" y="543" class="head inv">Prefill Worker</text><text x="1215" y="572" class="body inv">Prompt → KV</text><rect x="1360" y="505" width="150" height="90" rx="6" fill="#24864a"/><text x="1435" y="543" class="head inv">Decode</text><text x="1435" y="572" class="body inv">Token Stream</text>
  <line x1="155" y1="335" x2="155" y2="433" stroke="#52647a" stroke-width="4"/><polygon points="143,433 167,433 155,455" fill="#52647a"/><path d="M255 500H300V290H348" fill="none" stroke="#52647a" stroke-width="4"/><polygon points="348,278 348,302 370,290" fill="#52647a"/><path d="M475 335V400H650V290H678" fill="none" stroke="#52647a" stroke-width="4"/><polygon points="678,278 678,302 700,290" fill="#52647a"/><line x1="1000" y1="290" x2="1098" y2="290" stroke="#52647a" stroke-width="4"/><polygon points="1098,278 1098,302 1120,290" fill="#52647a"/><line x1="1310" y1="290" x2="1338" y2="290" stroke="#52647a" stroke-width="4"/><polygon points="1338,278 1338,302 1360,290" fill="#52647a"/><path d="M1435 335V450H1215V483" fill="none" stroke="#52647a" stroke-width="4"/><polygon points="1203,483 1227,483 1215,505" fill="#52647a"/><line x1="1310" y1="550" x2="1338" y2="550" stroke="#52647a" stroke-width="4"/><polygon points="1338,538 1338,562 1360,550" fill="#52647a"/>
  <path d="M1435 595V680H850V567" fill="none" stroke="#24864a" stroke-width="4"/><polygon points="838,567 862,567 850,545" fill="#24864a"/><path d="M700 500H602" fill="none" stroke="#24864a" stroke-width="4"/><polygon points="602,488 602,512 580,500" fill="#24864a"/><line x1="370" y1="500" x2="277" y2="500" stroke="#24864a" stroke-width="4"/><polygon points="277,488 277,512 255,500" fill="#24864a"/><path d="M185 455V357" fill="none" stroke="#24864a" stroke-width="4"/><polygon points="173,357 197,357 185,335" fill="#24864a"/><text x="830" y="718" class="head" fill="#24864a">Streaming Chunks Return</text>
  <rect x="190" y="795" width="1220" height="62" rx="6" fill="#172033"/><text x="800" y="832" class="head inv">Cluster Fabric Connects GPUs; Delivery Network Turns Compute into User-visible Service</text>
</svg>
