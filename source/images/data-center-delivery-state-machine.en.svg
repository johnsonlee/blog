<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Data center delivery states from site selection to RFS</title>
  <desc id="desc">Announced is a disclosure event rather than an engineering state. Capacity then moves through site control, development, construction, energization, commissioning, and RFS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#52647a"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
      .stage { font-size: 24px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .sub { font-size: 17px; font-weight: 650; fill: #607089; text-anchor: middle; }
      .body { font-size: 19px; fill: #334155; text-anchor: middle; }
      .small { font-size: 16px; fill: #607089; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>

  <rect x="640" y="54" width="320" height="112" rx="6" fill="#fff4e5" stroke="#c96b16" stroke-width="2"/>
  <text x="800" y="101" class="stage" fill="#9a4b0a">ANNOUNCED</text>
  <text x="800" y="137" class="small" fill="#9a4b0a">A disclosure event</text>
  <path d="M700 166L175 286" fill="none" stroke="#d29a61" stroke-width="2" stroke-dasharray="8 9"/>
  <path d="M760 166L425 286" fill="none" stroke="#d29a61" stroke-width="2" stroke-dasharray="8 9"/>
  <path d="M840 166L675 286" fill="none" stroke="#d29a61" stroke-width="2" stroke-dasharray="8 9"/>
  <path d="M900 166L925 286" fill="none" stroke="#d29a61" stroke-width="2" stroke-dasharray="8 9"/>
  <text x="1235" y="110" class="body">Can occur at different engineering states</text>

  <line x1="270" y1="351" x2="330" y2="351" stroke="#52647a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="520" y1="351" x2="580" y2="351" stroke="#52647a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="770" y1="351" x2="830" y2="351" stroke="#52647a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1020" y1="351" x2="1080" y2="351" stroke="#52647a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1270" y1="351" x2="1330" y2="351" stroke="#52647a" stroke-width="4" marker-end="url(#arrow)"/>

  <g>
    <rect x="80" y="286" width="190" height="130" rx="6" fill="#edf2f7" stroke="#64748b" stroke-width="2"/>
    <text x="175" y="349" class="stage">Site Control</text>
    <circle cx="175" cy="444" r="17" fill="#64748b"/><text x="175" y="451" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <rect x="80" y="475" width="190" height="154" rx="6" fill="#fff" stroke="#d5dde7"/>
    <text x="175" y="519" class="body">Land control</text><text x="175" y="554" class="body">Site boundary</text><text x="175" y="599" class="small">Still pipeline</text>
  </g>
  <g>
    <rect x="330" y="286" width="190" height="130" rx="6" fill="#eaf2fb" stroke="#3f6f9f" stroke-width="2"/>
    <text x="425" y="349" class="stage">Development</text>
    <circle cx="425" cy="444" r="17" fill="#3f6f9f"/><text x="425" y="451" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <rect x="330" y="475" width="190" height="154" rx="6" fill="#fff" stroke="#d5dde7"/>
    <text x="425" y="514" class="body">Design · permits</text><text x="425" y="549" class="body">Power · fiber plans</text><text x="425" y="599" class="small">Capacity can still change</text>
  </g>
  <g>
    <rect x="580" y="286" width="190" height="130" rx="6" fill="#fff0e5" stroke="#c85a16" stroke-width="2"/>
    <text x="675" y="349" class="stage">Construction</text>
    <circle cx="675" cy="444" r="17" fill="#c85a16"/><text x="675" y="451" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <rect x="580" y="475" width="190" height="154" rx="6" fill="#fff" stroke="#d5dde7"/>
    <text x="675" y="514" class="body">Civil · structural</text><text x="675" y="549" class="body">MEP installation</text><text x="675" y="599" class="small">CapEx is deployed</text>
  </g>
  <g>
    <rect x="830" y="286" width="190" height="130" rx="6" fill="#fff7d8" stroke="#b88407" stroke-width="2"/>
    <text x="925" y="349" class="stage">Energized</text>
    <circle cx="925" cy="444" r="17" fill="#b88407"/><text x="925" y="451" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <rect x="830" y="475" width="190" height="154" rx="6" fill="#fff" stroke="#d5dde7"/>
    <text x="925" y="514" class="body">Power reaches</text><text x="925" y="549" class="body">the agreed boundary</text><text x="925" y="599" class="small">Systems remain unproven</text>
  </g>
  <g>
    <rect x="1080" y="286" width="190" height="130" rx="6" fill="#e7f4f2" stroke="#167d73" stroke-width="2"/>
    <text x="1175" y="349" class="stage">Commissioning</text>
    <circle cx="1175" cy="444" r="17" fill="#167d73"/><text x="1175" y="451" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <rect x="1080" y="475" width="190" height="154" rx="6" fill="#fff" stroke="#d5dde7"/>
    <text x="1175" y="514" class="body">Startup · functional</text><text x="1175" y="549" class="body">Integrated testing</text><text x="1175" y="599" class="small">Design and faults tested</text>
  </g>
  <g>
    <rect x="1330" y="286" width="190" height="130" rx="6" fill="#e8f5e9" stroke="#24864a" stroke-width="3"/>
    <text x="1425" y="339" class="stage">Facility Handoff</text><text x="1425" y="374" class="sub">RFS</text>
    <circle cx="1425" cy="444" r="17" fill="#24864a"/><text x="1425" y="451" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <rect x="1330" y="475" width="190" height="154" rx="6" fill="#fff" stroke="#8fc7a3" stroke-width="2"/>
    <text x="1425" y="514" class="body">Contracted IT load</text><text x="1425" y="549" class="body">can energize</text><text x="1425" y="599" class="small" fill="#24864a">Facility supply</text>
  </g>

  <path d="M80 705V735H1270V705" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="675" y="778" class="body">Capacity still in delivery</text>
  <rect x="1330" y="700" width="190" height="78" rx="6" fill="#24864a"/>
  <text x="1425" y="733" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Across RFS</text>
  <text x="1425" y="760" font-size="15" fill="#d9f3e2" text-anchor="middle">Facility is deliverable</text>
  <text x="800" y="849" class="small">IT deployment and Production Handoff still follow RFS</text>
</svg>
