<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Data Center Campus Overview</title>
  <desc id="desc">The high-voltage grid feeds a campus substation, which distributes power to three data center buildings. Separate lanes connect the buildings to central cooling and the network edge. Numbers one through thirteen correspond to the series outline.</desc>
  <defs>
    <marker id="power-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#c97808"/></marker>
    <marker id="heat-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#cf5142"/></marker>
    <marker id="data-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#21776f"/></marker>
    <style>
      .bg{fill:#f6f7f8}.campus{fill:#fff;stroke:#98a5af;stroke-width:2}.building{fill:#e6ebef;stroke:#667681;stroke-width:2}.roof{fill:#4d5d68}.utility{fill:#eef2f4;stroke:#71808b;stroke-width:2}.cooling{fill:#fff0ed;stroke:#b85d51;stroke-width:2}.network{fill:#e5f1ef;stroke:#267a70;stroke-width:2}.case{fill:#f1edf7;stroke:#765c91;stroke-width:2}
      .ink{fill:#202a33}.muted{fill:#65717c}.label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;font-weight:700}.minor{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;font-weight:600}.tiny{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;font-weight:600}.center{text-anchor:middle}
      .power{fill:none;stroke:#c97808;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.heat{fill:none;stroke:#cf5142;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.data{fill:none;stroke:#21776f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.marker{fill:#26323c;stroke:#fff;stroke-width:3}.num{fill:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/><rect class="campus" x="125" y="60" width="1030" height="610" rx="6"/>
  <circle class="marker" cx="125" cy="60" r="20"/><text class="num" x="125" y="60">1</text><text class="minor ink" x="155" y="67">SITE / CAMPUS</text>
  <g stroke="#59656f" stroke-width="4" fill="none"><path d="M24 380L57 240L90 380M34 330H80M29 356H85M42 292H72"/><path d="M82 380L110 265L138 380M91 334H129M87 358H133M98 304H124"/></g><text class="minor ink center" x="74" y="408"><tspan x="74">HIGH-VOLTAGE</tspan><tspan x="74" dy="20">GRID</tspan></text>
  <rect class="utility" x="165" y="275" width="180" height="120" rx="5"/><circle class="marker" cx="165" cy="275" r="20"/><text class="num" x="165" y="275">2</text><g stroke="#59656f" stroke-width="3" fill="none"><path d="M190 320H320M205 340H305M220 300V372M255 300V372M290 300V372"/></g><text class="minor ink center" x="255" y="418"><tspan x="255">CAMPUS</tspan><tspan x="255" dy="20">SUBSTATION</tspan></text>
  <g><rect class="building" x="435" y="105" width="245" height="120" rx="4"/><path class="roof" d="M435 105H680L650 130H465Z"/><text class="label ink center" x="557" y="177">DATA CENTER A</text><circle class="marker" cx="435" cy="105" r="22"/><text class="num" x="435" y="105">3–5</text></g>
  <g><rect class="building" x="435" y="280" width="245" height="120" rx="4"/><path class="roof" d="M435 280H680L650 305H465Z"/><text class="label ink center" x="557" y="352">DATA CENTER B</text><circle class="marker" cx="435" cy="280" r="22"/><text class="num" x="435" y="280">6–9</text></g>
  <g><rect class="building" x="435" y="455" width="245" height="120" rx="4"/><path class="roof" d="M435 455H680L650 480H465Z"/><text class="label ink center" x="557" y="527">DATA CENTER C</text></g>
  <rect class="cooling" x="815" y="130" width="210" height="125" rx="5"/><g stroke="#71808b" stroke-width="4" fill="none"><rect x="845" y="163" width="52" height="55" rx="3"/><rect x="915" y="163" width="52" height="55" rx="3"/><path d="M852 178H890M852 194H890M922 178H960M922 194H960"/></g><text class="minor ink center" x="920" y="282"><tspan x="920">CENTRAL COOLING</tspan><tspan x="920" dy="20">PLANT</tspan></text>
  <rect class="network" x="850" y="425" width="190" height="95" rx="5"/><text class="label ink center" x="945" y="467">NETWORK EDGE</text><text class="tiny muted center" x="945" y="494">BACKBONE · EDGE</text><circle class="marker" cx="850" cy="425" r="22"/><text class="num" x="850" y="425">10–12</text>
  <rect class="case" x="805" y="585" width="290" height="55" rx="5"/><text class="tiny ink center" x="950" y="610"><tspan x="950">PORTS-PIKE 8 GW</tspan><tspan x="950" dy="17">FULL-STACK TEST</tspan></text><circle class="marker" cx="1095" cy="585" r="20"/><text class="num" x="1095" y="585">13</text>
  <path class="power" d="M105 345H165" marker-end="url(#power-arrow)"/><path class="power" d="M345 335H385V515"/><path class="power" d="M385 165H435" marker-end="url(#power-arrow)"/><path class="power" d="M385 340H435" marker-end="url(#power-arrow)"/><path class="power" d="M385 515H435" marker-end="url(#power-arrow)"/>
  <path class="heat" d="M680 150H760V192H815" marker-end="url(#heat-arrow)"/>
  <path class="data" d="M680 550H790V472H850" marker-end="url(#data-arrow)"/>
  <line class="power" x1="310" y1="715" x2="360" y2="715" marker-end="url(#power-arrow)"/><text class="minor muted" x="378" y="722">POWER</text><line class="heat" x1="490" y1="715" x2="540" y2="715" marker-end="url(#heat-arrow)"/><text class="minor muted" x="558" y="722">HEAT</text><line class="data" x1="650" y1="715" x2="700" y2="715" marker-end="url(#data-arrow)"/><text class="minor muted" x="718" y="722">DATA</text>
</svg>
