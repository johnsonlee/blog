<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Data Center Campus Overview</title>
  <desc id="desc">The high-voltage grid enters the campus substation. Power reaches multiple data center buildings and a central cooling plant. The buildings connect through fiber and an external network edge. Number ranges correspond to the series outline.</desc>
  <defs>
    <marker id="p" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L16 8L0 16Z" fill="#d58a17"/></marker>
    <marker id="h" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L16 8L0 16Z" fill="#d35443"/></marker>
    <marker id="d" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L16 8L0 16Z" fill="#267a70"/></marker>
    <style>
      .bg{fill:#f5f7f8}.site{fill:#e8ecef;stroke:#9aa5af;stroke-width:2}.road{fill:none;stroke:#c6cdd3;stroke-width:18}
      .top{fill:#fff}.front{fill:#d9e0e5}.side{fill:#c7d0d7}.roof{fill:#56636d}.yard{fill:#edf1f3;stroke:#87939d;stroke-width:1.5}
      .ink{fill:#202a33}.muted{fill:#66727d}.label{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.minor{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tiny{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.center{text-anchor:middle}
      .power{fill:none;stroke:#d58a17;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.heat{fill:none;stroke:#d35443;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.data{fill:none;stroke:#267a70;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .marker{fill:#26323c;stroke:#fff;stroke-width:3}.num{fill:#fff;font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:middle}.legend{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#46515b}
    </style>
  </defs>
