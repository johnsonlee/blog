<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Commercial gates from application to load ramp</title><desc id="desc">Study fees, collateral, NTP, actual energization, and minimum billing form distinct payment gates.</desc><rect width="1440" height="900" fill="#F7F9FC"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style><text x="60" y="70" fill="#5E6B7E" font-size="24" font-weight="800" text-anchor="start"><tspan x="60" dy="0">Payment gates sit in contracts and energization, not headline GW</tspan></text><rect x="55" y="125" width="230" height="105" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="170" y="185.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">Study request</tspan></text><line x1="285" y1="178" x2="316" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="330,178 316,171 316,185" fill="#26364D"/><rect x="55" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="170" y="341.5" fill="#172033" font-size="14" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">$10k / $50k / $100k</tspan><tspan x="170" dy="30">No payment, no queue position</tspan></text><line x1="170" y1="230" x2="170" y2="285" stroke="#C93E4F" stroke-width="3"/><rect x="330" y="125" width="230" height="105" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="445" y="185.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">LOA + ESA</tspan></text><line x1="560" y1="178" x2="591" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="605,178 591,171 591,185" fill="#26364D"/><rect x="330" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="445" y="341.5" fill="#172033" font-size="14" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">Collateral · CIAC</tspan><tspan x="445" dy="30">Utility commits spending</tspan></text><line x1="445" y1="230" x2="445" y2="285" stroke="#C93E4F" stroke-width="3"/><rect x="605" y="125" width="230" height="105" rx="7" fill="#FFF0CC" stroke="#C77800" stroke-width="2"/><text x="720" y="185.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">NTP / procurement</tspan></text><line x1="835" y1="178" x2="866" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="880,178 866,171 866,185" fill="#26364D"/><rect x="605" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="720" y="341.5" fill="#172033" font-size="14" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">Long-lead equipment slots</tspan><tspan x="720" dy="30">Cancellation leaves build cost</tspan></text><line x1="720" y1="230" x2="720" y2="285" stroke="#C77800" stroke-width="3"/><rect x="880" y="125" width="230" height="105" rx="7" fill="#DDF4EC" stroke="#0F8A6A" stroke-width="2"/><text x="995" y="185.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">Actual energization</tspan></text><line x1="1110" y1="178" x2="1141" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="1155,178 1141,171 1141,185" fill="#26364D"/><rect x="880" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="995" y="341.5" fill="#172033" font-size="14" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">ESA term begins</tspan><tspan x="995" dy="30">Minimum billing starts</tspan></text><line x1="995" y1="230" x2="995" y2="285" stroke="#0F8A6A" stroke-width="3"/><rect x="1155" y="125" width="230" height="105" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="1270" y="185.5" fill="#172033" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">Phased ramp</tspan></text><rect x="1155" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1270" y="341.5" fill="#172033" font-size="14" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">50% → 65% → 80% → 90%</tspan><tspan x="1270" dy="30">Capacity and minimum bill ramp</tspan></text><line x1="1270" y1="230" x2="1270" y2="285" stroke="#2563EB" stroke-width="3"/><text x="55" y="505" fill="#5E6B7E" font-size="23" font-weight="800" text-anchor="start"><tspan x="55" dy="0">Who recognizes economics, and when?</tspan></text><rect x="55" y="545" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="586" fill="#172033" font-size="16" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Utility / transmission owner</tspan></text><rect x="345" y="545" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="586" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">Interconnection asset enters recoverable cost or rate base</tspan></text><rect x="845" y="545" width="540" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1115" y="586" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">Bound by regulation, CIAC, and recovery lag</tspan></text><rect x="55" y="621" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="662" fill="#172033" font-size="16" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Equipment OEM</tspan></text><rect x="345" y="621" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="662" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">Deposit · shipment · performance progress</tspan></text><rect x="845" y="621" width="540" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1115" y="662" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">Order quality depends on slots and cancellation terms</tspan></text><rect x="55" y="697" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="738" fill="#172033" font-size="16" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">EPC / commissioning</tspan></text><rect x="345" y="697" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="738" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">Design · install · test milestones</tspan></text><rect x="845" y="697" width="540" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1115" y="738" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">One-time project revenue, usually no long-term tariff</tspan></text><rect x="55" y="773" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="814" fill="#172033" font-size="16" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Data center owner</tspan></text><rect x="345" y="773" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="814" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">Time value of earlier usable MW</tspan></text><rect x="845" y="773" width="540" height="66" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="1115" y="814" fill="#172033" font-size="15" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">Bears collateral, minimum load, and stranded capacity risk</tspan></text></svg>
