<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1540" viewBox="0 0 720 1540" role="img" aria-labelledby="title desc">
  <title id="title">How 9,216 GPUs produce 1,040 compute-fabric switches</title>
  <desc id="desc">One NVL72 rack exposes 72 400G ports. Eight racks form one SU with four rails, 32 leaf switches, and 24 spine switches. Sixteen SUs add 144 core switches for a total of 1,040.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182338; }
    .h { font-size: 29px; font-weight: 750; }
    .b { font-size: 23px; font-weight: 650; }
    .s { font-size: 20px; fill: #526176; }
    .inv { fill: #fff; }
    .muted { fill: #dbe6f5; }
  </style>
  <rect width="720" height="1540" fill="#f6f8fb"/>

  <rect x="72" y="32" width="576" height="154" rx="6" fill="#e9f2fc" stroke="#2774c5" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" class="h">One NVL72 Rack</text>
  <text x="360" y="120" text-anchor="middle" class="b">72 GPUs · 18 Compute Trays</text>
  <text x="360" y="157" text-anchor="middle" class="s">72 × 400G GPU-facing Ports</text>
  <line x1="360" y1="186" x2="360" y2="218" stroke="#617086" stroke-width="4"/>
  <polygon points="350,218 370,218 360,234" fill="#617086"/>

  <rect x="48" y="248" width="624" height="296" rx="6" fill="#fff" stroke="#198754" stroke-width="2"/>
  <text x="360" y="294" text-anchor="middle" class="h">One Scalable Unit</text>
  <text x="360" y="334" text-anchor="middle" class="b">8 Racks · 576 GPUs</text>
  <text x="360" y="371" text-anchor="middle" class="s">The same GPU/NIC position aligns across four rails</text>
  <rect x="72" y="400" width="132" height="70" rx="4" fill="#e9f2fc"/><text x="138" y="443" text-anchor="middle" class="b">Rail 0</text>
  <rect x="220" y="400" width="132" height="70" rx="4" fill="#e6f4ec"/><text x="286" y="443" text-anchor="middle" class="b">Rail 1</text>
  <rect x="368" y="400" width="132" height="70" rx="4" fill="#f1ebfa"/><text x="434" y="443" text-anchor="middle" class="b">Rail 2</text>
  <rect x="516" y="400" width="132" height="70" rx="4" fill="#fff0e5"/><text x="582" y="443" text-anchor="middle" class="b">Rail 3</text>
  <text x="360" y="514" text-anchor="middle" class="b">Per Rail: 8 Leaf + 6 Spine</text>

  <line x1="360" y1="544" x2="360" y2="576" stroke="#617086" stroke-width="4"/>
  <polygon points="350,576 370,576 360,592" fill="#617086"/>
  <rect x="72" y="606" width="576" height="146" rx="6" fill="#182338"/>
  <text x="360" y="654" text-anchor="middle" class="h inv">16 Scalable Units</text>
  <text x="360" y="696" text-anchor="middle" class="b muted">128 Racks · 9,216 GPUs</text>
  <text x="360" y="730" text-anchor="middle" class="s muted">4 Rails · 6 Core Groups</text>

  <line x1="360" y1="752" x2="360" y2="784" stroke="#617086" stroke-width="4"/>
  <polygon points="350,784 370,784 360,800" fill="#617086"/>
  <rect x="72" y="814" width="576" height="112" rx="6" fill="#e9f2fc" stroke="#2774c5" stroke-width="2"/>
  <text x="360" y="860" text-anchor="middle" class="h">9,216 GPU-facing Ports</text>
  <text x="360" y="898" text-anchor="middle" class="s">3.6864 Pbps One-way Injection Bandwidth</text>

  <line x1="360" y1="926" x2="360" y2="958" stroke="#617086" stroke-width="4"/>
  <polygon points="350,958 370,958 360,974" fill="#617086"/>
  <rect x="72" y="988" width="576" height="112" rx="6" fill="#e6f4ec" stroke="#198754" stroke-width="2"/>
  <text x="360" y="1034" text-anchor="middle" class="h">512 Leaf Switches</text>
  <text x="360" y="1072" text-anchor="middle" class="s">32 per SU × 16 SUs</text>

  <line x1="360" y1="1100" x2="360" y2="1132" stroke="#617086" stroke-width="4"/>
  <polygon points="350,1132 370,1132 360,1148" fill="#617086"/>
  <rect x="72" y="1162" width="576" height="112" rx="6" fill="#f1ebfa" stroke="#7048b0" stroke-width="2"/>
  <text x="360" y="1208" text-anchor="middle" class="h">384 Spine Switches</text>
  <text x="360" y="1246" text-anchor="middle" class="s">24 per SU × 16 SUs</text>

  <line x1="360" y1="1274" x2="360" y2="1306" stroke="#617086" stroke-width="4"/>
  <polygon points="350,1306 370,1306 360,1322" fill="#617086"/>
  <rect x="72" y="1336" width="576" height="94" rx="6" fill="#fff0e5" stroke="#d96513" stroke-width="2"/>
  <text x="360" y="1392" text-anchor="middle" class="h">144 Core Switches</text>

  <rect x="48" y="1456" width="624" height="60" rx="5" fill="#182338"/>
  <text x="360" y="1495" text-anchor="middle" class="b inv">512 Leaf + 384 Spine + 144 Core = 1,040</text>
</svg>
