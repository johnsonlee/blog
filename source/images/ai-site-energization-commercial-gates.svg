<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">从申请到升载的商业 Gate</title><desc id="desc">研究费、担保、开工、实际送电和最低收费形成不同付款节点。</desc><rect width="1440" height="900" fill="#F7F9FC"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}</style><text x="60" y="70" fill="#5E6B7E" font-size="24" font-weight="800" text-anchor="start"><tspan x="60" dy="0">付款节点不在公告里的 GW，而在合同与送电条件</tspan></text><rect x="55" y="125" width="230" height="105" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="170" y="185.5" fill="#172033" font-size="21" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">研究申请</tspan></text><line x1="285" y1="178" x2="316" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="330,178 316,171 316,185" fill="#26364D"/><rect x="55" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="170" y="341.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">$10k / $50k / $100k</tspan><tspan x="170" dy="30">未付款则退出队列</tspan></text><line x1="170" y1="230" x2="170" y2="285" stroke="#C93E4F" stroke-width="3"/><rect x="330" y="125" width="230" height="105" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="445" y="185.5" fill="#172033" font-size="21" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">LOA + ESA</tspan></text><line x1="560" y1="178" x2="591" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="605,178 591,171 591,185" fill="#26364D"/><rect x="330" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="445" y="341.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">担保 · CIAC</tspan><tspan x="445" dy="30">公用事业开始承诺支出</tspan></text><line x1="445" y1="230" x2="445" y2="285" stroke="#C93E4F" stroke-width="3"/><rect x="605" y="125" width="230" height="105" rx="7" fill="#FFF0CC" stroke="#C77800" stroke-width="2"/><text x="720" y="185.5" fill="#172033" font-size="21" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">NTP / 采购</tspan></text><line x1="835" y1="178" x2="866" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="880,178 866,171 866,185" fill="#26364D"/><rect x="605" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="720" y="341.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">长周期设备排产</tspan><tspan x="720" dy="30">取消会留下建设成本</tspan></text><line x1="720" y1="230" x2="720" y2="285" stroke="#C77800" stroke-width="3"/><rect x="880" y="125" width="230" height="105" rx="7" fill="#DDF4EC" stroke="#0F8A6A" stroke-width="2"/><text x="995" y="185.5" fill="#172033" font-size="21" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">实际送电</tspan></text><line x1="1110" y1="178" x2="1141" y2="178" stroke="#26364D" stroke-width="3" stroke-linecap="round"/><polygon points="1155,178 1141,171 1141,185" fill="#26364D"/><rect x="880" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="995" y="341.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="995" dy="0">ESA 期限开始</tspan><tspan x="995" dy="30">最低收费开始生效</tspan></text><line x1="995" y1="230" x2="995" y2="285" stroke="#0F8A6A" stroke-width="3"/><rect x="1155" y="125" width="230" height="105" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="1270" y="185.5" fill="#172033" font-size="21" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">分阶段升载</tspan></text><rect x="1155" y="285" width="230" height="125" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1270" y="341.5" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="1270" dy="0">50% → 65% → 80% → 90%</tspan><tspan x="1270" dy="30">容量与最低账单逐年爬坡</tspan></text><line x1="1270" y1="230" x2="1270" y2="285" stroke="#2563EB" stroke-width="3"/><text x="55" y="505" fill="#5E6B7E" font-size="23" font-weight="800" text-anchor="start"><tspan x="55" dy="0">谁在何时形成收入与回报？</tspan></text><rect x="55" y="545" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="586" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">公用事业 / 输电业主</tspan></text><rect x="345" y="545" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="586" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">并网资产进入可回收成本或 rate base</tspan></text><rect x="845" y="545" width="540" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1115" y="586" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">受监管审批、CIAC 与回收滞后约束</tspan></text><rect x="55" y="621" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="662" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">设备 OEM</tspan></text><rect x="345" y="621" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="662" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">订金 · 发货 · 履约进度</tspan></text><rect x="845" y="621" width="540" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1115" y="662" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">订单质量取决于排产与取消条款</tspan></text><rect x="55" y="697" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="738" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">EPC / Commissioning</tspan></text><rect x="345" y="697" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="738" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">设计 · 安装 · 测试里程碑</tspan></text><rect x="845" y="697" width="540" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="1115" y="738" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">一次性项目收入，通常不分享长期电费</tspan></text><rect x="55" y="773" width="270" height="66" rx="7" fill="#DCE8FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="814" fill="#172033" font-size="18" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">数据中心业主</tspan></text><rect x="345" y="773" width="480" height="66" rx="7" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/><text x="585" y="814" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="585" dy="0">更早可用 MW 的时间价值</tspan></text><rect x="845" y="773" width="540" height="66" rx="7" fill="#FBE3E7" stroke="#C93E4F" stroke-width="2"/><text x="1115" y="814" fill="#172033" font-size="17" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">承担担保、最低负荷与闲置容量风险</tspan></text></svg>
