<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">PORTS-Pike Parallel Plan for the First 800 MW</title><desc id="desc">Site, permits, AEP power, facility design, long-lead equipment, civil and MEP work, commissioning, NVIDIA systems, cluster acceptance, and production handoff can partly overlap for the first 800 MW, but hard gates constrain the sequence.</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:28px;font-weight:760;text-anchor:middle}.head{font-size:16px;font-weight:750}.body{font-size:14px;fill:#52647a}.small{font-size:12px;fill:#607089}.inv{fill:#fff}</style>
  <rect width="1600" height="1080" fill="#f7f9fc"/><text x="800" y="58" class="title">First 800 MW: Parallel Workstreams Must Converge in 2028</text>
  <rect x="35" y="100" width="1530" height="855" rx="7" fill="#fff" stroke="#d5dde7" stroke-width="2"/>
  <text x="65" y="142" class="head">Workstream</text><text x="500" y="142" class="head" text-anchor="middle">2026</text><text x="900" y="142" class="head" text-anchor="middle">2027</text><text x="1320" y="142" class="head" text-anchor="middle">2028+</text>
  <line x1="340" y1="160" x2="340" y2="920" stroke="#d5dde7" stroke-width="2"/><line x1="700" y1="160" x2="700" y2="920" stroke="#e5eaf0" stroke-width="2"/><line x1="1100" y1="160" x2="1100" y2="920" stroke="#e5eaf0" stroke-width="2"/><line x1="1515" y1="160" x2="1515" y2="920" stroke="#e5eaf0" stroke-width="2"/>
  <text x="65" y="215" class="head">Site / Permit</text><rect x="390" y="180" width="470" height="48" rx="5" fill="#b88407"/><text x="625" y="210" class="body inv" text-anchor="middle">Assessment · Review · Authorization</text>
  <text x="65" y="285" class="head">AEP Power</text><rect x="390" y="250" width="570" height="48" rx="5" fill="#2f6fab"/><text x="675" y="280" class="body inv" text-anchor="middle">Service Study · Substation · Permanent Power</text>
  <text x="65" y="355" class="head">Facility Design</text><rect x="390" y="320" width="380" height="48" rx="5" fill="#64748b"/><text x="580" y="350" class="body inv" text-anchor="middle">Basis of Design · Design Freeze</text>
  <text x="65" y="425" class="head">Long-lead Equipment</text><rect x="650" y="390" width="520" height="48" rx="5" fill="#c85a16"/><text x="910" y="420" class="body inv" text-anchor="middle">PO · Manufacture · FAT · Delivery</text>
  <text x="65" y="495" class="head">Civil / Structural</text><rect x="700" y="460" width="440" height="48" rx="5" fill="#7653a6"/><text x="920" y="490" class="body inv" text-anchor="middle">Site Work · Foundation · Dry-in</text>
  <text x="65" y="565" class="head">MEP Installation</text><rect x="930" y="530" width="370" height="48" rx="5" fill="#167d73"/><text x="1115" y="560" class="body inv" text-anchor="middle">Power · Cooling · Controls</text>
  <text x="65" y="635" class="head">Commissioning</text><rect x="1190" y="600" width="210" height="48" rx="5" fill="#c85a16"/><text x="1295" y="630" class="body inv" text-anchor="middle">L1–L5 · RFS</text>
  <text x="65" y="705" class="head">NVIDIA Systems</text><rect x="980" y="670" width="330" height="48" rx="5" fill="#24864a"/><text x="1145" y="700" class="body inv" text-anchor="middle">Plan · Ship · Rack Energize</text>
  <text x="65" y="775" class="head">Cluster Acceptance</text><rect x="1280" y="740" width="170" height="48" rx="5" fill="#24864a"/><text x="1365" y="770" class="small inv" text-anchor="middle">Fabric · Storage · Burn-in</text>
