<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>.title{font:700 36px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.kicker{font:600 20px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#52647a}.num{font:700 58px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.head{font:700 25px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.body{font:500 21px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#52647a}.small{font:500 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#52647a}.inv{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="800" y="62" class="title" text-anchor="middle">过去要一组 Site，今天只写了一座 Campus</text>
  <text x="800" y="103" class="kicker" text-anchor="middle">同为 OpenAI 公开的规划容量量级</text>

  <rect x="85" y="155" width="650" height="570" rx="7" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="125" y="205" class="head">2025 年 9 月 · 前一轮 Stargate</text>
  <text x="125" y="242" class="body">六座 Campus + CoreWeave projects</text>
  <g>
    <rect x="105" y="285" width="175" height="90" rx="6" fill="#2f6fab"/><text x="192" y="324" class="head inv" text-anchor="middle">Abilene</text><text x="192" y="353" class="small inv" text-anchor="middle">Texas</text>
    <rect x="302" y="285" width="175" height="90" rx="6" fill="#7653a6"/><text x="389" y="324" class="body inv" text-anchor="middle">Shackelford</text><text x="389" y="353" class="small inv" text-anchor="middle">Texas</text>
    <rect x="499" y="285" width="175" height="90" rx="6" fill="#167d73"/><text x="586" y="324" class="head inv" text-anchor="middle">Doña Ana</text><text x="586" y="353" class="small inv" text-anchor="middle">New Mexico</text>
    <rect x="105" y="400" width="175" height="90" rx="6" fill="#b88407"/><text x="192" y="439" class="head inv" text-anchor="middle">Lighthouse</text><text x="192" y="468" class="small inv" text-anchor="middle">Wisconsin</text>
    <rect x="302" y="400" width="175" height="90" rx="6" fill="#64748b"/><text x="389" y="439" class="head inv" text-anchor="middle">Lordstown</text><text x="389" y="468" class="small inv" text-anchor="middle">Ohio</text>
    <rect x="499" y="400" width="175" height="90" rx="6" fill="#24864a"/><text x="586" y="439" class="body inv" text-anchor="middle">Milam County</text><text x="586" y="468" class="small inv" text-anchor="middle">Texas</text>
    <rect x="105" y="515" width="569" height="44" rx="5" fill="#e5eaf0"/><text x="389" y="543" class="small" text-anchor="middle">另含 ongoing CoreWeave projects</text>
  </g>
  <text x="410" y="625" class="num" fill="#2f6fab" text-anchor="middle">接近 7GW</text>
  <text x="410" y="668" class="body" text-anchor="middle">Planned Capacity</text>

  <text x="800" y="445" class="num" fill="#94a3b8" text-anchor="middle">vs.</text>

  <rect x="865" y="155" width="650" height="570" rx="7" fill="#fff" stroke="#d8bd70" stroke-width="2"/>
  <text x="905" y="205" class="head">2026 年 8 月 · PORTS-Pike</text>
  <text x="905" y="242" class="body">一座 Technology Campus</text>
  <rect x="965" y="300" width="450" height="260" rx="7" fill="#c85a16"/>
  <text x="1190" y="415" class="num inv" text-anchor="middle">8 IT-GW</text>
  <text x="1190" y="462" class="head inv" text-anchor="middle">OpenAI 租赁目标</text>
  <text x="1190" y="505" class="small inv" text-anchor="middle">六年分期建设至 2032 年</text>
  <text x="1190" y="625" class="head" text-anchor="middle">单一 Campus · Portfolio 规模</text>
  <text x="1190" y="668" class="body" text-anchor="middle">约占 OpenAI 2030 年 30GW 目标的 27%</text>

  <rect x="180" y="790" width="1240" height="64" rx="6" fill="#172033"/>
  <text x="800" y="830" class="head inv" text-anchor="middle">容量口径并不完全一致；可以比较规模，不能直接做精确加总</text>
</svg>
