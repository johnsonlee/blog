<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Inference cacheability boundary</title><desc id="desc">静态资产可在 CDN Edge 广泛复用，完全相同的 AI request 可缓存，个性化推理通常仍需返回 model origin；prompt、retrieval 和 KV cache 位于不同层。</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0;fill:#172033}.title{font-size:31px;font-weight:760;text-anchor:middle}.head{font-size:18px;font-weight:750;text-anchor:middle}.body{font-size:15px;fill:#52647a;text-anchor:middle}.small{font-size:13px;fill:#607089;text-anchor:middle}.inv{fill:#fff}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="58" class="title">AI 响应能不能缓存，取决于复用边界</text>
  <rect x="55" y="120" width="470" height="610" rx="7" fill="#fff" stroke="#24864a" stroke-width="2"/><text x="290" y="165" class="head">静态资源</text>
  <rect x="115" y="220" width="350" height="88" rx="6" fill="#64748b"/><text x="290" y="257" class="head inv">同一文件 / Segment</text><text x="290" y="286" class="body inv">许多用户重复读取</text>
  <line x1="290" y1="308" x2="290" y2="350" stroke="#52647a" stroke-width="4"/><polygon points="278,350 302,350 290,372" fill="#52647a"/>
  <rect x="115" y="372" width="350" height="100" rx="6" fill="#24864a"/><text x="290" y="412" class="head inv">CDN 边缘缓存</text><text x="290" y="442" class="body inv">命中后不回 Origin</text>
  <rect x="115" y="555" width="350" height="100" rx="6" fill="#e9f5ed" stroke="#24864a" stroke-width="2"/><text x="290" y="595" class="head">高复用</text><text x="290" y="625" class="body">缓存是主要交付路径</text>
  <rect x="565" y="120" width="470" height="610" rx="7" fill="#fff" stroke="#b88407" stroke-width="2"/><text x="800" y="165" class="head">完全相同的 AI Request</text>
  <rect x="625" y="220" width="350" height="88" rx="6" fill="#7653a6"/><text x="800" y="257" class="head inv">相同 Prompt + 参数</text><text x="800" y="286" class="body inv">固定 FAQ · 有限选项</text>
  <line x1="800" y1="308" x2="800" y2="350" stroke="#52647a" stroke-width="4"/><polygon points="788,350 812,350 800,372" fill="#52647a"/>
  <rect x="625" y="372" width="350" height="100" rx="6" fill="#b88407"/><text x="800" y="412" class="head inv">响应缓存</text><text x="800" y="442" class="body inv">仅完全一致时复用</text>
  <rect x="625" y="555" width="350" height="100" rx="6" fill="#fff7df" stroke="#b88407" stroke-width="2"/><text x="800" y="595" class="head">有限复用</text><text x="800" y="625" class="body">适合低动态、低个性化场景</text>
  <rect x="1075" y="120" width="470" height="610" rx="7" fill="#fff" stroke="#c85a16" stroke-width="2"/><text x="1310" y="165" class="head">个性化推理</text>
  <rect x="1135" y="205" width="350" height="128" rx="6" fill="#c85a16"/><text x="1310" y="242" class="head inv">Prompt · 历史 · 检索</text><text x="1310" y="273" class="body inv">Tool · 权限 · 模型版本</text><text x="1310" y="304" class="body inv">采样 · 策略 · 时效性</text>
  <line x1="1310" y1="333" x2="1310" y2="375" stroke="#52647a" stroke-width="4"/><polygon points="1298,375 1322,375 1310,397" fill="#52647a"/>
  <rect x="1135" y="397" width="350" height="100" rx="6" fill="#2f6fab"/><text x="1310" y="437" class="head inv">模型源站</text><text x="1310" y="467" class="body inv">大多数 Request 仍需计算</text>
  <rect x="1135" y="555" width="350" height="100" rx="6" fill="#fff3ea" stroke="#c85a16" stroke-width="2"/><text x="1310" y="595" class="head">分层复用</text><text x="1310" y="625" class="body">Retrieval · Prompt · KV 各有边界</text>
  <rect x="170" y="785" width="1260" height="70" rx="6" fill="#172033"/><text x="800" y="816" class="head inv">推理交付的核心不是缓存所有答案，而是把 Request 送到持有正确 State 的 Capacity</text><text x="800" y="844" class="small inv">缓存命中条件、隐私边界与计费事件必须分层记录</text>
</svg>
