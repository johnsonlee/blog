  <line x1="860" y1="204" x2="890" y2="204" stroke="#52647a" stroke-width="3"/><line x1="890" y1="204" x2="890" y2="452" stroke="#52647a" stroke-width="3"/><polygon points="878,452 902,452 890,473" fill="#52647a"/>
  <line x1="1140" y1="508" x2="1140" y2="516" stroke="#52647a" stroke-width="3"/><polygon points="1131,516 1149,516 1140,530" fill="#52647a"/>
  <line x1="1300" y1="554" x2="1325" y2="554" stroke="#52647a" stroke-width="3"/><line x1="1325" y1="554" x2="1325" y2="592" stroke="#52647a" stroke-width="3"/><polygon points="1313,592 1337,592 1325,613" fill="#52647a"/>
  <line x1="1400" y1="648" x2="1400" y2="732" stroke="#52647a" stroke-width="3"/><polygon points="1388,732 1412,732 1400,753" fill="#52647a"/>
  <line x1="1310" y1="694" x2="1335" y2="694" stroke="#52647a" stroke-width="3"/><line x1="1335" y1="694" x2="1335" y2="732" stroke="#52647a" stroke-width="3"/><polygon points="1323,732 1347,732 1335,753" fill="#52647a"/>
  <line x1="1450" y1="764" x2="1472" y2="764" stroke="#52647a" stroke-width="3"/><line x1="1472" y1="764" x2="1472" y2="802" stroke="#52647a" stroke-width="3"/><polygon points="1460,802 1484,802 1472,823" fill="#52647a"/>
  <text x="800" y="940" class="small" text-anchor="middle">顺序示意；官方未披露各工作流的月度计划</text>
  <rect x="180" y="985" width="1240" height="58" rx="6" fill="#172033"/><text x="800" y="1021" class="head inv" text-anchor="middle">关键路径取决于最后关闭的许可、电力、设施、调试或集群验收</text>
</svg>
